<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intranet USC · Central de Módulos</title>
<style>
  :root {
    --azul-900: #0f2460;
    --azul-800: #12295c;
    --azul-600: #1a3a7c;
    --azul-100: #e8edfb;

    --fundo:    #f5f7fa;
    --papel:    #ffffff;
    --borda:    #e2e7f0;
    --borda-forte: #cfd7e6;

    --tinta:    #14192b;
    --tinta-2:  #5a6478;
    --tinta-3:  #8b93a5;

    --raio:     12px;
    --sombra:   0 1px 2px rgba(16,26,51,.05);
    --sombra-alta: 0 10px 28px rgba(16,26,51,.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--fundo);
    color: var(--tinta);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Cabeçalho ──────────────────────────────────────────────────────────
     Cor chapada em vez de gradiente: gradiente em barra de topo é a marca
     mais rápida de site datado, e não carrega informação nenhuma. */
  .header {
    background: var(--azul-900);
    color: #fff;
    padding: 0 32px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 20;
  }
  .header-left { display: flex; align-items: center; gap: 13px; }
  .header-logo {
    width: 36px; height: 36px; border-radius: 8px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 4px; flex-shrink: 0;
  }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 15px; font-weight: 650; letter-spacing: .1px; }
  .header-sub {
    font-size: 11px; color: rgba(255,255,255,.55); margin-top: 1px;
    text-transform: uppercase; letter-spacing: .9px; font-weight: 600;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }

  /* O usuário vira um item clicável de verdade — antes era um texto com
     sublinhado que só aparecia no hover, e nada dizia que levava a algum
     lugar. */
  .chip-user {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 12px 6px 6px; border-radius: 999px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.10);
    color: rgba(255,255,255,.92); font-size: 13px; font-weight: 600;
    text-decoration: none; transition: background .15s, border-color .15s;
  }
  .chip-user:hover { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.22); }
  .chip-user .avatar {
    width: 25px; height: 25px; border-radius: 50%; flex: none;
    background: var(--azul-600); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: .3px;
  }
  .btn-sair {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.16);
    background: transparent; color: rgba(255,255,255,.78);
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .btn-sair:hover { background: rgba(220,68,68,.16); border-color: rgba(220,68,68,.45); color: #fff; }

  /* ── Conteúdo ── */
  .conteudo { max-width: 1180px; margin: 0 auto; padding: 34px 24px 60px; }

  .saudacao {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap; margin-bottom: 26px;
  }
  .saudacao h1 { font-size: 25px; font-weight: 700; letter-spacing: -.4px; }
  .saudacao .dia {
    font-size: 13.5px; color: var(--tinta-2); margin-top: 5px;
  }

  /* Busca: com quinze módulos na tela, ler todos para achar um é o que
     cansa. Filtrar por nome resolve sem tirar nada do lugar. */
  .busca-wrap { position: relative; flex: 0 0 300px; max-width: 100%; }
  .busca-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--tinta-3); pointer-events: none;
  }
  .busca {
    width: 100%; padding: 10px 12px 10px 36px;
    border: 1px solid var(--borda-forte); border-radius: 9px;
    background: var(--papel); color: var(--tinta);
    font-size: 13.5px; font-family: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .busca::placeholder { color: var(--tinta-3); }
  .busca:focus { border-color: var(--azul-600); box-shadow: 0 0 0 3px rgba(26,58,124,.12); }

  /* ── Categoria ──
     Rótulo curto com uma régua atravessando: separa as seções sem gastar um
     bloco colorido para cada uma. */
  .categoria-bloco { margin-bottom: 30px; }
  .categoria-bloco:last-child { margin-bottom: 0; }
  .categoria-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  }
  .categoria-nome {
    font-size: 12px; font-weight: 700; color: var(--tinta-2);
    text-transform: uppercase; letter-spacing: 1.2px; white-space: nowrap;
  }
  .categoria-header .regua { flex: 1; height: 1px; background: var(--borda); }
  .categoria-header .qtde {
    font-size: 12px; color: var(--tinta-3); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .modulos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 14px;
  }

  /* ── Cartão do módulo ──
     É um <a> de verdade: abrir em outra aba com o botão do meio ou com
     ctrl+clique passa a funcionar, e o teclado alcança pelo tab. Com div e
     onclick nada disso existia. */
  .modulo-card {
    display: flex; align-items: flex-start; gap: 14px;
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: 16px 16px 16px 15px;
    text-decoration: none; color: inherit;
    box-shadow: var(--sombra);
    transition: border-color .16s, box-shadow .16s;
    position: relative;
  }
  .modulo-card:hover { border-color: var(--borda-forte); box-shadow: var(--sombra-alta); }
  .modulo-card:focus-visible { outline: 2px solid var(--azul-600); outline-offset: 2px; }

  /* Ícone em bloco discreto de cor plana. O quadrado com gradiente escuro de
     antes puxava mais atenção que o nome do módulo, que é o que se procura. */
  .modulo-icone {
    width: 38px; height: 38px; border-radius: 9px; flex: none;
    background: var(--azul-100); color: var(--azul-600);
    display: flex; align-items: center; justify-content: center;
  }
  /* São <span> por estarem dentro de um <a> — e span é inline por padrão, o
     que deixaria nome e descrição na mesma linha e faria a margem sumir. */
  .modulo-texto { flex: 1; min-width: 0; display: block; }
  .modulo-nome {
    display: block;
    font-size: 14.5px; font-weight: 650; color: var(--tinta);
    line-height: 1.3; letter-spacing: -.1px;
  }
  .modulo-desc {
    display: block;
    font-size: 12.5px; color: var(--tinta-2); line-height: 1.45; margin-top: 3px;
  }
  /* A seta só aparece no hover: presente o tempo todo, quinze setas iguais
     viram ruído; no hover ela confirma para onde o clique leva. */
  .modulo-seta {
    flex: none; align-self: center; color: var(--tinta-3);
    opacity: 0; transform: translateX(-3px);
    transition: opacity .16s, transform .16s;
  }
  .modulo-card:hover .modulo-seta { opacity: 1; transform: translateX(0); }

  .modulo-card.oculto { display: none; }
  .categoria-bloco.oculto { display: none; }

  /* ── Menu fixo à esquerda ──
     Com o menu à vista, os cartões no meio repetem item por item o que já
     está na lateral. Some com eles e com a busca: navegar passa a ser um
     lugar só.

     Continuam existindo quando o menu NÃO está fixo (celular, janela
     estreita) — ali a lateral fica recolhida e os cartões são a única
     forma de chegar aos módulos.

     A classe snav-fixo é posta pelo js/sidebar-nav.js, que é quem sabe se
     coube fixar. */
  html.snav-fixo #hub-container,
  html.snav-fixo #buscaWrap { display: none; }
  html.snav-fixo .conteudo {
    min-height: calc(100vh - 62px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-bottom: 90px;                 /* sobe o bloco do centro óptico */
  }
  html.snav-fixo .saudacao { display: block; text-align: center; margin-bottom: 0; }
  html.snav-fixo .saudacao h1 { font-size: 30px; }
  html.snav-fixo .dica-menu { display: block; }

  .dica-menu {
    display: none; margin-top: 18px; font-size: 14px; color: var(--tinta-3);
  }
  .dica-menu span {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--papel); border: 1px solid var(--borda);
    border-radius: 999px; padding: 9px 18px; box-shadow: var(--sombra);
  }

  /* ── Estados ── */
  .estado { text-align: center; padding: 70px 20px; color: var(--tinta-3); }
  .estado svg { width: 48px; height: 48px; margin-bottom: 14px; opacity: .45; }
  .estado p { font-size: 14px; line-height: 1.6; }
  .spinner {
    width: 28px; height: 28px; border: 2.5px solid var(--borda);
    border-top-color: var(--azul-600); border-radius: 50%;
    margin: 0 auto 14px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .header { padding: 0 16px; height: auto; min-height: 58px; }
    .header-right { margin-right: 48px; }
    .chip-user span.nome { display: none; }
    .conteudo { padding: 24px 16px 48px; }
    .saudacao h1 { font-size: 21px; }
    .busca-wrap { flex: 1 1 100%; }
  }
</style>
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="img/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="img/apple-touch-icon-167.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="USC">
  <meta name="theme-color" content="#0f2460">
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Usina Santa Clotilde S/A</div>
      <div class="header-sub">Intranet</div>
    </div>
  </div>
  <div class="header-right">
    <a class="chip-user" id="chipUsuario" href="minha-conta.html" title="Minha conta">
      <span class="avatar" id="avatarUsuario">·</span>
      <span class="nome" id="nomeUsuario">…</span>
    </a>
    <button class="btn-sair" onclick="sair()">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
      Sair
    </button>
  </div>
</div>

<div class="conteudo">
  <div class="saudacao">
    <div>
      <h1 id="saudacaoTexto">Central de Módulos</h1>
      <div class="dia" id="saudacaoDia"></div>
    </div>
    <div class="busca-wrap" id="buscaWrap" style="display:none">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="busca" id="busca" type="search" placeholder="Buscar módulo…"
             autocomplete="off" oninput="filtrar()">
    </div>
  </div>

  <div class="dica-menu" id="dicaMenu">
    <span>
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Escolha um módulo no menu ao lado
    </span>
  </div>

  <div id="hub-container">
    <div class="estado">
      <div class="spinner"></div>
      <p>Carregando módulos disponíveis…</p>
    </div>
  </div>
</div>

<script src="js/icones-modulos.js?v=20260819a"></script>
<script>
// Os ícones vêm de js/icones-modulos.js — o mesmo arquivo que o menu
// lateral usa. Antes cada tela tinha a sua tabela, e as duas divergiam.
const svg = (nome, tam) => window.IconesModulos.svg(nome, tam);
const iconeDoModulo = mod => window.IconesModulos.doModulo(mod, 19);

// ── Sessão e saudação ─────────────────────────────────────────────────────
fetch('api/sessao').then(r => r.json()).then(j => {
  if (!j || !j.logon) { window.location.href = 'login.html'; return; }
  const nome = j.nome || j.logon;
  document.getElementById('nomeUsuario').textContent = nome;
  document.getElementById('avatarUsuario').textContent = iniciais(nome);
  document.getElementById('saudacaoTexto').textContent = saudacao() + ', ' + primeiroNome(nome);
}).catch(() => {});

function iniciais(nome) {
  const p = String(nome).trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '·';
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function primeiroNome(nome) {
  return String(nome).trim().split(/\s+/)[0] || nome;
}
function saudacao() {
  const h = new Date().getHours();
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}

(function mostrarData() {
  const d = new Date();
  const txt = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  document.getElementById('saudacaoDia').textContent = txt.charAt(0).toUpperCase() + txt.slice(1);
})();

function sair() {
  fetch('api/login').finally(() => { window.location.href = 'login.html'; });
}

// ── Módulos ───────────────────────────────────────────────────────────────
fetch('api/hub').then(r => r.json()).then(j => {
  const container = document.getElementById('hub-container');

  if (!j.ok) {
    container.innerHTML = '<div class="estado"><p>Não foi possível carregar os módulos.<br>'
                        + escapeHtml(j.erro || '') + '</p></div>';
    return;
  }

  if (!j.categorias || !j.categorias.length) {
    container.innerHTML = `
      <div class="estado">
        ${svg('grid', 48)}
        <p>Você ainda não tem acesso a nenhum módulo.<br>
           Solicite ao administrador a liberação do acesso.</p>
      </div>`;
    return;
  }

  container.innerHTML = j.categorias.map(cat => `
    <div class="categoria-bloco">
      <div class="categoria-header">
        <span class="categoria-nome">${escapeHtml(cat.nome)}</span>
        <span class="regua"></span>
        <span class="qtde">${cat.modulos.length}</span>
      </div>
      <div class="modulos-grid">
        ${cat.modulos.map(mod => `
          <a class="modulo-card" href="${escapeAttr(mod.urlDestino)}"
             data-busca="${escapeAttr(((mod.nome || '') + ' ' + (mod.descricao || '')).toLowerCase())}">
            <span class="modulo-icone">${iconeDoModulo(mod)}</span>
            <span class="modulo-texto">
              <span class="modulo-nome">${escapeHtml(mod.nome)}</span>
              ${mod.descricao ? `<span class="modulo-desc">${escapeHtml(mod.descricao)}</span>` : ''}
            </span>
            <span class="modulo-seta">
              ${svg('chevron', 17)}
            </span>
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');

  // A busca só faz sentido quando há bastante coisa para procurar.
  const total = j.categorias.reduce((n, c) => n + c.modulos.length, 0);
  if (total >= 8) document.getElementById('buscaWrap').style.display = '';
});

/** Esconde os cartões que não casam, e a categoria que ficou sem nenhum. */
function filtrar() {
  const termo = (document.getElementById('busca').value || '').trim().toLowerCase();
  document.querySelectorAll('.categoria-bloco').forEach(bloco => {
    let visiveis = 0;
    bloco.querySelectorAll('.modulo-card').forEach(card => {
      const casa = !termo || (card.dataset.busca || '').includes(termo);
      card.classList.toggle('oculto', !casa);
      if (casa) visiveis++;
    });
    bloco.classList.toggle('oculto', visiveis === 0);
    const qtde = bloco.querySelector('.qtde');
    if (qtde) qtde.textContent = visiveis;
  });
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/** Para dentro de aspas duplas de atributo — inclusive href. */
function escapeAttr(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                  .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>

<script src="js/sidebar-nav.js?v=20260819a" defer></script>
<script src="js/agro-chat-widget.js" defer></script>
</body>
</html>
