<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrada de Cana — Usina Santa Clotilde</title>
<link rel="icon" href="img/logo.png">
<style>
/* ────────────────────────────────────────────────────────────────────────
   Painel de televisão.

   O palco tem 1920×1080 fixos e é ESCALADO para caber na tela, em vez de
   se reorganizar. Numa TV ninguém corrige layout quebrado: o que se vê é o
   que fica o dia inteiro. Escalando, o painel sai idêntico em qualquer
   resolução — 4K, 1366×768 ou a janela do navegador de quem for conferir.

   Tema escuro fixo, e não "escuro se o sistema estiver escuro": a TV não
   tem sistema, tem parede.
   ──────────────────────────────────────────────────────────────────────── */
  :root {
    /* Mesma combinação do dashboard de combustível: fundo claro, cartões
       brancos, tinta azul-marinho nos números e a paleta categórica nos
       passos CLAROS — os escuros de antes eram feitos para fundo preto. */
    --fundo:      #f4f6fb;
    --papel:      #ffffff;
    --papel-2:    #f8faff;   /* fundo dos blocos de número */
    --borda:      #e3e8f5;
    --grade:      #e9edf6;

    --ink:        #0f2460;   /* números e títulos */
    --ink-2:      #52514e;
    --ink-3:      #898781;
    --rotulo:     #64748b;

    /* Origem da cana — slots 1 a 4 da paleta categórica, passos claros.
       Ordem fixa: filtrar ou reordenar não pode repintar ninguém. */
    --origem-propria:    #2a78d6;
    --origem-fornecedor: #eb6834;
    --origem-acionista:  #1baf7a;
    --origem-outros:     #eda100;

    /* Colheita — slots 5 e 6, fora da faixa das origens: na mesma tela,
       repetir o azul da "Própria" em "Mecanizada" faria o olho ligar duas
       coisas sem relação. */
    --colheita-mec:    #e87ba4;
    --colheita-manual: #008300;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--fundo);
    color: var(--ink-2);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;                 /* TV não rola */
    font-variant-numeric: tabular-nums;
  }

  #palco-wrap { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
  /* Centrado por posição absoluta, e não por grid/flex: um item MAIOR que o
     container não é centrado por place-items — ele encosta no início e vaza.
     Com left/top 50% + translate(-50%,-50%) o ponto de ancoragem é o centro
     do palco em qualquer tamanho, que é o que a escala precisa. */
  #palco {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    padding: 36px 44px 34px;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 20px;
  }

  /* ── Cabeçalho ── */
  .topo { display: flex; align-items: center; gap: 20px;
          padding-bottom: 18px; border-bottom: 1px solid var(--borda); }
  .topo img { width: 58px; height: 58px; object-fit: contain; background: var(--ink);
              border-radius: 12px; padding: 6px; }
  .topo h1 { font-size: 38px; font-weight: 750; letter-spacing: -.4px; color: var(--ink); }
  .topo .sub { font-size: 17px; color: var(--ink-3); margin-top: 3px;
               letter-spacing: .2px; }
  .topo .direita { margin-left: auto; text-align: right; }
  /* Continua com cara de selo — na TV ninguém vai clicar. Mas é um select
     de verdade, para quem abrir o painel no computador poder conferir outra
     safra sem mexer na URL. */
  .selo-safra { font-size: 26px; font-weight: 700; color: var(--ink);
                background: var(--papel); border: 1px solid var(--borda);
                border-radius: 10px; padding: 7px 18px; display: inline-block;
                font-family: inherit; cursor: pointer; appearance: none;
                text-align: center; text-align-last: center; letter-spacing: .2px; }
  .selo-safra:hover { border-color: #b9c6e0; }
  .selo-safra:focus { outline: 2px solid var(--origem-propria); outline-offset: 2px; }
  .relogio { font-size: 15px; color: var(--ink-3); margin-top: 8px; letter-spacing: .2px; }

  /* ── Cartões de número ── */
  .numeros { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 16px; }
  .cartao { background: var(--papel); border: 1px solid var(--borda);
            border-radius: 16px; padding: 18px 22px 20px; position: relative; overflow: hidden; }
  /* O acento de cor é uma marca, não um bloco: 3px bastam para ligar o
     cartão à sua série no gráfico. O texto fica sempre em tinta de texto. */
  .cartao::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .cartao .rot { font-size: 15px; color: var(--rotulo); font-weight: 700;
                 text-transform: uppercase; letter-spacing: 1.1px; }
  .cartao .num { font-size: 54px; font-weight: 750; line-height: 1.05; margin-top: 10px;
                 letter-spacing: -1.5px; color: var(--ink); }
  .cartao .un  { font-size: 20px; font-weight: 600; color: var(--ink-3);
                 margin-left: 7px; letter-spacing: 0; }
  .cartao .pct { font-size: 17px; color: var(--ink-2); margin-top: 8px;
                 display: flex; align-items: center; gap: 8px; }
  .cartao .pct i { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* O cartão do total não muda de cor — muda de peso, como a faixa
     "GERAL CONSOLIDADO" do relatório de combustível. */
  .cartao.total { background: var(--papel-2); border-color: #d6dff0; }
  .cartao.total::before { background: var(--origem-propria); width: 4px; }
  .cartao.total .rot { color: var(--ink); }
  .cartao.total .num { font-size: 78px; letter-spacing: -2.5px; }

  .cartao.propria::before    { background: var(--origem-propria); }
  .cartao.propria .pct i     { background: var(--origem-propria); }
  .cartao.fornecedor::before { background: var(--origem-fornecedor); }
  .cartao.fornecedor .pct i  { background: var(--origem-fornecedor); }
  .cartao.acionista::before  { background: var(--origem-acionista); }
  .cartao.acionista .pct i   { background: var(--origem-acionista); }
  .cartao.outros::before     { background: var(--origem-outros); }
  .cartao.outros .pct i      { background: var(--origem-outros); }

  /* ── Gráfico ── */
  .grafico { background: var(--papel); border: 1px solid var(--borda);
             border-radius: 16px; padding: 20px 26px 16px; display: flex; flex-direction: column; }
  .grafico .cab { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .grafico h2, .colheita h2 { font-size: 20px; font-weight: 700; letter-spacing: .2px; color: var(--ink); }
  .grafico .dica, .colheita .dica { font-size: 14px; color: var(--ink-3);
                                    text-transform: uppercase; letter-spacing: 1px;
                                    font-weight: 600; }
  .legenda { display: flex; gap: 26px; margin-left: auto; }
  .legenda span { display: flex; align-items: center; gap: 9px; font-size: 16px;
                  color: var(--ink-2); font-weight: 600; }
  .legenda i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .tela-grafico { flex: 1; position: relative; min-height: 0; }
  /* Safra que ainda não começou: um eixo vazio com marcas "2, 1, 0" parece
     defeito. Uma frase diz o que está acontecendo. */
  .sem-dado { display: none; position: absolute; inset: 0; place-items: center;
              font-size: 26px; color: var(--ink-3); font-weight: 600; }
  .sem-dado.on { display: grid; }

  /* ── Faixa da colheita ── */
  .colheita { background: var(--papel); border: 1px solid var(--borda);
              border-radius: 16px; padding: 18px 26px 20px; }
  .colheita .cab { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; }
  .barra-split { display: flex; height: 46px; border-radius: 8px; overflow: hidden;
                 background: var(--grade); gap: 3px; }
  /* O vão de 2px entre os pedaços é a superfície aparecendo: sem ele, duas
     cores encostadas viram uma terceira na borda, à distância da TV. */
  .barra-split div { display: flex; align-items: center; padding: 0 18px;
                     font-size: 21px; font-weight: 700; white-space: nowrap;
                     letter-spacing: .2px; color: #1a1a2e; }
  /* Só o verde é escuro o bastante para texto branco (4,95:1). No magenta o
     branco daria 2,69:1 e no amarelo 2,17:1 — ilegíveis à distância de uma
     TV, que é justamente onde este painel vive. */
  .barra-split .manual { color: #ffffff; }
  .barra-split .mec    { background: var(--colheita-mec); }
  .barra-split .manual { background: var(--colheita-manual); justify-content: flex-end; }
  .colheita .abaixo { display: flex; justify-content: space-between; margin-top: 12px;
                      font-size: 17px; color: var(--ink-2); }
  .colheita .abaixo b { color: var(--ink); font-size: 19px; font-weight: 700; }

  /* ── Estados ── */
  .aviso { position: fixed; inset: 0; display: none; place-items: center;
           background: rgba(244,246,251,.96); z-index: 50; text-align: center; padding: 40px; }
  .aviso.on { display: grid; }
  .aviso .cx { max-width: 900px; }
  .aviso h3 { font-size: 40px; margin-bottom: 14px; color: var(--ink); }
  .aviso p  { font-size: 22px; color: var(--ink-2); line-height: 1.5; }
  .tarja-velha { position: fixed; top: 0; left: 0; right: 0; background: #eda100;
                 color: #1a1a19; font-size: 18px; font-weight: 700; text-align: center;
                 padding: 7px; display: none; z-index: 40; }
  .tarja-velha.on { display: block; }
</style>
</head>
<body>

<div class="tarja-velha" id="tarjaVelha"></div>

<div id="palco-wrap">
<div id="palco">

  <div class="topo">
    <img src="img/logo.png" alt="USC">
    <div>
      <h1>Entrada de Cana</h1>
      <div class="sub">Usina Santa Clotilde · acompanhamento da safra</div>
    </div>
    <div class="direita">
      <select class="selo-safra" id="selSafra" onchange="trocarSafra(this.value)">
        <option>Safra —</option>
      </select>
      <div class="relogio" id="relogio">—</div>
    </div>
  </div>

  <div class="numeros" id="numeros"></div>

  <div class="grafico">
    <div class="cab">
      <h2>Mês a mês, por origem</h2>
      <span class="dica">toneladas · o número acima de cada mês é o total</span>
      <div class="legenda" id="legenda"></div>
    </div>
    <div class="tela-grafico">
      <canvas id="grafMeses"></canvas>
      <div class="sem-dado" id="semMeses">Nenhuma entrada registrada nesta safra ainda</div>
    </div>
  </div>

  <div class="colheita">
    <div class="cab"><h2>Colheita</h2><span class="dica">do total da safra</span></div>
    <div class="barra-split" id="barraColheita"></div>
    <div class="abaixo" id="abaixoColheita"></div>
  </div>

</div>
</div>

<div class="aviso" id="aviso"><div class="cx">
  <h3 id="avisoTit">Carregando…</h3>
  <p id="avisoTxt">Consultando a entrada de cana da safra.</p>
</div></div>

<script src="js/chart.umd.min.js"></script>
<script>
// Safra com que o painel ABRE. O seletor no canto troca para qualquer outra
// sem recarregar a página, e ?safra=76 na URL também vence — útil para deixar
// uma segunda TV noutra safra sem mexer no arquivo.
const SAFRA_PADRAO = '75';
// De quanto em quanto tempo o painel se atualiza sozinho. Cinco minutos: a
// cana entra o dia todo, mas ninguém acompanha tonelada a tonelada de uma TV.
const INTERVALO_MS = 5 * 60 * 1000;
// A partir daqui o dado na tela é velho o bastante para avisar — é o caso de
// o servidor ter caído e a TV continuar mostrando número de ontem.
const VELHO_MS = 20 * 60 * 1000;

const ORIGENS = [
  { chave: 'propria',    nome: 'Própria',    cor: getComputedStyle(document.documentElement).getPropertyValue('--origem-propria').trim() },
  { chave: 'fornecedor', nome: 'Fornecedor', cor: getComputedStyle(document.documentElement).getPropertyValue('--origem-fornecedor').trim() },
  { chave: 'acionista',  nome: 'Acionista',  cor: getComputedStyle(document.documentElement).getPropertyValue('--origem-acionista').trim() },
  { chave: 'outros',     nome: 'Outros',     cor: getComputedStyle(document.documentElement).getPropertyValue('--origem-outros').trim() }
];

let GRAFICO = null, ULTIMO_OK = 0;
// A safra que está na tela. Começa pela da URL (ou a padrão) e passa a ser a
// que o usuário escolher — sem recarregar a página, para não perder o que já
// está desenhado enquanto a nova consulta não volta.
let SAFRA_ATUAL = null;

/**
 * Topo do eixo num número redondo, mas COLADO no dado.
 *
 * Com passos só de 1, 2 e 5, uma barra de 112 mil subia o eixo para 200 mil e
 * metade do gráfico ficava vazia. Os passos intermediários mantêm o número
 * redondo sem jogar as barras para o rodapé.
 */
function tetoRedondo(v) {
  if (!(v > 0)) return 1;
  const ordem = Math.pow(10, Math.floor(Math.log10(v)));
  for (const passo of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) {
    if (v <= passo * ordem) return passo * ordem;
  }
  return 10 * ordem;
}

const num0 = v => (Number(v) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const num1 = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const esc  = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function safraDaUrl() {
  const p = new URLSearchParams(location.search).get('safra');
  return (p && /^\d+$/.test(p)) ? p : SAFRA_PADRAO;
}

/** Preenche o seletor. Falhar aqui não impede o painel: sem a lista, fica
 *  só a safra atual escrita no seletor, e os números carregam igual. */
async function carregarSafras() {
  const sel = document.getElementById('selSafra');
  try {
    const r = await fetch('api/cana-entrada/safras', { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok || !j.data || !j.data.length) throw new Error('sem safras');
    sel.innerHTML = j.data
      .map(x => `<option value="${esc(x.cod_safra)}">Safra ${esc(x.cod_safra)}${x.atual === 'S' ? ' •' : ''}</option>`)
      .join('');
    // A safra atual pode não estar na lista (safra antiga pedida na URL);
    // nesse caso ela entra como opção para o seletor não mostrar outra coisa.
    if (!j.data.some(x => String(x.cod_safra) === String(SAFRA_ATUAL))) {
      sel.insertAdjacentHTML('afterbegin',
        `<option value="${esc(SAFRA_ATUAL)}">Safra ${esc(SAFRA_ATUAL)}</option>`);
    }
    sel.value = SAFRA_ATUAL;
  } catch (e) {
    sel.innerHTML = `<option value="${esc(SAFRA_ATUAL)}">Safra ${esc(SAFRA_ATUAL)}</option>`;
  }
}

function trocarSafra(safra) {
  if (!safra || !/^\d+$/.test(safra) || safra === SAFRA_ATUAL) return;
  SAFRA_ATUAL = safra;
  // Zera o "já carregou": a safra nova nunca carregou, então uma falha agora
  // deve avisar em vez de deixar na tela o número da safra anterior com o
  // rótulo da nova.
  ULTIMO_OK = 0;
  carregar();
}

/* O palco tem tamanho fixo e é escalado — nunca reorganizado. */
function ajustarEscala() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('palco').style.transform =
    'translate(-50%, -50%) scale(' + s + ')';
}
window.addEventListener('resize', ajustarEscala);

function mostrarAviso(titulo, texto) {
  document.getElementById('avisoTit').textContent = titulo;
  document.getElementById('avisoTxt').textContent = texto;
  document.getElementById('aviso').classList.add('on');
}
function esconderAviso() { document.getElementById('aviso').classList.remove('on'); }

/** Grandes números: total em destaque, origens ao lado. */
function desenharNumeros(d) {
  const porNome = {};
  (d.porOrigem || []).forEach(o => { porNome[o.nome] = o; });

  let html = `
    <div class="cartao total">
      <div class="rot">Cana total da safra</div>
      <div class="num">${num0(d.total)}<span class="un">t</span></div>
      <div class="pct">${(d.meses || []).length} ${(d.meses||[]).length === 1 ? 'mês' : 'meses'} com entrada</div>
    </div>`;

  for (const o of ORIGENS) {
    const v = porNome[o.nome];
    // "Outros" só ocupa espaço na tela quando existe de verdade.
    if (!v && o.chave === 'outros') continue;
    html += `
      <div class="cartao ${o.chave}">
        <div class="rot">${esc(o.nome)}</div>
        <div class="num">${num0(v ? v.toneladas : 0)}<span class="un">t</span></div>
        <div class="pct"><i></i>${num1(v ? v.pct : 0)}% do total</div>
      </div>`;
  }
  document.getElementById('numeros').innerHTML = html;

  const cols = document.querySelectorAll('#numeros .cartao').length;
  document.getElementById('numeros').style.gridTemplateColumns =
    '1.5fr' + ' 1fr'.repeat(Math.max(1, cols - 1));
}

/** Barras empilhadas por mês. Rótulo só no total de cada mês — número em
 *  cada pedaço vira poeira à distância de uma TV. */
function desenharGrafico(d) {
  const meses = d.meses || [];
  const usadas = ORIGENS.filter(o => meses.some(m => Number(m[o.chave]) > 0));

  const vazio = meses.length === 0;
  document.getElementById('semMeses').classList.toggle('on', vazio);
  document.getElementById('grafMeses').style.visibility = vazio ? 'hidden' : 'visible';
  if (vazio) {
    document.getElementById('legenda').innerHTML = '';
    if (GRAFICO) { GRAFICO.destroy(); GRAFICO = null; }
    return;
  }

  document.getElementById('legenda').innerHTML = usadas
    .map(o => `<span><i style="background:${o.cor}"></i>${esc(o.nome)}</span>`).join('');

  const totais = meses.map(m => Number(m.total) || 0);
  // Lado a lado o eixo passa a ser regido pela MAIOR barra, não pela soma do
  // mês. Usar o total como teto deixaria as barras achatadas na metade de
  // baixo do gráfico.
  const maiorBarra = Math.max(1, ...meses.flatMap(m => usadas.map(o => Number(m[o.chave]) || 0)));
  const teto = tetoRedondo(maiorBarra * 1.08);

  const config = {
    type: 'bar',
    data: {
      labels: meses.map(m => m.label),
      datasets: usadas.map(o => ({
        label: o.nome,
        data: meses.map(m => Number(m[o.chave]) || 0),
        backgroundColor: o.cor,
        borderWidth: 0,
        // Ponta arredondada só em cima, ancorada na linha do zero: a base
        // reta é o que faz as barras parecerem apoiadas no eixo.
        borderRadius: { topLeft: 5, topRight: 5, bottomLeft: 0, bottomRight: 0 },
        borderSkipped: 'bottom',
        // O vão entre as barras vizinhas é a superfície do cartão aparecendo.
        // Vem de barPercentage < 1, e não de uma borda colorida: borda come a
        // largura da barra e, nas pequenas, quase não sobra cor.
        barPercentage: 0.84,
        categoryPercentage: 0.74
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      // A folga no topo é onde mora a régua de totais — fora da grade, para
      // não se confundir com valor do eixo.
      layout: { padding: { top: 40 } },
      scales: {
        x: {
          grid: { display: false },
          border: { color: '#d6dff0' },
          ticks: {
            color: '#52514e',
            font: { size: 19, weight: '700' },
            padding: 10,
            callback: (v, i) => meses[i].label
          }
        },
        y: {
          max: teto,
          grid: { color: '#e9edf6', drawTicks: false },
          border: { display: false },
          ticks: {
            color: '#898781', font: { size: 16 },
            maxTicksLimit: 5, padding: 10,
            callback: v => num0(v)
          }
        }
      },
      plugins: {
        legend: { display: false },     // a legenda é a do cabeçalho
        tooltip: { enabled: false }     // TV não tem mouse
      }
    },
    plugins: [{
      // Total do mês acima do grupo. Sem a pilha, nenhuma barra sozinha diz
      // quanto entrou no mês — e é esse o número que se lê de longe. Fica
      // sobre a barra mais alta do grupo, que é onde o olho já está.
      id: 'totalDoMes',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        ctx.save();
        ctx.textAlign = 'center';
        // Todos os totais na MESMA linha, no alto da área do gráfico. Seguindo
        // o topo de cada barra, eles subiam e desciam e o conjunto ficava
        // inquieto — e a altura da barra já é a comparação, o número não
        // precisa repeti-la. Alinhados, viram uma régua que se lê de uma vez.
        const linha = chart.chartArea.top - 14;
        for (let i = 0; i < totais.length; i++) {
          if (!totais[i]) continue;
          let x = 0, n = 0;
          chart.data.datasets.forEach((_, d) => {
            const barra = chart.getDatasetMeta(d).data[i];
            if (!barra) return;
            x += barra.x; n++;
          });
          if (!n) continue;
          ctx.font = '700 23px system-ui, sans-serif';
          ctx.fillStyle = '#0f2460';
          ctx.fillText(num0(totais[i]), x / n, linha);
        }

        // Valor de cada barra, logo acima dela. Menor e em tinta secundária:
        // quem manda na leitura é a régua de totais lá em cima, estes são o
        // detalhe de quem chega perto. Barra baixa demais fica sem rótulo —
        // o número encostaria no vizinho e nenhum dos dois seria lido.
        const alturaUtil = chart.chartArea.bottom - chart.chartArea.top;
        ctx.font = '600 15px system-ui, sans-serif';
        ctx.fillStyle = '#52514e';
        chart.data.datasets.forEach((ds, d) => {
          const meta = chart.getDatasetMeta(d);
          meta.data.forEach((barra, i) => {
            const v = Number(ds.data[i]) || 0;
            if (!v) return;
            // Barra baixa demais: o número encostaria no vizinho de cima.
            if ((chart.chartArea.bottom - barra.y) < alturaUtil * 0.07) return;
            // Barra estreita demais: numa safra de doze meses as barras
            // afinam e os rótulos passam a se sobrepor. Medir o texto contra
            // a largura da barra decide isso sozinho, em vez de eu chutar um
            // número máximo de meses.
            const texto = num0(v);
            const largura = (barra.width || 0) + 6;
            if (ctx.measureText(texto).width > largura) return;
            ctx.fillText(texto, barra.x, barra.y - 7);
          });
        });
        ctx.restore();
      }
    }]
  };

  if (GRAFICO) GRAFICO.destroy();
  GRAFICO = new Chart(document.getElementById('grafMeses'), config);
}

/** Manual × mecanizada: uma barra só, porque é uma divisão de um todo. */
function desenharColheita(d) {
  const por = {};
  (d.porColheita || []).forEach(c => { por[c.nome] = c; });
  const mec = por['Mecanizada'] || { toneladas: 0, pct: 0 };
  const man = por['Manual']     || { toneladas: 0, pct: 0 };
  const out = por['Outros'];

  const total = Number(d.total) || 0;
  const larg = v => total > 0 ? (Number(v) / total * 100) : 0;

  let barra = '';
  // Abaixo de ~8% o rótulo não cabe dentro do pedaço; some do pedaço e fica
  // só na linha de baixo, em vez de vazar por cima da cor vizinha.
  const dentro = (pct, texto) => pct >= 8 ? texto : '';
  if (larg(mec.toneladas) > 0)
    barra += `<div class="mec" style="width:${larg(mec.toneladas)}%">${dentro(larg(mec.toneladas), 'Mecanizada ' + num1(mec.pct) + '%')}</div>`;
  if (larg(man.toneladas) > 0)
    barra += `<div class="manual" style="width:${larg(man.toneladas)}%">${dentro(larg(man.toneladas), 'Manual ' + num1(man.pct) + '%')}</div>`;
  if (out && Number(out.toneladas) > 0)
    barra += `<div style="width:${larg(out.toneladas)}%;background:var(--origem-outros)">${dentro(larg(out.toneladas), 'Outros ' + num1(out.pct) + '%')}</div>`;
  document.getElementById('barraColheita').innerHTML =
    barra || '<div style="width:100%;color:#8b8a80;font-weight:600">Sem colheita registrada na safra</div>';

  // Bolinha na cor da barra, e não emoji: o texto fica em tinta de texto e
  // quem carrega a identidade é a marca colorida ao lado.
  const ponto = cor => `<i style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${cor};margin-right:9px;vertical-align:-1px"></i>`;
  let abaixo = `<span>${ponto('var(--colheita-mec)')}Mecanizada · <b>${num0(mec.toneladas)} t</b> (${num1(mec.pct)}%)</span>`;
  if (out && Number(out.toneladas) > 0)
    abaixo += `<span>${ponto('var(--origem-outros)')}Outros · <b>${num0(out.toneladas)} t</b> (${num1(out.pct)}%)</span>`;
  abaixo += `<span>${ponto('var(--colheita-manual)')}Manual · <b>${num0(man.toneladas)} t</b> (${num1(man.pct)}%)</span>`;
  document.getElementById('abaixoColheita').innerHTML = abaixo;
}

async function carregar() {
  const safra = SAFRA_ATUAL || (SAFRA_ATUAL = safraDaUrl());
  try {
    const r = await fetch('api/cana-entrada?safra=' + encodeURIComponent(safra),
                          { headers: { 'Accept': 'application/json' }, cache: 'no-store' });
    // Sessão caiu (dura 8 h a partir do login). Numa TV, mandar para o
    // formulário de login troca o painel por uma tela que ninguém vai
    // preencher — melhor manter os números e dizer o que houve.
    if (r.status === 401) {
      document.getElementById('tarjaVelha').textContent =
        '⚠ Sessão expirada — faça login novamente neste navegador para o painel voltar a atualizar';
      document.getElementById('tarjaVelha').classList.add('on');
      if (!ULTIMO_OK) mostrarAviso('Sessão expirada', 'Faça login neste navegador para o painel carregar.');
      return;
    }
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Consulta recusada');

    document.getElementById('selSafra').value = String(j.safra);
    document.getElementById('relogio').textContent = 'Atualizado em ' + esc(j.atualizadoEm);

    desenharNumeros(j);
    desenharGrafico(j);
    desenharColheita(j);

    ULTIMO_OK = Date.now();
    esconderAviso();
    document.getElementById('tarjaVelha').classList.remove('on');

  } catch (e) {
    // Uma falha não apaga o painel: o número de cinco minutos atrás vale mais
    // do que uma tela preta na parede. O aviso só sobe quando nunca carregou.
    if (!ULTIMO_OK) {
      mostrarAviso('Não foi possível carregar', String(e && e.message || e));
    }
  } finally {
    conferirIdade();
  }
}

/** Avisa quando o que está na tela ficou velho — TV mostrando número de
 *  ontem sem dizer nada é pior do que TV apagada. */
function conferirIdade() {
  const t = document.getElementById('tarjaVelha');
  if (!ULTIMO_OK) return;
  const idade = Date.now() - ULTIMO_OK;
  if (idade > VELHO_MS) {
    t.textContent = '⚠ Sem atualizar há ' + Math.round(idade / 60000)
                  + ' minutos — o painel pode estar mostrando dado antigo';
    t.classList.add('on');
  } else {
    t.classList.remove('on');
  }
}

ajustarEscala();
SAFRA_ATUAL = safraDaUrl();
carregarSafras();
carregar();
setInterval(carregar, INTERVALO_MS);
setInterval(conferirIdade, 60 * 1000);
</script>
