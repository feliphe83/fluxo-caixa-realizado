<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Gerencial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #e9e9f5; }
  /* O Mapa Gerencial (contexto /mapagerencial) roda embutido aqui, para o menu
     lateral da intranet continuar à vista por cima. */
  #mapa { border: 0; width: 100%; height: 100vh; display: block; }
</style>
</head>
<body>
  <iframe id="mapa" title="Mapa Gerencial"></iframe>

  <script>
    // Pega a URL de entrada já com o token e aponta o iframe DIRETO para o
    // contexto /mapagerencial — assim o cookie de sessão dele é criado sem a
    // cadeia de redirect cruzando /fluxo-caixa (que deixava o iframe em branco).
    (function () {
      var mapa = document.getElementById('mapa');
      fetch('ir-mapa-gerencial?json=1', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (j) { mapa.src = (j && j.ok && j.url) ? j.url : 'ir-mapa-gerencial'; })
        .catch(function () { mapa.src = 'ir-mapa-gerencial'; });
    })();
  </script>

  <script src="js/icones-modulos.js?v=20260826a"></script>
  <script src="js/sidebar-nav.js?v=20260826a" defer></script>
</body>
</html>
