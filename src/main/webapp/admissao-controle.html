<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admissão de Funcionários · USC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0f2460; --ink-2: #52514e; --ink-3: #898781; --borda: #e3e8f5;
    --ok: #14603f; --alerta: #a0641a; --erro: #b23b3b;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #f4f6fb; color: #1a1a2e; }

  .header { background: linear-gradient(135deg, #0f2460 0%, #1a3a7c 100%); color: white; padding: 16px 28px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .header-logo { width: 44px; height: 44px; border-radius: 8px; background: white; display: flex;
                 align-items: center; justify-content: center; overflow: hidden; padding: 5px; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 19px; font-weight: 800; }
  .header-sub { font-size: 12.5px; opacity: .9; margin-top: 3px; font-weight: 600; }
  .btn-voltar { display: flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px;
                border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08);
                color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-voltar:hover { background: rgba(255,255,255,0.18); }

  .conteudo { max-width: 1200px; margin: 0 auto; padding: 22px; }
  .busca-card { background: white; border: 1.5px solid var(--borda); border-radius: 14px;
                padding: 14px 18px; margin-bottom: 18px; display: flex; gap: 14px; align-items: center; }
  .busca-card input { flex: 1; padding: 9px 12px; border: 1.5px solid #d6ddec; border-radius: 8px; font-size: 14px; }

  .lista { display: flex; flex-direction: column; gap: 10px; }
  .card { background: white; border: 1.5px solid var(--borda); border-radius: 14px; overflow: hidden; }
  .card-cab { padding: 14px 18px; display: flex; align-items: center; gap: 16px; cursor: pointer; flex-wrap: wrap; }
  .card-cab:hover { background: #f8faff; }
  .card-nome { font-size: 14.5px; font-weight: 700; color: var(--ink); min-width: 220px; }
  .card-nome .semnome { color: var(--ink-3); font-style: italic; font-weight: 600; }
  .card-cpf { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
  .card-tel { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
  .card-cargo { font-size: 12.5px; color: var(--ink-2); }
  .card-cargo b { color: var(--ink); }
  .card-erp { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .card-erp.sim { background: #eaf7f0; color: var(--ok); }
  .card-erp.nao { background: #f2f0ec; color: var(--ink-3); }
  .progresso { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .barra { width: 120px; height: 8px; background: #eef1f8; border-radius: 4px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--ok); }
  .barra.incompleta i { background: var(--alerta); }
  .progresso-txt { font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
  .seta { color: var(--ink-3); transition: transform .15s; }
  .card.aberto .seta { transform: rotate(90deg); }

  .card-corpo { display: none; border-top: 1px solid var(--borda); padding: 6px 18px 14px; }
  .card.aberto .card-corpo { display: block; }
  .doc-linha { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid #f2f5fb; }
  .doc-linha:last-child { border-bottom: none; }
  .doc-linha-nome { flex: 1; font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .doc-linha-nome .obr { font-size: 10px; font-weight: 700; color: var(--erro); margin-left: 5px; }
  .doc-linha-meta { font-size: 11.5px; color: var(--ink-3); }
  .doc-status-pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .doc-status-pill.enviado { background: #eaf7f0; color: var(--ok); }
  .doc-status-pill.faltando { background: #fdf3e2; color: var(--alerta); }
  .btn-baixar { padding: 6px 12px; border-radius: 7px; border: 1.5px solid #d6ddec; background: white;
                color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn-baixar:hover { border-color: var(--ink); }

  .estado { text-align: center; padding: 50px 20px; color: var(--ink-3); }
  .spinner { width: 30px; height: 30px; border: 3px solid var(--borda); border-top-color: #1a3a7c;
             border-radius: 50%; animation: girar .8s linear infinite; margin: 0 auto 12px; }
  @keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Admissão de Funcionários</div>
      <div class="header-sub">Documentos enviados pelo link público de admissão</div>
    </div>
  </div>
  <button class="btn-voltar" onclick="window.location.href='hub.html'">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Voltar
  </button>
</div>

<div class="conteudo">
  <div class="busca-card">
    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#898781" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="busca" placeholder="Buscar por nome, CPF ou cargo pretendido…" oninput="render()">
  </div>
  <div class="lista" id="lista"><div class="estado"><div class="spinner"></div>Carregando…</div></div>
</div>

<script>
"use strict";

let CANDIDATOS = [];
let ABERTOS = {};
let DETALHES = {};

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function formatarCpf(v) {
  const d = String(v || "").replace(/\D/g, "");
  return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : (v || "");
}
function formatarTelefone(v) {
  const d = String(v || "").replace(/\D/g, "");
  if (d.length === 11) return d.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
  if (d.length === 10) return d.replace(/(\d{2})(\d{4})(\d{4})/, "($1) $2-$3");
  return v || "";
}
function fmtData(iso) {
  try { return new Date(String(iso).replace(" ", "T")).toLocaleString("pt-BR"); } catch (e) { return iso || "—"; }
}

async function carregar() {
  try {
    const r = await fetch("api/admissao-controle/candidatos");
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || "Falha ao consultar");
    CANDIDATOS = j.data || [];
    render();
  } catch (e) {
    document.getElementById("lista").innerHTML =
      '<div class="estado" style="color:var(--erro)">Erro: ' + esc(e.message) + '</div>';
  }
}

function render() {
  const termo = (document.getElementById("busca").value || "").toLowerCase().trim();
  const filtrados = CANDIDATOS.filter(c =>
    !termo
    || (c.nome || "").toLowerCase().includes(termo)
    || (c.cpf || "").includes(termo.replace(/\D/g, ""))
    || (c.cargoPretendido || "").toLowerCase().includes(termo)
    || (c.telefone || "").includes(termo.replace(/\D/g, "")));

  if (!filtrados.length) {
    document.getElementById("lista").innerHTML = '<div class="estado">Nenhum candidato encontrado.</div>';
    return;
  }

  document.getElementById("lista").innerHTML = filtrados.map(c => {
    const pct = c.totalObrigatorios ? Math.round(100 * c.enviadosObrigatorios / c.totalObrigatorios) : 0;
    const completo = c.totalObrigatorios > 0 && c.enviadosObrigatorios >= c.totalObrigatorios;
    return `
    <div class="card ${ABERTOS[c.id] ? "aberto" : ""}" id="card${c.id}">
      <div class="card-cab" onclick="alternar(${c.id})">
        <span class="seta">▶</span>
        <div class="card-nome">${c.nome ? esc(c.nome) : '<span class="semnome">Sem nome informado</span>'}</div>
        <div class="card-cpf">${formatarCpf(c.cpf)}</div>
        <div class="card-tel">${c.telefone ? "📞 " + esc(formatarTelefone(c.telefone)) : "—"}</div>
        <div class="card-cargo">${c.cargoPretendido ? "Cargo: <b>" + esc(c.cargoPretendido) + "</b>" : "—"}</div>
        <span class="card-erp ${c.ligadoAoErp ? "sim" : "nao"}">${c.ligadoAoErp ? "Ligado ao ERP" : "Sem ficha no ERP"}</span>
        <div class="progresso">
          <div class="barra ${completo ? "" : "incompleta"}"><i style="width:${pct}%"></i></div>
          <div class="progresso-txt">${c.enviadosObrigatorios}/${c.totalObrigatorios} obrigatórios</div>
        </div>
      </div>
      <div class="card-corpo" id="corpo${c.id}">
        <div class="estado" style="padding:16px"><div class="spinner"></div>Carregando documentos…</div>
      </div>
    </div>`;
  }).join("");

  Object.keys(ABERTOS).forEach(id => { if (ABERTOS[id]) carregarDetalhe(Number(id)); });
}

function alternar(id) {
  ABERTOS[id] = !ABERTOS[id];
  const card = document.getElementById("card" + id);
  card.classList.toggle("aberto");
  if (ABERTOS[id]) carregarDetalhe(id);
}

async function carregarDetalhe(id) {
  const corpo = document.getElementById("corpo" + id);
  if (!corpo) return;
  if (!DETALHES[id]) {
    try {
      const r = await fetch("api/admissao-controle/candidatos/" + id);
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || "Falha ao detalhar");
      DETALHES[id] = j;
    } catch (e) {
      corpo.innerHTML = '<div class="estado" style="color:var(--erro);padding:16px">Erro: ' + esc(e.message) + '</div>';
      return;
    }
  }
  const det = DETALHES[id];
  corpo.innerHTML = (det.documentos || []).map(d => `
    <div class="doc-linha">
      <div class="doc-linha-nome">${esc(d.nome)}${d.obrigatorio ? '<span class="obr">obrigatório</span>' : ""}</div>
      ${d.enviado
        ? `<div class="doc-linha-meta">${esc(d.nomeArquivoOriginal || "")} · ${fmtData(d.enviadoEm)}</div>
           <span class="doc-status-pill enviado">Enviado</span>
           <a class="btn-baixar" href="api/admissao-controle/download?idCandidato=${id}&idTipo=${d.id}" target="_blank">⬇️ Baixar</a>`
        : `<span class="doc-status-pill faltando">Não enviado</span>`}
    </div>`).join("") || '<div class="estado" style="padding:16px">Nenhum tipo de documento configurado.</div>';
}

carregar();
</script>

<script src="js/icones-modulos.js?v=20260829a"></script>
<script src="js/sidebar-nav.js?v=20260829a" defer></script>
</body>
</html>
