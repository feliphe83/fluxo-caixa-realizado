<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento de Compras · USC</title>
<style>
  :root {
    /* Orçado é a régua, realizado é o assunto: cinza contra azul, o par já
       validado no painel de diesel (separação normal ΔE 15,2, CVD, 3:1). */
    --orcado:    #5b6675;
    --realizado: #2a78d6;
    --acum-prev: #0ca30c;
    --acum-real: #1e3a8a;
    --sobra:     #0ca30c;
    --estouro:   #d03b3b;

    /* Semáforo da execução, lido do painel que serviu de modelo:
       acima de 100% estourou, 90 a 100 encostou, 85 a 90 atenção. */
    --sem-vermelho: #e03127;
    --sem-laranja:  #f0921f;
    --sem-amarelo:  #ffe14d;

    --ink: #0f2460; --ink-2: #52514e; --ink-3: #898781; --rotulo: #64748b;
    --borda: #e3e8f5; --papel: #fff; --papel-2: #f8faff; --fundo: #f4f6fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: var(--fundo); color: #1a1a2e; min-height: 100vh;
         font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }

  .header { background: var(--ink); color: white; padding: 0 32px; height: 62px;
            display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 13px; }
  .header-logo { width: 36px; height: 36px; border-radius: 8px; background: white;
                 display: flex; align-items: center; justify-content: center;
                 overflow: hidden; padding: 4px; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 15px; font-weight: 650; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 1px;
                text-transform: uppercase; letter-spacing: .9px; font-weight: 600; }
  .btn-voltar { display: flex; align-items: center; gap: 7px; padding: 8px 14px;
                border-radius: 8px; border: 1px solid rgba(255,255,255,.16);
                background: transparent; color: rgba(255,255,255,.85); font-size: 13px;
                font-weight: 600; cursor: pointer; font-family: inherit; text-decoration: none; }
  .btn-voltar:hover { background: rgba(255,255,255,.10); color: #fff; }

  .conteudo { max-width: 1560px; margin: 0 auto; padding: 20px 22px 60px; }

  /* ── Topo: cartões + controles ── */
  .topo { display: grid; grid-template-columns: 200px 200px auto 1fr; gap: 14px;
          align-items: stretch; margin-bottom: 14px; }
  .cartao-exec { display: flex; gap: 10px; align-items: stretch; }
  .cartao-tipo { min-width: 148px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .cartao-tipo .marca:first-of-type { margin-top: 7px; }
  .cartao { background: var(--papel); border: 1px solid var(--borda); border-radius: 13px;
            padding: 13px 18px; position: relative; overflow: hidden; }
  .cartao::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0;
                    width: 3px; background: var(--cor, var(--ink)); }
  .cartao .rot { font-size: 10.5px; font-weight: 700; color: var(--rotulo);
                 text-transform: uppercase; letter-spacing: .6px; }
  .cartao .cifra { font-size: 26px; font-weight: 800; color: var(--ink); line-height: 1.15;
                   margin-top: 5px; letter-spacing: -.7px; white-space: nowrap; }
  .cartao .cifra.mal { color: var(--estouro); }
  .cartao .base { font-size: 11px; color: var(--ink-3); margin-top: 4px; }

  .controles { background: var(--papel); border: 1px solid var(--borda); border-radius: 13px;
               padding: 12px 18px; display: flex; gap: 18px; align-items: center;
               flex-wrap: wrap; }
  .campo label { display: block; font-size: 10px; font-weight: 700; color: var(--rotulo);
                 text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .campo select { padding: 8px 12px; border: 1px solid #cfd7e6; border-radius: 8px;
                  font-size: 13.5px; font-weight: 600; font-family: inherit; color: var(--ink);
                  background: var(--papel); outline: none; cursor: pointer; min-width: 190px; }
  .campo select:disabled { opacity: .6; cursor: progress; }
  .marcas { display: flex; gap: 16px; }
  .marca { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px;
           font-weight: 700; color: var(--ink-2); cursor: pointer; user-select: none; }
  .marca input { width: 16px; height: 16px; accent-color: var(--ink); cursor: pointer; }
  .atualizado { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
  .btn-excel { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px;
               border-radius: 8px; border: 1px solid #cfd7e6; background: var(--papel);
               color: var(--ink-2); font-size: 13px; font-weight: 700; cursor: pointer;
               font-family: inherit; white-space: nowrap; }
  .btn-excel:hover { border-color: var(--realizado); color: var(--realizado); }

  /* ── Tira de meses ── */
  .meses { display: flex; gap: 6px; background: var(--papel); border: 1px solid var(--borda);
           border-radius: 13px; padding: 6px; margin-bottom: 14px; overflow-x: auto; }
  .meses button { flex: 1; min-width: 108px; border: none; background: transparent;
                  font-family: inherit; font-size: 15px; font-weight: 800; color: var(--ink-3);
                  padding: 11px 8px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .meses button.on { background: var(--realizado); color: #fff; }
  .meses button:not(.on):hover { background: var(--papel-2); color: var(--ink); }
  .meses button.futuro { opacity: .45; }
  .meses .dica { align-self: center; font-size: 11px; font-weight: 700; color: var(--ink-3);
                 padding: 0 12px; white-space: nowrap; }

  .secao { background: var(--papel); border: 1px solid var(--borda); border-radius: 13px;
           padding: 16px 20px 18px; margin-bottom: 14px; }
  .secao h2 { font-size: 15px; font-weight: 800; color: var(--ink); }
  .secao .sub { font-size: 12px; color: var(--ink-3); margin: 3px 0 12px; }
  .legenda { display: flex; gap: 16px; margin-bottom: 6px; flex-wrap: wrap; }
  .legenda span { display: inline-flex; align-items: center; gap: 7px; font-size: 12px;
                  font-weight: 700; color: var(--ink-2); }
  .legenda i { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-2 .secao { margin-bottom: 0; }
  .tela { position: relative; height: 250px; }

  /* ── O quadro ── */
  .rolagem { overflow-x: auto; }
  table.q { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  /* O cabeçalho gruda: com quinze grupos abertos em empenhos, rolar faz
     perder de vista qual coluna é o mês e qual é o acumulado — e aí oito
     colunas de dinheiro viram adivinhação. */
  table.q thead th { position: sticky; z-index: 2;
                     background: var(--ink); color: #fff; font-weight: 800; padding: 7px 10px;
                     white-space: nowrap; text-align: right; font-size: 11.5px;
                     border-right: 1px solid rgba(255,255,255,.14); }
  table.q thead th:last-child { border-right: none; }
  table.q thead th.rot { text-align: left; }
  table.q thead tr.faixa th { top: 0; text-align: center; font-size: 12.5px; letter-spacing: .4px; }
  table.q thead tr:not(.faixa) th { top: 29px; }
  table.q tbody td { padding: 6px 10px; text-align: right; white-space: nowrap;
                     border-bottom: 1px solid #eef1f8; }
  table.q tbody td.rot { text-align: left; }
  table.q tr.grupo { cursor: pointer; }
  table.q tr.grupo:hover td { background: var(--papel-2); }
  table.q tr.grupo td { font-weight: 700; color: var(--ink); }
  table.q tr.grupo .seta { display: inline-block; width: 13px; color: var(--ink-3);
                           transition: transform .15s; }
  table.q tr.grupo.aberto .seta { transform: rotate(90deg); }
  table.q tr.empenho td { background: var(--papel-2); color: var(--ink-2); font-size: 12px; }
  table.q tr.empenho td.rot { padding-left: 32px; }
  table.q tr.empenho .cod { color: var(--ink-3); font-weight: 700; margin-right: 7px; }
  table.q tr.empenho.expansivel { cursor: pointer; }
  table.q tr.empenho.expansivel:hover td { background: #eaeff9; }
  table.q tr.empenho .seta { display: inline-block; width: 12px; color: var(--ink-3);
                             transition: transform .15s; }
  table.q tr.empenho.aberto .seta { transform: rotate(90deg); }
  /* Espaço da seta mesmo sem seta: uma coluna de texto que dança conforme a
     linha abre ou não é ruído. */
  table.q tr.empenho .semseta { display: inline-block; width: 12px; }

  /* Terceiro nível: objeto de custo. Mais recuado e mais claro que o
     empenho, para a hierarquia se ler sem contar pixels. */
  table.q tr.objeto td { background: #eef2fa; color: var(--ink-2); font-size: 11.5px; }
  table.q tr.objeto td.rot { padding-left: 60px; }
  table.q tr.objeto .cod { color: var(--ink-3); font-weight: 700; margin-right: 7px; }
  /* O VALOR REALIZADO do objeto (e do empenho de objeto único) é o botão que
     explode nos itens. Sublinhado pontilhado e cursor de link avisam que ali
     se clica; aberto, a célula fica destacada. */
  table.q td.real-drill { cursor: pointer; color: #1e3a8a; font-weight: 700;
                          text-decoration: underline dotted; text-underline-offset: 3px; }
  table.q td.real-drill:hover { background: #dbe5f7; }
  table.q td.real-drill.aberto { background: #cfe0fb; }

  /* Quarto nível: o item — material + fornecedor (compra) ou o contrato —
     SALTA num modal, não abre embaixo da linha. */
  .modal-itens { position: fixed; inset: 0; z-index: 2000; display: none;
                 align-items: center; justify-content: center; padding: 24px;
                 background: rgba(15,36,96,.45); }
  .modal-itens.on { display: flex; }
  .mi-caixa { background: #fff; border-radius: 16px; width: min(760px, 94vw); max-height: 86vh;
              display: flex; flex-direction: column; overflow: hidden;
              box-shadow: 0 24px 70px rgba(15,36,96,.42); }
  .mi-topo { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px;
             border-bottom: 1px solid #eef1f8; }
  .mi-titulo { font-size: 16px; font-weight: 800; color: var(--ink); }
  .mi-sub { font-size: 12px; font-weight: 700; color: var(--ink-3); margin-top: 2px; }
  .mi-fechar { margin-left: auto; border: none; background: none; font-size: 26px; line-height: 1;
               color: #94a0b8; cursor: pointer; padding: 0 2px; }
  .mi-fechar:hover { color: var(--ink); }
  .mi-corpo { overflow: auto; }
  .mi-item { display: flex; gap: 14px; align-items: baseline; padding: 11px 20px;
             border-bottom: 1px solid #f2f5fb; }
  .mi-desc { flex: 1; min-width: 0; font-size: 13px; color: var(--ink); line-height: 1.35; }
  .mi-desc .forn { color: var(--ink-3); font-weight: 700; }
  .mi-desc .refs { color: #2a78d6; font-weight: 700; }
  .mi-desc .semdet { color: var(--ink-3); font-style: italic; }
  .mi-val { font-weight: 800; color: var(--ink); white-space: nowrap; }
  .mi-vazio { padding: 26px 20px; color: var(--ink-3); font-size: 13px; }
  .mi-rodape { display: flex; justify-content: space-between; padding: 12px 20px;
               border-top: 1px solid #eef1f8; font-size: 12.5px; color: var(--ink-2); }
  table.q tfoot td { padding: 9px 10px; font-weight: 800; color: var(--ink); text-align: right;
                     border-top: 2px solid var(--borda); background: #eef2fa; }
  table.q tfoot td.rot { text-align: left; }
  /* O bloco do mês e o do acumulado separados por uma linha, como no
     original: sem ela, oito colunas de dinheiro viram uma parede só. */
  table.q .divide { border-left: 2px solid var(--borda); }
  .plan { color: var(--orcado); }
  /* Qualificado com a tabela porque "table.q tr.grupo td" tem mais
     elementos e vencia por especificidade — a diferença da linha de grupo
     saía na cor da tinta, e é justamente nela que se vê o estouro. */
  table.q td.dif.bem { color: var(--sobra); }
  table.q td.dif.mal { color: var(--estouro); }
  .pct { font-weight: 800; }
  .pct.vermelho { background: var(--sem-vermelho); color: #fff; }
  .pct.laranja  { background: var(--sem-laranja);  color: #3a2400; }
  .pct.amarelo  { background: var(--sem-amarelo);  color: #3a3400; }

  .estado { text-align: center; padding: 50px 20px; color: var(--ink-3); font-size: 14px; }
  .spinner { width: 26px; height: 26px; border: 2.5px solid var(--borda);
             border-top-color: var(--realizado); border-radius: 50%; margin: 0 auto 12px;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .erro { color: var(--estouro); }

  @media (max-width: 1100px) {
    .topo { grid-template-columns: repeat(2, 1fr) auto; }
    .cartao-exec { grid-column: 1 / -1; }
    .controles { grid-column: 1 / -1; }
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .header { height: auto; flex-wrap: wrap; padding: 12px 16px; row-gap: 10px; }
    .header-sub { white-space: normal; }
    .conteudo { padding: 14px; }
    .topo { grid-template-columns: 1fr; }
    .cartao .cifra { font-size: 21px; white-space: normal; }
    .cartao-exec { flex-wrap: wrap; }
    .controles { flex-direction: column; align-items: stretch; }
    .controles .marcas { flex-wrap: wrap; }
    .atualizado { margin-left: 0; }
  }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<meta name="theme-color" content="#0f2460">
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Usina Santa Clotilde</div>
      <div class="header-sub">Acompanhamento do Orçamento de Compras · Planejado × realizado</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <a class="btn-voltar" href="orcamento-tv.html" target="_blank" title="Abrir a versão para televisão">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="18" x2="12" y2="21"/></svg>
      Modo TV
    </a>
    <a class="btn-voltar" href="hub.html">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar ao Hub
    </a>
  </div>
</div>

<div class="conteudo">
  <div class="topo">
    <div class="cartao" style="--cor:var(--orcado)">
      <div class="rot">Planejado</div>
      <div class="cifra" id="cPlan">—</div>
      <div class="base" id="cPlanBase"></div>
    </div>
    <div class="cartao" style="--cor:var(--realizado)">
      <div class="rot">Realizado</div>
      <div class="cifra" id="cReal">—</div>
      <div class="base" id="cRealBase"></div>
    </div>
    <div class="cartao-exec">
      <div class="cartao" style="--cor:var(--sem-laranja)">
        <div class="rot">Execução %</div>
        <div class="cifra" id="cExec">—</div>
        <div class="base" id="cExecBase"></div>
      </div>
      <div class="cartao cartao-tipo">
        <div class="rot">Tipo</div>
        <label class="marca"><input type="checkbox" id="ckCompra" checked onchange="desenhar()">Compra</label>
        <label class="marca"><input type="checkbox" id="ckInvestimento" checked onchange="desenhar()">Investimento</label>
      </div>
    </div>
    <div class="controles">
      <div class="campo">
        <label for="selPeriodo">Período</label>
        <select id="selPeriodo" onchange="carregar()"></select>
      </div>
      <div class="campo" id="campoNegocio" style="display:none">
        <label for="selNegocio">Negócio</label>
        <select id="selNegocio" onchange="desenhar()"></select>
      </div>
      <div class="marcas">
        <label class="marca"><input type="checkbox" id="ckMensal" checked onchange="desenhar()">Mensal</label>
        <label class="marca"><input type="checkbox" id="ckAcum" checked onchange="desenhar()">Acumulado</label>
      </div>
      <button class="btn-excel" onclick="exportarExcel()">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar Excel
      </button>
      <div class="atualizado" id="atualizado"></div>
    </div>
  </div>

  <div class="meses" id="meses"></div>
  <div id="corpo"><div class="estado"><div class="spinner"></div>Consultando o orçamento…</div></div>
</div>

<script src="js/chart.umd.min.js"></script>
<script src="js/xlsx.full.min.js"></script>
<script>
const COR_ORCADO='#5b6675', COR_REALIZADO='#2a78d6', COR_ACUM_PREV='#0ca30c', COR_ACUM_REAL='#1e3a8a';
let DADOS = null, ABERTOS = {};
/* Os meses marcados. Ctrl+clique (ou ⌘ no Mac) soma vários; clique simples
   troca para um só. Nunca fica vazio: sem mês nenhum o quadro não teria o
   que somar, e uma tela em branco por causa de um clique é armadilha. */
let SEL = new Set();
const graficos = {};

const fmt0 = v => Math.round(Number(v)||0).toLocaleString('pt-BR');
const fmt2 = (v,c) => (Number(v)||0).toLocaleString('pt-BR',
  {minimumFractionDigits:c==null?2:c, maximumFractionDigits:c==null?2:c});
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function curto(v){ const n=Number(v)||0, s=n<0?'-':'', a=Math.abs(n);
  return a>=1e6 ? s+'R$ '+fmt2(a/1e6,1)+' mi' : (a>=1e3 ? s+'R$ '+fmt2(a/1e3,0)+' mil' : s+'R$ '+fmt2(a)); }

/* ── Períodos ──
   O ano é partido em dois, como a controladoria acompanha: SAFRA de
   setembro a fevereiro (a moagem) e ENTRESSAFRA de março a agosto (a parada
   e a manutenção). Seis meses cada. */
function safraDe(ano)      { return {chave:'S'+ano, rotulo:'Safra '+ano+'/'+(ano+1),
                                     ini:ano*100+9,  fim:(ano+1)*100+2}; }
function entressafraDe(ano){ return {chave:'E'+ano, rotulo:'EntreSafra '+ano,
                                     ini:ano*100+3,  fim:ano*100+8}; }
let PERIODOS = [];
function montarPeriodos() {
  const h = new Date(), ano = h.getFullYear(), mes = h.getMonth() + 1;
  PERIODOS = [];
  // O corrente primeiro: é o que se abre para olhar.
  if (mes >= 3 && mes <= 8) PERIODOS.push(entressafraDe(ano));
  else PERIODOS.push(safraDe(mes >= 9 ? ano : ano - 1));
  for (let a = ano; a >= ano - 4; a--) {
    for (const p of [entressafraDe(a), safraDe(a)]) {
      if (!PERIODOS.some(x => x.chave === p.chave)) PERIODOS.push(p);
    }
  }
  document.getElementById('selPeriodo').innerHTML = PERIODOS.map((p,i) =>
    `<option value="${i}">${esc(p.rotulo)}${i===0?' (atual)':''}</option>`).join('');
}
function periodoEscolhido(){ return PERIODOS[Number(document.getElementById('selPeriodo').value)||0]; }

async function carregar() {
  const p = periodoEscolhido();
  const sel = document.getElementById('selPeriodo');
  sel.disabled = true; ABERTOS = {}; SEL = new Set();
  document.getElementById('corpo').innerHTML =
    '<div class="estado"><div class="spinner"></div>Consultando o orçamento…</div>';
  try {
    const r = await fetch(`api/orcamento-compras?ini=${p.ini}&fim=${p.fim}`,
                          {headers:{'Accept':'application/json'}});
    const j = await r.json();
    if (j.redirect) { location.href='login.html'; return; }
    if (!j.ok) { falhar(j.erro || 'Erro ao consultar'); return; }
    DADOS = j;
    document.getElementById('atualizado').textContent = 'Atualizado em ' + j.atualizadoEm;
    montarNegocios(j);
    montarMeses(j);
    desenhar();
  } catch (e) { falhar(e.message || String(e)); }
  finally { sel.disabled = false; }
}

function falhar(msg) {
  document.getElementById('meses').innerHTML = '';
  document.getElementById('corpo').innerHTML =
    `<div class="estado erro"><b>Não foi possível carregar o orçamento de compras.</b>
     <div style="margin-top:10px;font-size:12.5px;color:var(--ink-2)">${esc(msg)}</div>
     <div style="margin-top:12px;font-size:12.5px">
       <a href="api/orcamento-compras/diagnostico" target="_blank"
          style="color:var(--realizado);font-weight:700">Abrir o diagnóstico</a>
       — mostra as colunas das tabelas de custo e de realizado.</div></div>`;
}

function montarNegocios(j) {
  const campo = document.getElementById('campoNegocio');
  if (!j.temNegocio || !(j.negocios||[]).length) { campo.style.display='none'; return; }
  const sel = document.getElementById('selNegocio'), antes = sel.value;
  sel.innerHTML = '<option value="">Todos os negócios</option>'
    + j.negocios.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if (antes && j.negocios.includes(antes)) sel.value = antes;
  campo.style.display = '';
}
function negocio(){ return document.getElementById('campoNegocio').style.display==='none'
                      ? '' : document.getElementById('selNegocio').value; }
/** Quais tipos entram no recorte — os dois marcados por padrão. */
function tiposLigados() {
  const t = [];
  if (document.getElementById('ckCompra').checked) t.push('Compra');
  if (document.getElementById('ckInvestimento').checked) t.push('Investimento');
  return t;
}

/** A tira de meses. O último com movimento abre marcado — é onde a
 *  execução está acontecendo; abrir em março obrigaria a clicar sempre. */
function montarMeses(j) {
  const comDado = new Set(j.linhas.map(l => l.anomes));
  const ultimo = j.meses.filter(m => comDado.has(m.anomes)).pop();
  SEL = new Set([ ultimo ? ultimo.anomes : j.meses[j.meses.length-1].anomes ]);
  pintarMeses(comDado);
}

function pintarMeses(comDado) {
  const cd = comDado || new Set(DADOS.linhas.map(l => l.anomes));
  document.getElementById('meses').innerHTML = DADOS.meses.map(m =>
    `<button class="${SEL.has(m.anomes)?'on':''} ${cd.has(m.anomes)?'':'futuro'}"
             onclick="trocarMes(${m.anomes}, event)">${esc(m.nome)}</button>`).join('')
    + '<span class="dica">Ctrl+clique soma vários</span>';
}

function trocarMes(anomes, ev) {
  const somando = ev && (ev.ctrlKey || ev.metaKey);   // ⌘ no Mac
  if (!somando) {
    SEL = new Set([anomes]);
  } else if (SEL.has(anomes)) {
    // Desmarcar o último deixaria o quadro sem nada para somar.
    if (SEL.size > 1) SEL.delete(anomes);
  } else {
    SEL.add(anomes);
  }
  pintarMeses();
  desenhar();
}

/** Até onde o acumulado vai: o ÚLTIMO mês marcado. */
function mesLimite() { return Math.max(...SEL); }

/**
 * O nome do primeiro bloco.
 *
 * Com um mês é o nome dele. Com vários precisa dizer QUAIS, senão a coluna
 * vira um número sem procedência — e "Agosto" com março somado dentro é
 * pior do que não ter a soma. Acima de três nomes vira contagem, que ainda
 * é honesto e cabe no cabeçalho.
 */
function rotuloSelecao() {
  if (SEL.size === DADOS.meses.length) return 'Período inteiro';
  const nomes = DADOS.meses.filter(m => SEL.has(m.anomes)).map(m => m.nome);
  if (nomes.length === 1) return nomes[0];
  if (nomes.length <= 3) return nomes.join(' + ');
  return nomes.length + ' meses';
}

// ── Agregação, toda no navegador ────────────────────────────────────────
// Mês, acumulado, negócio e abrir grupo saem TODOS da mesma consulta. Se
// cada um fosse uma ida ao Oracle, um deles acabaria somando diferente dos
// outros e ninguém saberia qual acreditar.

function agregar() {
  const neg = negocio();
  const tipos = tiposLigados();
  const limite = mesLimite();
  const grupos = new Map();
  for (const l of DADOS.linhas) {
    if (neg && l.negocio !== neg) continue;
    if (!tipos.includes(l.tipo)) continue;
    const noMes = SEL.has(l.anomes);
    const noAcum = l.anomes <= limite;
    if (!noMes && !noAcum) continue;

    const kg = l.codGrupo + '|' + l.grupo;
    let g = grupos.get(kg);
    if (!g) { g = {chave:kg, cod:l.codGrupo, nome:l.grupo, mp:0, mr:0, ap:0, ar:0, emp:new Map()};
              grupos.set(kg, g); }
    let e = g.emp.get(l.codEmpenho);
    if (!e) { e = {chave:kg + '|' + l.codEmpenho, cod:l.codEmpenho, nome:l.empenho,
                   mp:0, mr:0, ap:0, ar:0, obj:new Map()};
              g.emp.set(l.codEmpenho, e); }
    // Terceiro nível: objeto de custo dentro do empenho. É onde o gasto
    // finalmente tem endereço — grupo e empenho dizem "o quê", o objeto de
    // custo diz "para onde foi".
    const ko = l.codObjeto || l.objeto;
    let o = e.obj.get(ko);
    if (!o) { o = {cod:l.codObjeto, nome:l.objeto, mp:0, mr:0, ap:0, ar:0};
              e.obj.set(ko, o); }

    if (noMes)  { for (const x of [g,e,o]) { x.mp += +l.orcado; x.mr += +l.realizado; } }
    if (noAcum) { for (const x of [g,e,o]) { x.ap += +l.orcado; x.ar += +l.realizado; } }
  }
  const vivo = x => x.mp||x.mr||x.ap||x.ar;
  const maior = (a,b) => Math.max(b.ap,b.ar) - Math.max(a.ap,a.ar);
  // Maior acumulado primeiro, em todos os níveis: é por onde se começa a
  // olhar um orçamento.
  const lista = [...grupos.values()].filter(vivo).sort(maior);
  lista.forEach(g => {
    g.empenhos = [...g.emp.values()].filter(vivo).sort(maior);
    g.empenhos.forEach(e => { e.objetos = [...e.obj.values()].filter(vivo).sort(maior); });
  });
  return lista;
}

/** Série mês a mês para os gráficos, já com o negócio aplicado. */
function serie() {
  const neg = negocio();
  const tipos = tiposLigados();
  const porMes = new Map(DADOS.meses.map(m => [m.anomes, {label:m.label, p:0, r:0}]));
  for (const l of DADOS.linhas) {
    if (neg && l.negocio !== neg) continue;
    if (!tipos.includes(l.tipo)) continue;
    const m = porMes.get(l.anomes);
    if (m) { m.p += +l.orcado; m.r += +l.realizado; }
  }
  const arr = [...porMes.values()];
  let ap = 0, ar = 0;
  arr.forEach(m => { ap += m.p; ar += m.r; m.ap = ap; m.ar = ar; });
  return arr;
}

/** Sem orçamento não existe percentual: "—", nunca 100%. Gasto sem verba
 *  prevista virando execução perfeita é erro que passa por parecer bom. */
function pct(real, plan) { return plan ? real * 100 / plan : null; }

/** O semáforo do painel que serviu de modelo. */
function classePct(p) {
  if (p === null) return '';
  if (p > 100) return 'vermelho';
  if (p >= 90)  return 'laranja';
  if (p >= 85)  return 'amarelo';
  return '';
}
function celulaPct(p) {
  return `<td class="pct ${classePct(p)}">${p===null?'—':fmt2(p)}</td>`;
}

function desenhar() {
  if (!DADOS) return;
  const grupos = agregar();
  const mensal = document.getElementById('ckMensal').checked;
  const acum = document.getElementById('ckAcum').checked;
  const nomeMes = rotuloSelecao();

  // Os cartões seguem o MÊS selecionado, como no painel original.
  const tp = grupos.reduce((a,g)=>a+g.mp,0), tr = grupos.reduce((a,g)=>a+g.mr,0);
  const tap = grupos.reduce((a,g)=>a+g.ap,0), tar = grupos.reduce((a,g)=>a+g.ar,0);
  const ex = pct(tr, tp);
  document.getElementById('cPlan').textContent = fmt0(tp);
  document.getElementById('cPlanBase').textContent = nomeMes + ' · R$';
  document.getElementById('cReal').textContent = fmt0(tr);
  document.getElementById('cRealBase').textContent = nomeMes + ' · R$';
  const cx = document.getElementById('cExec');
  cx.textContent = ex === null ? '—' : fmt2(ex);
  cx.className = 'cifra' + (ex !== null && ex > 100 ? ' mal' : '');
  document.getElementById('cExecBase').textContent =
    'acumulado ' + (pct(tar,tap)===null ? '—' : fmt2(pct(tar,tap)) + '%');

  if (!grupos.length) {
    document.getElementById('corpo').innerHTML =
      '<div class="estado"><b style="color:var(--ink);font-size:16px">Nada neste recorte.</b>'
      + '<div style="margin-top:8px">Nenhum empenho com orçado ou realizado.</div></div>';
    return;
  }

  document.getElementById('corpo').innerHTML = `
    <div class="secao">
      <div class="rolagem">${quadro(grupos, mensal, acum, nomeMes, tp, tr, tap, tar)}</div>
    </div>
    <div class="grid-2">
      <div class="secao">
        <h2>Compras de materiais, serviços e investimentos</h2>
        <div class="sub">Orçado × realizado, mês a mês</div>
        <div class="legenda">
          <span><i style="background:${COR_ORCADO}"></i>Previsto</span>
          <span><i style="background:${COR_REALIZADO}"></i>Realizado</span>
        </div>
        <div class="tela"><canvas id="gMensal"></canvas></div>
      </div>
      <div class="secao">
        <h2>Acumulado no período</h2>
        <div class="sub">Como a execução vai se somando</div>
        <div class="legenda">
          <span><i style="background:${COR_ACUM_PREV}"></i>Previsto acumulado</span>
          <span><i style="background:${COR_ACUM_REAL}"></i>Realizado acumulado</span>
        </div>
        <div class="tela"><canvas id="gAcum"></canvas></div>
      </div>
    </div>`;

  graficoMensal();
  graficoAcumulado();
}

function quadro(grupos, mensal, acum, nomeMes, tp, tr, tap, tar) {
  const colsMes  = mensal ? 4 : 0, colsAcum = acum ? 4 : 0;
  if (!colsMes && !colsAcum) {
    return '<div class="estado">Marque <b>Mensal</b> ou <b>Acumulado</b> para ver o quadro.</div>';
  }
  const faixa = `<tr class="faixa">
      <th class="rot" rowspan="2">Grupo de Empenho</th>
      ${mensal ? `<th colspan="4" class="divide">${esc(nomeMes)}</th>` : ''}
      ${acum   ? `<th colspan="4" class="divide">Acumulado</th>` : ''}
    </tr>`;
  const cab = `<tr>
      ${mensal ? '<th class="divide">Plan (R$)</th><th>Real (R$)</th><th>Dif.</th><th>%</th>' : ''}
      ${acum   ? '<th class="divide">Plan (R$)</th><th>Real (R$)</th><th>Dif.</th><th>%</th>' : ''}
    </tr>`;

  // acaoReal: quando presente e há realizado, o VALOR REALIZADO vira o botão
  // que explode os itens (4º nível). É onde o clique faz sentido — o
  // realizado é a soma dos itens que estão embaixo dele.
  const bloco = (p, r, primeiro, acaoReal) => {
    const d = p - r;
    const drill = (acaoReal && r)
      ? ` class="real-drill" onclick="event.stopPropagation();${acaoReal}"`
        + ` title="Ver os itens deste realizado"`
      : '';
    return `<td class="plan ${primeiro?'divide':''}">${p?fmt0(p):''}</td>
            <td${drill}>${r?fmt0(r):''}</td>
            <td class="dif ${d>=0?'bem':'mal'}">${(p||r)?fmtDif(d):''}</td>
            ${celulaPct(pct(r,p))}`;
  };

  const corpo = grupos.map(g => {
    const aberto = ABERTOS[g.chave];
    let html = `
      <tr class="grupo ${aberto?'aberto':''}" onclick="alternar('${esc(g.chave).replace(/'/g,"\\'")}')">
        <td class="rot"><span class="seta">▶</span> ${esc(g.nome)}</td>
        ${mensal ? bloco(g.mp, g.mr, true) : ''}
        ${acum   ? bloco(g.ap, g.ar, true) : ''}
      </tr>`;
    if (!aberto) return html;

    g.empenhos.forEach(e => {
      const abertoE = ABERTOS[e.chave];
      const vale = e.objetos.length > 1;

      if (vale) {
        // Vários objetos: a LINHA abre nos objetos (níveis 1-3, hierarquia).
        html += `
        <tr class="empenho expansivel ${abertoE?'aberto':''}" onclick="alternar('${arg(e.chave)}')">
          <td class="rot"><span class="seta">▶</span><span class="cod">${esc(e.cod)}</span>${esc(e.nome)}</td>
          ${mensal ? bloco(e.mp, e.mr, true) : ''}
          ${acum   ? bloco(e.ap, e.ar, true) : ''}
        </tr>`;
        if (abertoE) {
          html += e.objetos.map(o => {
            // No objeto o clique é no REALIZADO: ele SALTA os itens num modal.
            const acao = acaoItens(e.cod, o.cod, o.nome, 'Empenho ' + e.cod + ' · ' + e.nome);
            return `
            <tr class="objeto">
              <td class="rot">${o.cod ? `<span class="cod">${esc(o.cod)}</span>` : ''}${esc(o.nome)}</td>
              ${mensal ? bloco(o.mp, o.mr, true, acao) : ''}
              ${acum   ? bloco(o.ap, o.ar, true, acao) : ''}
            </tr>`;
          }).join('');
        }
      } else {
        // Um objeto só: o empenho JÁ É o objeto. O realizado dele salta os itens.
        const o0 = e.objetos[0] || {cod:'', nome:''};
        const acao = acaoItens(e.cod, o0.cod, e.nome, 'Empenho ' + e.cod);
        html += `
        <tr class="empenho">
          <td class="rot"><span class="semseta"></span><span class="cod">${esc(e.cod)}</span>${esc(e.nome)}</td>
          ${mensal ? bloco(e.mp, e.mr, true, acao) : ''}
          ${acum   ? bloco(e.ap, e.ar, true, acao) : ''}
        </tr>`;
      }
    });
    return html;
  }).join('');

  return `<table class="q">
    <thead>${faixa}${cab}</thead>
    <tbody>${corpo}</tbody>
    <tfoot><tr>
      <td class="rot">Total</td>
      ${mensal ? bloco(tp, tr, true) : ''}
      ${acum   ? bloco(tap, tar, true) : ''}
    </tr></tfoot>
  </table>`;
}

/** Estouro entre parênteses, como no quadro da controladoria: num
 *  documento de orçamento o sinal de menos passa despercebido, o parêntese
 *  não. */
function fmtDif(d) {
  return d < 0 ? '(' + fmt0(Math.abs(d)) + ')' : fmt0(d);
}

function alternar(k) { ABERTOS[k] = !ABERTOS[k]; desenhar(); }

// ── Exportar Excel ──────────────────────────────────────────────────────
// Mesmo recorte da tela (período, negócio, mensal/acumulado) — sem o
// detalhe de item (material/fornecedor/contrato), que é o 4º nível do
// modal. Aqui é só o quadro: grupo, empenho e objeto de custo.
function exportarExcel() {
  if (!DADOS) return;
  const grupos = agregar();
  const mensal = document.getElementById('ckMensal').checked;
  const acum = document.getElementById('ckAcum').checked;
  if (!mensal && !acum) { alert('Marque "Mensal" ou "Acumulado" para exportar.'); return; }
  if (!tiposLigados().length) { alert('Marque "Compra" ou "Investimento" para exportar.'); return; }
  const nomeMes = rotuloSelecao();
  const neg = negocio();
  const tipos = tiposLigados();
  const p = periodoEscolhido();

  const cab = ['Nível', 'Código', 'Descrição'];
  if (mensal) cab.push(nomeMes + ' — Plan (R$)', nomeMes + ' — Real (R$)', nomeMes + ' — Dif. (R$)', nomeMes + ' — %');
  if (acum) cab.push('Acumulado — Plan (R$)', 'Acumulado — Real (R$)', 'Acumulado — Dif. (R$)', 'Acumulado — %');

  const valores = (p, r) => {
    const linha = [];
    linha.push(round2(p), round2(r), round2(p - r));
    const pc = pct(r, p);
    linha.push(pc === null ? '' : round2(pc));
    return linha;
  };
  const linhaDe = (nivel, cod, nome, x) => {
    const linha = [nivel, cod || '', nome];
    if (mensal) linha.push(...valores(x.mp, x.mr));
    if (acum) linha.push(...valores(x.ap, x.ar));
    return linha;
  };

  const linhas = [];
  grupos.forEach(g => {
    linhas.push(linhaDe('Grupo', g.cod, g.nome, g));
    g.empenhos.forEach(e => {
      linhas.push(linhaDe('Empenho', e.cod, e.nome, e));
      if (e.objetos.length > 1) {
        e.objetos.forEach(o => linhas.push(linhaDe('Objeto', o.cod, o.nome, o)));
      }
    });
  });

  const tp = grupos.reduce((a,g)=>a+g.mp,0), tr = grupos.reduce((a,g)=>a+g.mr,0);
  const tap = grupos.reduce((a,g)=>a+g.ap,0), tar = grupos.reduce((a,g)=>a+g.ar,0);
  linhas.push(linhaDe('Total', '', 'TOTAL', {mp:tp, mr:tr, ap:tap, ar:tar}));

  const aoa = [
    ['Usina Santa Clotilde S/A'],
    ['Orçamento de Compras — Planejado x Realizado'],
    [p.rotulo + ' · ' + tipos.join(' + ') + (neg ? ' · Negócio: ' + neg : '')],
    [],
    cab,
    ...linhas
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Orçamento');
  XLSX.writeFile(wb, 'Orcamento-Compras_' + p.chave + '.xlsx');
}

function round2(v) { return Math.round((Number(v)||0) * 100) / 100; }

/** Escapa uma string para dentro de um onclick com aspas simples. */
function arg(s) { return esc(String(s == null ? '' : s)).replace(/'/g, "\\'"); }

// ── Quarto nível: itens (material + fornecedor / contrato), num MODAL ──────
//
// O detalhe SALTA na tela num modal — não abre embaixo da linha. Vem sob
// demanda e é guardado por (empenho, objeto, meses escolhidos); trocar de mês
// invalida a cópia. O total dos itens PODE não fechar com o realizado do
// objeto; o número que vale continua o do nível de cima. Aqui é só o endereço
// do gasto.
const ITENS = {};

/** Monta o onclick que abre o modal para (empenho, objeto). */
function acaoItens(empenho, objeto, titulo, sub) {
  return `abrirItens('${arg(empenho)}','${arg(objeto || '')}','${arg(titulo)}','${arg(sub)}')`;
}

function chaveItens(empenho, objeto) {
  return empenho + '|' + (objeto || '') + '|' + [...SEL].sort((a, b) => a - b).join(',');
}

async function abrirItens(empenho, objeto, titulo, sub) {
  const modal = document.getElementById('modalItens');
  document.getElementById('miTitulo').textContent = titulo || 'Itens do realizado';
  document.getElementById('miSub').textContent = (sub ? sub + ' · ' : '') + rotuloSelecao();
  modal.classList.add('on');

  const ck = chaveItens(empenho, objeto);
  if (!ITENS[ck]) {
    ITENS[ck] = { carregando: true };
    pintarItens(ck);
    try {
      const meses = [...SEL].join(',');
      const url = 'api/orcamento-compras/itens?meses=' + encodeURIComponent(meses)
                + '&empenho=' + encodeURIComponent(empenho)
                + '&objeto=' + encodeURIComponent(objeto || '');
      const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || 'Falha ao detalhar');
      ITENS[ck] = { lista: j.itens || [], soma: j.soma || 0 };
    } catch (e) {
      ITENS[ck] = { erro: e.message || String(e) };
    }
  }
  pintarItens(ck);
}

function pintarItens(ck) {
  const it = ITENS[ck];
  const corpo = document.getElementById('miCorpo');
  const rodape = document.getElementById('miRodape');
  if (!it || it.carregando) { corpo.innerHTML = '<div class="mi-vazio">Carregando itens…</div>'; rodape.innerHTML = ''; return; }
  if (it.erro)             { corpo.innerHTML = `<div class="mi-vazio" style="color:var(--desce)">${esc(it.erro)}</div>`; rodape.innerHTML = ''; return; }
  if (!it.lista.length)    { corpo.innerHTML = '<div class="mi-vazio">Sem itens detalhados no período.</div>'; rodape.innerHTML = ''; return; }
  corpo.innerHTML = it.lista.map(x =>
    `<div class="mi-item"><div class="mi-desc">${rotuloItem(x)}</div>` +
    `<div class="mi-val">${x.valor ? fmt0(x.valor) : ''}</div></div>`).join('');
  rodape.innerHTML = `<span>${it.lista.length} item(ns)</span>`
    + `<span>Soma dos itens: <b>${fmt0(it.soma || 0)}</b></span>`;
}

function fecharItens() { document.getElementById('modalItens').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharItens(); });

/** O rótulo do item: material + fornecedor (compra), o contrato, ou "sem detalhe". */
function rotuloItem(x) {
  if (x.origem === 'contrato' && x.contrato) return `📄 Contrato ${esc(x.contrato)}`;
  if (x.material || x.fornecedor) {
    let s = esc(x.material || '(material sem descrição)');
    if (x.fornecedor) s += ` · <span class="forn">${esc(x.fornecedor)}</span>`;
    const refs = [];
    if (x.cotacao)     refs.push('Cot ' + esc(x.cotacao));
    if (x.nroc)        refs.push('OC ' + esc(x.nroc));
    if (x.solicitacao) refs.push('Sol ' + esc(x.solicitacao));
    if (refs.length) s += ` <span class="refs">${refs.join(' · ')}</span>`;
    return s;
  }
  return '<span class="semdet">sem detalhe de compra</span>';
}

// ── Gráficos ────────────────────────────────────────────────────────────
/**
 * Cinco marcas bastam: sem o limite o eixo enche de meio em meio milhão e
 * vira uma escada de números que compete com a linha pela atenção.
 *
 * `doZero` é a diferença entre os dois gráficos, e não é enfeite:
 *  - no ACUMULADO a história é o crescimento a partir do zero, e cortar a
 *    base faria a curva parecer arrancar de um patamar que não existe;
 *  - no MENSAL a história é a distância entre previsto e realizado, duas
 *    linhas que andam coladas. Do zero, as duas ficam espremidas no topo e
 *    a diferença — que é o assunto — some.
 */
function eixoMilhoes(doZero) {
  return { ticks: { color:'#898781', font:{size:11, weight:'600'}, maxTicksLimit: 5,
                    callback: v => v === 0 ? '0' : fmt2(v/1e6,1) + ' mi' },
           grid: { color:'#e9edf6' }, border: { display:false },
           beginAtZero: doZero, grace: doZero ? 0 : '18%' };
}

function linha(id, dados, cfg) {
  const canvas = document.getElementById(id);
  if (graficos[id]) graficos[id].destroy();
  graficos[id] = new Chart(canvas, {
    type: 'line',
    data: { labels: dados.map(m => m.label), datasets: cfg.series },
    options: {
      responsive:true, maintainAspectRatio:false, animation:false,
      layout:{ padding:{ top:24, right:14, left:8, bottom:4 } },
      scales:{ x:{ grid:{display:false}, border:{color:'#e3e8f5'},
                   ticks:{ color:'#52514e', font:{size:12, weight:'700'} } },
               y: eixoMilhoes(cfg.doZero) },
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{
        label: c => c.dataset.label + ': ' + curto(c.parsed.y) } } }
    },
    plugins: [{
      /* Rótulo em todos os pontos: de relance, a inclinação diz a tendência
         mas não o valor — e é o valor que a pessoa copia. */
      id: 'rotulos',
      afterDatasetsDraw(chart) {
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '800 11px system-ui, sans-serif';
        ctx.textAlign = 'center';
        chart.data.datasets.forEach((ds, di) => {
          ctx.fillStyle = ds.borderColor;
          const outro = chart.getDatasetMeta(1 - di).data;
          const ultimo = ds.data.length - 1;
          chart.getDatasetMeta(di).data.forEach((p, i) => {
            const v = ds.data[i];
            if (!v) return;
            // Quem está mais alto escreve por cima; o outro, por baixo.
            const acima = !outro[i] || p.y <= outro[i].y;
            ctx.textBaseline = acima ? 'bottom' : 'top';
            // As pontas escrevem para dentro: centralizado, o rótulo do
            // primeiro mês cavalga a marca do eixo e o do último sai do quadro.
            ctx.textAlign = i === 0 ? 'left' : (i === ultimo ? 'right' : 'center');
            // Nas pontas, um respiro horizontal: alinhado exatamente no x do
            // ponto, o texto encosta no próprio marcador.
            const dx = i === 0 ? 5 : (i === ultimo ? -5 : 0);
            ctx.fillText(fmt2(v/1e6,1) + ' mi', p.x + dx, p.y + (acima ? -8 : 8));
          });
        });
        ctx.restore();
      }
    }]
  });
}

const estilo = (label, cor, dados) => ({
  label, data: dados, borderColor: cor, backgroundColor: 'transparent',
  borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: cor,
  pointBorderColor: '#fff', pointBorderWidth: 1.5, tension: .3, spanGaps: false
});
const zeroNulo = v => (Number(v) || 0) === 0 ? null : Number(v);

function graficoMensal() {
  const s = serie();
  linha('gMensal', s, { doZero: false, series: [
    estilo('Previsto',  COR_ORCADO,    s.map(m => zeroNulo(m.p))),
    estilo('Realizado', COR_REALIZADO, s.map(m => zeroNulo(m.r)))
  ]});
}
function graficoAcumulado() {
  const s = serie();
  linha('gAcum', s, { doZero: true, series: [
    estilo('Previsto acumulado',  COR_ACUM_PREV, s.map(m => zeroNulo(m.ap))),
    estilo('Realizado acumulado', COR_ACUM_REAL, s.map(m => zeroNulo(m.ar)))
  ]});
}

montarPeriodos();
carregar();
</script>
