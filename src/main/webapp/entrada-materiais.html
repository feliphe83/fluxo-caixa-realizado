<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrada de Materiais</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #0f2460; --ink-2: #52514e; --ink-3: #898781; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f6fb; color: #1a1a2e; }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #0f2460 0%, #1a3a7c 100%);
    color: white; padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .header-logo { width: 44px; height: 44px; border-radius: 8px; background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 5px; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 19px; font-weight: 800; }
  .header-sub { font-size: 12.5px; opacity: .9; margin-top: 3px; font-weight: 600; }
  .btn-voltar {
    display: flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-voltar:hover { background: rgba(255,255,255,0.18); }

  .conteudo { max-width: 900px; margin: 0 auto; padding: 22px; }

  /* ── Filtros ── */
  .filtros-card { background: white; border: 1.5px solid #e3e8f5; border-radius: 14px; padding: 16px 20px; margin-bottom: 18px; }
  .filtros-grid { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; }
  .campo { display: flex; flex-direction: column; gap: 5px; }
  .campo label { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .4px; }
  .campo input[type=date] { padding: 8px 10px; border: 1.5px solid #d6ddec; border-radius: 8px; font-size: 14px; color: var(--ink); }
  .btn-gerar {
    display: flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 8px; border: none;
    background: #1baf7a; color: white; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn-gerar:hover { background: #159066; }
  .btn-gerar:disabled { background: #9fcdb9; cursor: default; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .preset { padding: 6px 12px; border-radius: 20px; border: 1.5px solid #d6ddec; background: #f7f9fd; color: var(--ink-2); font-size: 12px; font-weight: 600; cursor: pointer; }
  .preset:hover { border-color: #1a3a7c; color: #1a3a7c; }

  .estado-card { background: white; border: 1.5px solid #e3e8f5; border-radius: 14px; padding: 40px 20px; text-align: center; color: var(--ink-3); }
  .spinner { width: 34px; height: 34px; border: 3px solid #e3e8f5; border-top-color: #1a3a7c; border-radius: 50%; animation: girar .8s linear infinite; margin: 0 auto 14px; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .erro-box { background: #fdecec; border: 1.5px solid #f5c2c2; color: #b23b3b; border-radius: 10px; padding: 14px 18px; font-size: 13px; text-align: left; }
  .ok-box { background: #e7f7ef; border: 1.5px solid #a8dcc1; color: #14603f; border-radius: 10px; padding: 16px 20px; font-size: 14px; text-align: left; }
  .ok-box b { font-size: 16px; display: block; margin-bottom: 4px; }
  .ok-box .arquivo { font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; word-break: break-all; }

  @media (max-width: 640px) {
    .header { flex-wrap: wrap; row-gap: 8px; padding: 12px 16px; }
    .conteudo { padding: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Usina Santa Clotilde S/A</div>
      <div class="header-sub">Entrada de Materiais no Período</div>
    </div>
  </div>
  <button class="btn-voltar" onclick="window.location.href='hub.html'">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Voltar
  </button>
</div>

<div class="conteudo">

  <div class="filtros-card">
    <div class="filtros-grid">
      <div class="campo"><label>Data Início</label><input type="date" id="dataIni"></div>
      <div class="campo"><label>Data Fim</label><input type="date" id="dataFim"></div>
      <button class="btn-gerar" id="btnGerar" onclick="gerar()">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        Gerar Excel
      </button>
    </div>
    <div class="presets" id="presets"></div>
  </div>

  <div id="painel">
    <div class="estado-card">Escolha o período e clique em <b>Gerar Excel</b> — o arquivo baixa automaticamente.</div>
  </div>

</div>

<script src="js/xlsx.full.min.js"></script>
<script>
"use strict";

// Rótulos amigáveis para as colunas que já se sabe que existem (a ordem do
// select). Qualquer coluna fora desta lista (o relatório do ERP tem dezenas)
// ainda entra no Excel, só com um rótulo genérico — ver rotularColuna().
const ROTULOS = {
  dataentrada: "Data Entrada", sequencia_nf: "Sequência NF", nrnf: "Nº NF",
  serie: "Série", item: "Item", cod_objetocusto: "Cód. Objeto de Custo",
  cod_negocio: "Cód. Negócio", negocio: "Negócio",
  cod_processo: "Cód. Processo", processo: "Processo",
  cod_subprocesso: "Cód. Subprocesso", subprocesso: "Subprocesso"
};

function rotularColuna(chave) {
  if (ROTULOS[chave]) return ROTULOS[chave];
  return chave.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

function iso(d) { return d.toISOString().slice(0, 10); }
function fmtBR(s) { const [a, b, c] = s.split("-"); return c + "/" + b + "/" + a; }

function montarPresets() {
  const hoje = new Date();
  const y = hoje.getFullYear(), m = hoje.getMonth();
  const ultimoDiaMes = (ano, mesIdx) => new Date(ano, mesIdx + 1, 0).getDate();
  const opcoes = [
    { rot: "Este mês", ini: new Date(y, m, 1), fim: new Date(y, m, ultimoDiaMes(y, m)) },
    { rot: "Mês passado", ini: new Date(y, m - 1, 1), fim: new Date(y, m - 1, ultimoDiaMes(y, m - 1)) },
    { rot: "Últimos 3 meses", ini: new Date(y, m - 2, 1), fim: new Date(y, m, ultimoDiaMes(y, m)) },
    { rot: "Este ano", ini: new Date(y, 0, 1), fim: new Date(y, m, ultimoDiaMes(y, m)) }
  ];
  const cont = document.getElementById("presets");
  cont.innerHTML = "";
  opcoes.forEach(o => {
    const b = document.createElement("button");
    b.className = "preset"; b.textContent = o.rot;
    b.onclick = () => { document.getElementById("dataIni").value = iso(o.ini); document.getElementById("dataFim").value = iso(o.fim); };
    cont.appendChild(b);
  });
  document.getElementById("dataIni").value = iso(new Date(y, m, 1));
  document.getElementById("dataFim").value = iso(new Date(y, m, ultimoDiaMes(y, m)));
}

async function gerar() {
  const ini = document.getElementById("dataIni").value;
  const fim = document.getElementById("dataFim").value;
  if (!ini || !fim) { alert("Informe data início e fim."); return; }
  if (ini > fim) { alert("A data início não pode ser depois da data fim."); return; }

  const painel = document.getElementById("painel");
  const btn = document.getElementById("btnGerar");
  btn.disabled = true;
  painel.innerHTML = '<div class="estado-card"><div class="spinner"></div>Consultando as entradas de materiais no ERP…</div>';

  // Duas etapas com erros bem diferentes: falar com o servidor e montar o
  // arquivo. Misturar as duas num try só rotulava qualquer coisa — inclusive
  // um problema ao montar o Excel — como "erro de conexão", o que confundia
  // mais do que ajudava.
  let linhas;
  try {
    // Accept: application/json é essencial aqui — sem ele, uma sessão
    // expirada faz o AuthFilter REDIRECIONAR para login.html (HTML) em vez
    // de responder com erro em JSON; o fetch segue o redirecionamento
    // sozinho, e o r.json() quebrava tentando interpretar a página de login
    // como JSON, com uma mensagem de erro do navegador sem nexo nenhum.
    const r = await fetch("api/entrada-materiais?dataIni=" + ini + "&dataFim=" + fim,
      { headers: { "Accept": "application/json" } });
    const j = await r.json();
    if (!j.ok) {
      const msg = j.redirect
        ? 'Sua sessão expirou. <a href="login.html" style="color:#b23b3b;font-weight:700">Faça login novamente</a> e tente de novo.'
        : escapar(j.erro || "Falha ao consultar.");
      painel.innerHTML = '<div class="estado-card"><div class="erro-box">' + msg + '</div></div>';
      btn.disabled = false;
      return;
    }
    linhas = j.linhas || [];
  } catch (e) {
    painel.innerHTML = '<div class="estado-card"><div class="erro-box">Não foi possível entender a resposta do servidor. Se a sessão tiver expirado, <a href="login.html" style="color:#b23b3b;font-weight:700">faça login novamente</a>.</div></div>';
    btn.disabled = false;
    return;
  }

  if (!linhas.length) {
    painel.innerHTML = '<div class="estado-card">Nenhuma entrada de material no período de ' + fmtBR(ini) + ' a ' + fmtBR(fim) + '.</div>';
    btn.disabled = false;
    return;
  }

  try {
    const nomeArquivo = exportarExcel(linhas, ini, fim);
    painel.innerHTML =
      '<div class="estado-card" style="text-align:left">' +
      '<div class="ok-box"><b>✅ Excel gerado</b>' +
      linhas.length + ' linha' + (linhas.length === 1 ? '' : 's') + ' de ' + fmtBR(ini) + ' a ' + fmtBR(fim) + '.' +
      '<div class="arquivo">' + escapar(nomeArquivo) + '</div>' +
      '</div></div>';
  } catch (e) {
    painel.innerHTML = '<div class="estado-card"><div class="erro-box">A consulta trouxe ' + linhas.length + ' linha(s), mas não foi possível montar o arquivo Excel. Avise quem cuida da tela — pode ser uma coluna com formato inesperado.</div></div>';
  } finally {
    btn.disabled = false;
  }
}

function escapar(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/** Monta e já baixa o .xlsx — as colunas são as que a consulta devolveu, sem lista fixa. */
function exportarExcel(linhas, ini, fim) {
  // A união das chaves de TODAS as linhas, não só a primeira: o servidor já
  // manda toda coluna mesmo quando o valor é null (serializeNulls), mas essa
  // é uma segunda camada de segurança caso uma linha venha com um formato
  // diferente das demais.
  const colunas = [];
  const vistas = new Set();
  linhas.forEach(l => Object.keys(l).forEach(c => { if (!vistas.has(c)) { vistas.add(c); colunas.push(c); } }));
  const cabecalho = colunas.map(rotularColuna);
  const corpo = linhas.map(l => colunas.map(c => l[c]));

  const aoa = [
    ["Usina Santa Clotilde S/A"],
    ["Entrada de Materiais no Período"],
    ["Período: " + fmtBR(ini) + " a " + fmtBR(fim)],
    [],
    cabecalho,
    ...corpo
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Entrada de Materiais");
  const nomeArquivo = "Entrada-Materiais_" + ini + "_a_" + fim + ".xlsx";
  XLSX.writeFile(wb, nomeArquivo);
  return nomeArquivo;
}

montarPresets();
</script>

<script src="js/icones-modulos.js?v=20260824a"></script>
<script src="js/sidebar-nav.js?v=20260824a" defer></script>
</body>
</html>
