<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores Econômicos · USC</title>
<style>
  :root {
    --serie-1: #2a78d6; --serie-2: #eb6834; --serie-3: #1baf7a;
    --serie-4: #eda100; --serie-5: #e87ba4; --serie-6: #008300;
    --sobe: #0ca30c; --desce: #d03b3b;
    --ink: #0f2460; --ink-2: #52514e; --ink-3: #898781; --rotulo: #64748b;
    --borda: #e3e8f5; --papel: #fff; --papel-2: #f8faff; --fundo: #f4f6fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: var(--fundo); color: #1a1a2e; min-height: 100vh;
         font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }

  .header { background: var(--ink); color: white; padding: 0 32px; height: 62px;
            display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 13px; }
  .header-logo { width: 36px; height: 36px; border-radius: 8px; background: white;
                 display: flex; align-items: center; justify-content: center;
                 overflow: hidden; padding: 4px; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 15px; font-weight: 650; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 1px;
                text-transform: uppercase; letter-spacing: .9px; font-weight: 600; }
  .btn-voltar { display: flex; align-items: center; gap: 7px; padding: 8px 14px;
                border-radius: 8px; border: 1px solid rgba(255,255,255,.16);
                background: transparent; color: rgba(255,255,255,.85); font-size: 13px;
                font-weight: 600; cursor: pointer; font-family: inherit; text-decoration: none; }
  .btn-voltar:hover { background: rgba(255,255,255,.10); color: #fff; }

  .conteudo { max-width: 1400px; margin: 0 auto; padding: 22px 22px 60px; }

  .capa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .cartao { background: var(--papel); border: 1px solid var(--borda); border-radius: 14px;
            padding: 16px 20px; position: relative; overflow: hidden; }
  .cartao::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
                    background: var(--cor, var(--ink)); }
  .cartao .rot { font-size: 10.5px; font-weight: 700; color: var(--rotulo);
                 text-transform: uppercase; letter-spacing: .6px; }
  .cartao .cifra { font-size: 27px; font-weight: 800; color: var(--ink); line-height: 1.15;
                   margin-top: 7px; letter-spacing: -.7px; white-space: nowrap; }
  .cartao .un { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
  .cartao .base { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
  .sobe { color: var(--sobe); font-weight: 800; }
  .desce { color: var(--desce); font-weight: 800; }

  .colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .bloco { background: var(--papel); border: 1px solid var(--borda); border-radius: 14px;
           padding: 16px 20px 18px; margin-bottom: 16px; }
  .bloco h2 { font-size: 15px; font-weight: 800; color: var(--ink); }
  .bloco .fonte { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .bloco .cab { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  /* A idade do dado fica ao lado do título, sempre. Indicador de mercado
     sem hora é indicador em que não se pode confiar para decidir preço. */
  .idade { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .idade.velho { color: var(--serie-2); }
  .idade.erro { color: var(--desce); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th { text-align: right; font-size: 10.5px; font-weight: 700; color: #fff;
             background: var(--ink); padding: 7px 9px; white-space: nowrap; }
  thead th:first-child { text-align: left; border-radius: 6px 0 0 6px; }
  thead th:last-child { border-radius: 0 6px 6px 0; }
  tbody td { padding: 7px 9px; text-align: right; white-space: nowrap;
             border-bottom: 1px solid #eef1f8; }
  tbody td:first-child { text-align: left; }
  tbody tr:last-child td { border-bottom: none; }
  tr.destaque td { font-weight: 800; color: var(--ink); background: var(--papel-2); }

  .tela { position: relative; height: 170px; margin-top: 12px; }
  /* Os dois recortes lado a lado: o de perto (7 dias) e o de longe (3
     meses). Cada um ocupa metade da largura do bloco. */
  .graficos { display: flex; gap: 16px; margin-top: 12px; }
  .mini { flex: 1; min-width: 0; }
  .mtit { font-size: 10.5px; font-weight: 800; color: var(--ink-3);
          text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
  .mini .tela { height: 150px; margin-top: 2px; }
  .vazio { padding: 18px 4px; font-size: 12.5px; color: var(--ink-3); }
  .vazio b { color: var(--desce); }

  /* Preço que passou do gatilho pisca: numa mesa de venda, o número que
     autoriza fechar negócio não pode depender de alguém estar olhando na
     hora certa. */
  @keyframes pulsar { 50% { background: var(--serie-6); color: #fff; } }
  td.gatilho { animation: pulsar 1.1s step-end infinite; font-weight: 800;
               border-radius: 5px; }

  .noticias-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; }
  .nt-col h3 { font-size: 12px; font-weight: 800; color: var(--ink); margin: 2px 0 6px;
               text-transform: uppercase; letter-spacing: .6px; display: flex; align-items: center; gap: 7px; }
  .nt-col h3 .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--cor, var(--ink)); }
  .nt { display: block; text-decoration: none; padding: 7px 0; border-bottom: 1px solid #eef1f8; }
  .nt:last-child { border-bottom: none; }
  .nt-tit { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .nt:hover .nt-tit { color: var(--serie-1); }
  .nt-meta { font-size: 11px; font-weight: 700; color: var(--ink-3); margin-top: 2px; }
  @media (max-width: 700px) { .noticias-cols { grid-template-columns: 1fr; } }

  .estado { text-align: center; padding: 50px 20px; color: var(--ink-3); font-size: 14px; }
  .spinner { width: 26px; height: 26px; border: 2.5px solid var(--borda);
             border-top-color: var(--serie-1); border-radius: 50%; margin: 0 auto 12px;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1000px) {
    .capa { grid-template-columns: repeat(2, 1fr); }
    .colunas { grid-template-columns: 1fr; }
    .header { padding: 0 16px; } .conteudo { padding: 16px 14px 40px; }
  }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<meta name="theme-color" content="#0f2460">
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Indicadores Econômicos / Financeiros</div>
      <div class="header-sub">Câmbio · commodities · índices</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <a class="btn-voltar" href="indicadores-tv.html" target="_blank" title="Abrir a versão para televisão">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="18" x2="12" y2="21"/></svg>
      Modo TV
    </a>
    <a class="btn-voltar" href="hub.html">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar ao Hub
    </a>
  </div>
</div>

<div class="conteudo">
  <div id="corpo"><div class="estado"><div class="spinner"></div>Consultando as fontes…</div></div>
</div>

<script src="js/chart.umd.min.js"></script>
<script src="indicadores-comum.js?v=20260820d"></script>
<script>
// Recarrega sozinho: cotação anda o dia inteiro, e um painel de mercado
// parado é pior do que nenhum.
const INTERVALO_MS = 10 * 60 * 1000;
let DADOS = null;
const graficos = {};

async function carregar() {
  try {
    const r = await fetch('api/indicadores', {headers:{'Accept':'application/json'}});
    const j = await r.json();
    if (j.redirect) { location.href = 'login.html'; return; }
    if (!j.ok) throw new Error(j.erro || 'Erro ao consultar');
    DADOS = j;
    desenhar();
  } catch (e) {
    if (!DADOS) document.getElementById('corpo').innerHTML =
      `<div class="estado"><b style="color:var(--desce)">Não foi possível consultar as fontes.</b>
       <div style="margin-top:10px;font-size:12.5px">${esc(e.message || e)}</div></div>`;
  }
}

function desenhar() {
  const d = DADOS;
  document.getElementById('corpo').innerHTML = `
    <div class="capa">${cartoesCapa(d)}</div>
    <div class="colunas">
      <div>
        <div class="bloco">
          <div class="cab"><div><h2>Cotação do dólar</h2>
            <div class="fonte">USD/BRL comercial</div></div>${idade(d.dolar)}</div>
          ${tabelaDolar(d.dolar)}
          <div class="graficos">
            <div class="mini"><div class="mtit">Últimos 7 dias</div>
              <div class="tela"><canvas id="gDolarD"></canvas></div></div>
            <div class="mini"><div class="mtit">Últimos 3 meses</div>
              <div class="tela"><canvas id="gDolarM"></canvas></div></div>
          </div>
        </div>
        <div class="bloco">
          <div class="cab"><div><h2>Açúcar NY nº 11</h2>
            <div class="fonte">Bolsa de Nova York · centavos de dólar por libra-peso</div></div>${idade(d.acucar)}</div>
          ${tabelaAcucar(d.acucar)}
          <div class="graficos">
            <div class="mini"><div class="mtit">Últimos 7 dias</div>
              <div class="tela"><canvas id="gAcucarD"></canvas></div></div>
            <div class="mini"><div class="mtit">Últimos 3 meses</div>
              <div class="tela"><canvas id="gAcucarM"></canvas></div></div>
          </div>
        </div>
      </div>
      <div>
        <div class="bloco">
          <div class="cab"><div><h2>Indicadores econômicos</h2>
            <div class="fonte">Banco Central do Brasil</div></div>${idade(d.indicadores)}</div>
          ${tabelaIndicadores(d.indicadores)}
        </div>
        <div class="bloco">
          <div class="cab"><div><h2>Preço da cana-de-açúcar</h2>
            <div class="fonte">Sindaçúcar/AL · R$ por quilo de ATR</div></div></div>
          ${tabelaCana(d.precoCana)}
        </div>
        <div class="bloco">
          <div class="cab"><div><h2>Preço dos produtos</h2>
            <div class="fonte">CEPEA/ESALQ e bolsa, já convertidos</div></div>${idade(d.cepea)}</div>
          ${tabelaProdutos(d.produtos)}
        </div>
      </div>
    </div>
    <div class="bloco">
      <div class="cab"><div><h2>Notícias</h2>
        <div class="fonte">Açúcar e dólar · Google Notícias, atualiza sozinho</div></div>${idade(d.noticias)}</div>
      ${blocoNoticias(d.noticias)}
    </div>
    <div style="text-align:right;font-size:11.5px;color:var(--ink-3);margin-top:4px">
      Atualizado em ${esc(d.atualizadoEm)} · a página se atualiza sozinha a cada 10 minutos
    </div>`;

  const dolarDia = ((d.dolarDiario && d.dolarDiario.dado) || [])
    .map(p => ({ rotulo: rotuloDia(p.data), valor: p.valor }));
  plotar('gDolarD', dolarDia, 'R$ ', '#2a78d6', 2, 'Sem histórico recente.');
  plotar('gDolarM', serieMensal(d.dolarMensal), 'R$ ', '#2a78d6', 2, 'Sem histórico mensal.');
  plotar('gAcucarD', serieAcucar(d.acucarDiario), '', '#eb6834', 2,
         'Juntando o histórico diário — depende de mais pregões coletados.');
  plotar('gAcucarM', serieMensal(d.acucarMensal), '', '#eb6834', 2,
         'Juntando o histórico mensal.');
}

/** Desenha uma série de pares {rotulo, valor}; se vier vazia, avisa no lugar. */
function plotar(id, pares, prefixo, cor, casas, vazioMsg) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (!pares.length) {
    const box = canvas.closest('.tela');
    if (box) box.innerHTML = `<div class="vazio">${esc(vazioMsg)}</div>`;
    return;
  }
  linha(id, pares.map(p => p.rotulo), pares.map(p => p.valor), prefixo, cor, casas);
}

function linha(id, rotulos, valores, prefixo, cor, casas) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (graficos[id]) graficos[id].destroy();
  graficos[id] = new Chart(canvas, {
    type: 'line',
    data: { labels: rotulos, datasets: [{
      data: valores, borderColor: cor, backgroundColor: 'transparent',
      borderWidth: 2.5, pointRadius: 3, pointBackgroundColor: cor,
      pointBorderColor: '#fff', pointBorderWidth: 1.5, tension: .25 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 20, right: 14, left: 10, bottom: 2 } },
      scales: {
        x: { grid: { display: false }, border: { color: '#e3e8f5' },
             ticks: { color: '#898781', font: { size: 10.5, weight: '700' },
                      maxRotation: 0, autoSkipPadding: 12 } },
        // Sem começar no zero: câmbio e commodity variam poucos por cento, e
        // um eixo desde zero achataria a linha até ela virar um traço reto.
        y: { beginAtZero: false, grace: '18%', grid: { color: '#e9edf6' },
             border: { display: false },
             ticks: { color: '#898781', font: { size: 10.5, weight: '600' }, maxTicksLimit: 4,
                      callback: v => prefixo + fmt(v, casas) } }
      },
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        label: c => prefixo + fmt(c.parsed.y, casas) } } }
    },
    plugins: [{
      id: 'pontas',
      afterDatasetsDraw(chart) {
        // Só o primeiro e o último: quinze rótulos numa faixa de 170px
        // viram borrão, e o que importa nessa linha é de onde saiu e onde
        // está agora.
        const ctx = chart.ctx, pts = chart.getDatasetMeta(0).data;
        const v = chart.data.datasets[0].data;
        if (!pts.length) return;
        ctx.save();
        ctx.font = '800 11px system-ui, sans-serif';
        ctx.fillStyle = '#0f2460';
        ctx.textBaseline = 'bottom';
        // Com um ponto só, primeiro e último são o mesmo — dois rótulos no
        // mesmo lugar viram um borrão ("17,50 17,50"). Aí, um só.
        const marcas = pts.length < 2
          ? [[0, 'left', 5]]
          : [[0, 'left', 5], [pts.length-1, 'right', -5]];
        marcas.forEach(([i, al, dx]) => {
          if (!pts[i]) return;
          ctx.textAlign = al;
          ctx.fillText(prefixo + fmt(v[i], casas), pts[i].x + dx, pts[i].y - 8);
        });
        ctx.restore();
      }
    }]
  });
}

carregar();
setInterval(carregar, INTERVALO_MS);
</script>
<script src="js/icones-modulos.js?v=20260819a"></script>
<script src="js/sidebar-nav.js?v=20260819a" defer></script>

</body>
</html>
