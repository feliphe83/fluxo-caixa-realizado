<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Executivo · Consumo de Combustível</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --serie-1: #2a78d6;   /* azul — base / Equipamentos Próprios */
    --serie-2: #eb6834;   /* laranja — Equipamentos de Terceiros / destaque */
    --serie-3: #1baf7a;   /* água — maior/destaque positivo */
    --serie-4: #eda100;   /* amarelo */
    --serie-5: #e87ba4;   /* magenta */
    --serie-6: #008300;   /* verde — última semana */
    --serie-8: #e34948;   /* vermelho — menor/alerta */
    --serie-outros: #98a2b3;
    --ink: #0f2460;
    --ink-2: #52514e;
    --ink-3: #898781;
    --grade: #e9edf6;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f6fb;
    color: #1a1a2e;
  }

  /* ── Header (estilo do relatório PDF) ── */
  .header {
    background: linear-gradient(135deg, #16342a 0%, #234f3b 100%);
    color: white;
    padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .header-logo { width: 44px; height: 44px; border-radius: 8px; background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 5px; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 19px; font-weight: 800; }
  .header-sub { font-size: 12.5px; opacity: .9; margin-top: 3px; font-weight: 600; }
  .header-periodo { font-size: 11.5px; opacity: .72; margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
  .header-emitido { font-size: 10.5px; opacity: .85; text-align: right; line-height: 1.5; white-space: nowrap; }
  .header-emitido b { font-size: 13px; display: block; }
  .btn-voltar {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 16px; border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9);
    font-size: 13px; font-weight: 600; cursor: pointer;
    margin-right: 56px; white-space: nowrap;
  }
  .btn-voltar:hover { background: rgba(255,255,255,0.18); }

  .conteudo { max-width: 1360px; margin: 0 auto; padding: 24px; }

  /* ── Filtros ── */
  .filtros-card {
    background: white; border: 1.5px solid #e3e8f5; border-radius: 14px;
    padding: 18px 22px; margin-bottom: 20px;
  }
  .filtros-grid { display: grid; grid-template-columns: 1fr 1fr 1.2fr auto; gap: 14px; align-items: end; }
  .campo label { display: block; font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  .campo input { width: 100%; padding: 8px 10px; border: 1.5px solid #d8dfee; border-radius: 8px; font-size: 13px; color: #1a1a2e; outline: none; height: 38px; background: white; }
  .campo input:focus { border-color: #1a3a7c; }
  .btn-gerar {
    padding: 0 20px; border-radius: 9px; border: none;
    background: #1a3a7c; color: white; font-size: 13.5px; font-weight: 700;
    cursor: pointer; height: 38px; display: flex; align-items: center; gap: 8px;
  }
  .btn-gerar:hover { background: #0f2460; }
  .btn-gerar:disabled { background: #9ca3af; cursor: not-allowed; }
  .presets { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .preset { padding: 5px 12px; border-radius: 999px; border: 1.5px solid #d8dfee; background: white; color: #475569; font-size: 12px; font-weight: 600; cursor: pointer; }
  .preset:hover { border-color: #1a3a7c; color: #1a3a7c; }

  .export-bar { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 16px; }
  .btn-export {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; border: 1.5px solid #d8dfee;
    background: white; color: #475569; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .btn-export:hover { border-color: #1a3a7c; color: #1a3a7c; }

  /* ── Seções ── */
  .secao { background: white; border: 1.5px solid #e3e8f5; border-radius: 14px; padding: 22px 24px; margin-bottom: 20px; }
  .secao-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .secao-num {
    width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: white;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .secao-titulo { font-size: 16px; font-weight: 800; color: var(--ink); }
  .secao-sub { font-size: 12px; color: var(--ink-3); margin: 2px 0 16px 32px; }

  .insight-box {
    display: flex; gap: 12px; background: #f5f7fb; border-left: 3px solid var(--serie-3);
    border-radius: 8px; padding: 12px 16px; margin-top: 16px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55;
  }
  .insight-box b { color: var(--ink); }
  .insight-icone { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--serie-3); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }

  .nota-box {
    display: flex; gap: 10px; align-items: flex-start; background: #fffaf0; border-left: 3px solid #eda100;
    border-radius: 8px; padding: 10px 16px; font-size: 12px; color: var(--ink-2); line-height: 1.55;
  }
  .nota-box b { color: var(--ink); }
  .nota-icone { flex-shrink: 0; color: #eda100; font-size: 14px; line-height: 1.6; }

  /* ── KPIs (valor em destaque, rótulo abaixo — como no PDF) ── */
  .kpi { padding: 2px; }
  .kpi .valor { font-size: 19px; font-weight: 800; color: var(--ink); line-height: 1.15; }
  .kpi .rotulo { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .3px; margin-top: 3px; }
  .kpi .sub { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi-row .kpi { background: #f8faff; border: 1px solid #e3e8f5; border-radius: 12px; padding: 14px 16px; }

  /* Blocos "GERAL CONSOLIDADO" / "PRÓPRIOS" / "TERCEIROS", no estilo das
     faixas coloridas do relatório PDF: barra de título + grade de 6 tiles. */
  .bloco-kpis { margin-bottom: 18px; }
  .bloco-kpis.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .bloco-barra {
    padding: 8px 14px; border-radius: 8px 8px 0 0; font-size: 11px; font-weight: 800;
    letter-spacing: .6px; color: white; text-align: center; text-transform: uppercase;
  }
  .bloco-barra.geral { background: var(--ink); }
  .bloco-barra.propria { background: var(--serie-1); }
  .bloco-barra.terceiro { background: var(--serie-2); }
  .kpi-row-6 {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px;
    background: #e3e8f5; border: 1px solid #e3e8f5; border-radius: 0 0 10px 10px; overflow: hidden;
  }
  .kpi-row-6 .kpi { background: #f8faff; padding: 12px 8px; text-align: center; }

  .split-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 4px; }

  /* ── Gráficos ── */
  .grafico-area { position: relative; height: 300px; margin-top: 6px; }
  .legenda-manual { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--ink-2); }
  .legenda-manual .item { display: flex; align-items: center; gap: 6px; }
  .legenda-manual .dot { width: 9px; height: 9px; border-radius: 3px; }

  /* ── Distribuição (donut + legenda) ── */
  .distrib-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 24px; align-items: center; }
  .legenda-lista { display: flex; flex-direction: column; gap: 12px; }
  .legenda-area { display: flex; align-items: flex-start; gap: 10px; }
  .legenda-dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 3px; flex-shrink: 0; }
  .legenda-nome { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .legenda-valores { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }

  table.tabela-simples { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.tabela-simples thead th { background: #eef2fb; color: var(--ink); text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  table.tabela-simples thead th.num { text-align: right; }
  table.tabela-simples tbody td { padding: 8px 10px; border-bottom: 1px solid #eef1f8; }
  table.tabela-simples tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.tabela-simples tbody tr:last-child td { border-bottom: none; font-weight: 700; background: #f5f7fb; }
  .barra-participacao { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: #e3e8f5; overflow: hidden; vertical-align: middle; margin-right: 8px; }
  .barra-participacao .fill { height: 100%; background: var(--serie-1); border-radius: 3px; }

  /* ── Classe Operativa (matriz/heatmap) ── */
  .matriz-scroll { overflow-x: auto; }
  table.matriz { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 900px; }
  table.matriz thead th { background: var(--ink); color: white; padding: 7px 8px; font-size: 9.5px; text-transform: uppercase; text-align: right; white-space: nowrap; }
  table.matriz thead th:first-child { text-align: left; min-width: 160px; }
  table.matriz tbody td { padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
  table.matriz tbody td:first-child { text-align: left; font-weight: 600; background: white !important; }
  table.matriz tbody td:nth-child(2) { font-style: italic; color: var(--ink-3); }
  table.matriz tbody tr.total td { background: #eef2fb !important; font-weight: 800; border-top: 2px solid var(--ink); color: var(--ink) !important; }

  /* ── Rankings ── */
  table.ranking { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ranking thead th { background: var(--ink); color: white; text-align: left; padding: 9px 12px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; }
  table.ranking thead th.num { text-align: right; }
  table.ranking tbody td { padding: 8px 12px; border-bottom: 1px solid #eef1f8; white-space: nowrap; }
  table.ranking tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.ranking tbody tr:hover { background: #f8faff; }
  .posicao-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #eef2fb; color: var(--ink); font-size: 10.5px; font-weight: 800; }
  .posicao-badge.top1 { background: var(--ink); color: white; }

  .loading-state, .erro-state, .vazio-state { text-align: center; padding: 60px 20px; color: #94a0b8; }
  .spinner { width: 30px; height: 30px; border: 3px solid #e3e8f5; border-top-color: #1a3a7c; border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .erro-state { color: #ef4444; }
  #painel.atualizando { opacity: .5; pointer-events: none; transition: opacity .15s; }

  @media (max-width: 1000px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .kpi-row-6 { grid-template-columns: repeat(3, 1fr); }
    .bloco-kpis.split { grid-template-columns: 1fr; }
    .split-row { grid-template-columns: 1fr; }
    .distrib-grid { grid-template-columns: 1fr; }
    .filtros-grid { grid-template-columns: 1fr 1fr; }
    .header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Usina Santa Clotilde S/A</div>
      <div class="header-sub" id="headerSub">Relatório Executivo — Consumo de Combustível</div>
      <div class="header-periodo" id="headerPeriodo">&nbsp;</div>
    </div>
  </div>
  <div class="header-right">
    <div class="header-emitido">Emitido em<b id="headerEmitido">—</b></div>
    <button class="btn-voltar" onclick="window.location.href='hub.html'">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar
    </button>
  </div>
</div>

<div class="conteudo">

  <div class="filtros-card">
    <div class="filtros-grid">
      <div class="campo"><label>Data Início</label><input type="date" id="dataIni"></div>
      <div class="campo"><label>Data Fim</label><input type="date" id="dataFim"></div>
      <div class="campo">
        <label>Combustível</label>
        <input type="text" id="fCombustivel" list="listaCombustivel" value="Diesel" placeholder="Ex.: Diesel, Gasolina, Etanol">
        <datalist id="listaCombustivel"></datalist>
      </div>
      <button class="btn-gerar" id="btnGerar" onclick="carregar()">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        Gerar Relatório
      </button>
    </div>
    <div class="presets">
      <button class="preset" onclick="preset(4)">Últimas 4 semanas</button>
      <button class="preset" onclick="preset(8)">Últimas 8 semanas</button>
      <button class="preset" onclick="preset(17)">Últimas 17 semanas</button>
      <button class="preset" onclick="preset(26)">Últimas 26 semanas</button>
    </div>
  </div>

  <div id="painel">
    <div class="loading-state"><div class="spinner"></div><p>Consultando abastecimentos…</p></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let DADOS = null;
let charts = {};

/** Últimas N semanas mostradas nos gráficos/tabela de classe operativa —
 * as demais semanas do período viram a barra/coluna "Média histórica",
 * igual ao relatório PDF ("Últimas 5 semanas + Média Histórica"). */
const N_ULTIMAS = 5;

const fmtInt  = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const fmtDec  = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDec1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtBRL  = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtBRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const fmtPct  = v => fmtDec1.format(v) + '%';
// Compacto em milhares (R$79K) — usado no rótulo de custo dentro da barra, onde o espaço é curto.
const fmtK = v => 'R$' + Math.round(v / 1000) + 'K';

function fmt8(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDataCurta(iso) { const [y,m,d] = iso.split('-'); return d + '/' + m + '/' + y.slice(2); }
function fmtDataLonga(iso) { const [y,m,d] = iso.split('-'); return d + '/' + m + '/' + y; }

function preset(semanas) {
  const hoje = new Date();
  const ini = new Date(hoje.getTime() - (semanas * 7 - 1) * 864e5);
  document.getElementById('dataIni').value = fmt8(ini);
  document.getElementById('dataFim').value = fmt8(hoje);
  carregar();
}

(function initDatas() {
  document.getElementById('dataIni').value = '2026-03-02';
  document.getElementById('dataFim').value = fmt8(new Date());
  const hoje = new Date();
  document.getElementById('headerEmitido').textContent =
    fmt8(hoje).split('-').reverse().join('/');
})();

async function carregar() {
  const dataIni = document.getElementById('dataIni').value;
  const dataFim = document.getElementById('dataFim').value;
  if (!dataIni || !dataFim) { alert('Informe o período completo.'); return; }
  if (dataFim < dataIni) { alert('Data Fim não pode ser anterior à Data Início.'); return; }

  const painel = document.getElementById('painel');
  const btn = document.getElementById('btnGerar');
  btn.disabled = true;
  if (DADOS) painel.classList.add('atualizando');

  const p = new URLSearchParams({ dataIni, dataFim });
  const combustivel = document.getElementById('fCombustivel').value.trim();
  if (combustivel) p.set('combustivel', combustivel);

  try {
    const r = await fetch('api/combustivel-dashboard?' + p.toString(), { headers: { 'Accept': 'application/json' } });
    const j = await r.json();
    if (j.redirect) { window.location.href = 'login.html'; return; }
    if (!j.ok) throw new Error(j.erro || 'Erro na consulta');

    DADOS = j;
    atualizarListaCombustiveis(j.opcoes);
    atualizarCabecalho(j);
    renderizar();

  } catch (e) {
    Object.values(charts).forEach(c => c.destroy());
    charts = {};
    DADOS = null;
    painel.innerHTML = '<div class="erro-state"><p>❌ ' + escapeHtml(e.message) + '</p></div>';
  } finally {
    btn.disabled = false;
    painel.classList.remove('atualizando');
  }
}

function atualizarListaCombustiveis(opcoes) {
  const dl = document.getElementById('listaCombustivel');
  dl.innerHTML = (opcoes.combustiveis || [])
    .map(o => `<option value="${escapeHtml(o.descricao)}"></option>`).join('');
}

function atualizarCabecalho(j) {
  const filtro = document.getElementById('fCombustivel').value.trim();
  const opcoes = (j.opcoes && j.opcoes.combustiveis) || [];
  const achado = filtro ? opcoes.find(o => o.descricao.toLowerCase().includes(filtro.toLowerCase())) : null;
  const nomeCombustivel = achado ? achado.descricao : (filtro || 'Combustível');
  document.getElementById('headerSub').textContent = 'Relatório Executivo — Consumo de ' + nomeCombustivel;

  const dataIni = document.getElementById('dataIni').value;
  const dataFim = document.getElementById('dataFim').value;
  document.getElementById('headerPeriodo').textContent =
    'Período: ' + fmtDataLonga(dataIni) + ' a ' + fmtDataLonga(dataFim) + ' · ' + j.semanas.length + ' semanas acumuladas';
}

// ── Renderização geral ───────────────────────────────────────────────────

function renderizar() {
  const j = DADOS;
  const painel = document.getElementById('painel');
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  if (!j.totalLinhas) {
    painel.innerHTML = '<div class="vazio-state"><p>Nenhum abastecimento encontrado no período com os filtros escolhidos.</p></div>';
    return;
  }

  painel.innerHTML = `
    ${secaoGeralConsolidado(j)}
    ${secaoConsumoSemanal(j)}
    ${secaoEvolucaoPreco(j)}
    ${secaoDistribuicao(j)}
    ${secaoAtividades(j)}
    ${secaoClasseOperativa(j)}
    ${secaoRanking('7', 'Top 10 Equipamentos Próprios', 'Ranking por volume consumido · frota própria', j.topProprios, 'proprios')}
    ${secaoRanking('8', 'Top 10 Terceiros por Proprietário', 'Ranking por proprietário de equipamento', j.topTerceiros, 'terceiros')}
    <div class="export-bar" style="margin-top:0">
      <div style="flex:1;font-size:12px;color:var(--ink-3);align-self:center">
        ${j.truncadoDetalhe ? 'Detalhamento limitado aos ' + fmtInt.format(j.detalhe.length) + ' abastecimentos mais recentes (de ' + fmtInt.format(j.totalLinhas) + ' no período).' : fmtInt.format(j.totalLinhas) + ' abastecimentos no período.'}
      </div>
      <button class="btn-export" onclick="exportarExcel()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Exportar Excel
      </button>
      <button class="btn-export" onclick="window.print()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Imprimir
      </button>
    </div>
  `;

  desenharConsumoSemanal();
  desenharPreco();
  desenharDistribuicaoDonut();
  desenharAtividades();
}

function kpi(valor, rotulo, sub) {
  return `<div class="kpi"><div class="valor">${valor}</div><div class="rotulo">${rotulo}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}

// ── 1. Geral Consolidado / Próprios / Terceiros ──────────────────────────

function secaoGeralConsolidado(j) {
  const k = j.kpis;
  const dataIni = document.getElementById('dataIni').value;
  const dataFim = document.getElementById('dataFim').value;

  return `
  <div class="secao">
    <div class="secao-header"><span class="secao-num">1</span><span class="secao-titulo">Resumo Executivo</span></div>
    <div class="secao-sub">Visão consolidada do consumo · ${j.semanas.length} semanas operacionais</div>

    <div class="bloco-kpis">

const eixoBase = {

function getCss(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

/** Divide a série semanal em "histórico" (tudo menos as últimas N) + "últimas N",
 * igual ao recorte "Últimas 5 Semanas + Média Histórica" do relatório PDF. */
function ultimasComMedia(serie, n) {
  if (serie.length <= n) return { historica: null, ultimas: serie };
  const ultimas = serie.slice(-n);
  const resto = serie.slice(0, serie.length - n);
  const somaVolume = resto.reduce((s, x) => s + x.volume, 0);
  const somaCusto = resto.reduce((s, x) => s + x.custo, 0);
  const precosValidos = resto.map(x => x.precoMedio).filter(v => v > 0);
  const mediaPreco = precosValidos.length ? precosValidos.reduce((a, b) => a + b, 0) / precosValidos.length : 0;
  return {
    historica: {
      label: 'Média\n(' + resto.length + ' sem)',
      volume: somaVolume / resto.length,
      custo: somaCusto / resto.length,
      precoMedio: mediaPreco,
      numSemanas: resto.length,
    },
    ultimas,
  };
}

// Desenha, por cima das barras de Volume: o valor de Volume acima da barra e
// o Custo (R$) centralizado dentro dela (branco, só quando a barra é alta o
// bastante pro texto caber sem estourar).
const rotulosVolumeCustoPlugin = {
  id: 'rotulosVolumeCusto',
  afterDatasetsDraw(chart, args, opts) {
    if (!opts.custos) return;
    const ctx = chart.ctx;
    const meta = chart.getDatasetMeta(0);
    ctx.save();
    ctx.textAlign = 'center';
    meta.data.forEach((barra, i) => {
      ctx.font = '700 10px -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = '#52514e';
      ctx.textBaseline = 'bottom';
      ctx.fillText(opts.volumes[i], barra.x, barra.y - 4);

      // Custo em pé (vertical), de baixo pra cima, dentro da barra — só
      // desenha se a altura da barra comportar o texto (medido de verdade,
      // nunca estoura pra fora do próprio traço).
      const alturaBarra = barra.base - barra.y;
      ctx.font = '700 9.5px -apple-system, "Segoe UI", sans-serif';
      const larguraTexto = ctx.measureText(opts.custos[i]).width;
      if (alturaBarra - 10 >= larguraTexto) {
        ctx.save();
        ctx.translate(barra.x, (barra.y + barra.base) / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'middle';
        ctx.fillText(opts.custos[i], 0, 0);
        ctx.restore();
      }
    });
    ctx.restore();
  }
};

function desenharConsumoSemanal() {
  const { historica, ultimas } = ultimasComMedia(DADOS.serieSemanal, N_ULTIMAS);

// ── 6. Classe Operativa (matriz: média histórica + últimas semanas) ─────

function secaoClasseOperativa(j) {
  const co = j.porClasseOperativa;
  const semanas = j.semanas;
  const n = Math.min(N_ULTIMAS, semanas.length);
  const nHist = semanas.length - n;
  const ultimasSemanas = semanas.slice(-n);
  const theadCols = ultimasSemanas.map(s => `<th>${s.label}</th>`).join('');

  const linhas = co.linhas.map(l => {
    const ultimas = l.porSemana.slice(-n);
    const resto = l.porSemana.slice(0, l.porSemana.length - n);
    const media = resto.length ? resto.reduce((a,b) => a+b, 0) / resto.length : 0;
    const total = ultimas.reduce((a,b) => a+b, 0);
    const maxLinha = Math.max(media, ...ultimas, 1);
    const celula = v => {
      const intensidade = v / maxLinha;
      const bg = v === 0 ? 'transparent' : `rgba(42,120,214,${0.12 + intensidade*0.55})`;
      const cor = intensidade > 0.6 ? '#fff' : 'var(--ink)';
      return `<td style="background:${bg};color:${cor}">${v ? fmtInt.format(Math.round(v)) : '-'}</td>`;
    };
    return `<tr><td>${escapeHtml(l.nome)}</td><td>${media ? fmtInt.format(Math.round(media)) : '-'}</td>${ultimas.map(celula).join('')}<td class="num" style="font-weight:700">${fmtInt.format(Math.round(total))}</td></tr>`;
  }).join('');

  const totalUltimas = co.totalPorSemana.slice(-n);
  const totalResto = co.totalPorSemana.slice(0, co.totalPorSemana.length - n);
  const totalMedia = totalResto.length ? totalResto.reduce((a,b) => a+b, 0) / totalResto.length : 0;
  const totalGeralUltimas = totalUltimas.reduce((a,b) => a+b, 0);
  const totalCols = totalUltimas.map(v => `<td>${fmtInt.format(Math.round(v))}</td>`).join('');

  return `
  <div class="secao">
    <div class="secao-header"><span class="secao-num">6</span><span class="secao-titulo">Consumo por Classe Operativa</span></div>
    <div class="secao-sub">Volume em litros (L) · média (${nHist} sem. históricas) + últimas ${ultimasSemanas.length} semanas · intensidade da cor = peso na linha</div>

    <div class="matriz-scroll">
      <table class="matriz">
        <thead><tr><th>Classe Operativa</th><th>Média<br>(${nHist}sem)</th>${theadCols}<th>Total<br>${ultimasSemanas.length}sem</th></tr></thead>
        <tbody>
          ${linhas}
          <tr class="total"><td>Total Geral</td><td>${totalMedia ? fmtInt.format(Math.round(totalMedia)) : '-'}</td>${totalCols}<td>${fmtInt.format(Math.round(totalGeralUltimas))}</td></tr>
        </tbody>
      </table>
    </div>
    ${co.linhas.some(l => l.nome === 'Não Classificado')
      ? '<div class="insight-box"><span class="insight-icone">!</span><div>Há modelos de equipamento sem Classe Operativa cadastrada — complete o de-para em <b>Administração → De-Para Classe Operativa</b> para refinar esta visão.</div></div>'
      : ''}
  </div>`;
}

      <td class="num">${fmtInt.format(r.volume)} L</td>
      <td class="num">${fmtBRL0.format(r.custo)}</td>
      <td class="num"><span class="barra-participacao"><span class="fill" style="width:${Math.min(100,r.participacao)}%"></span></span>${fmtPct(r.participacao)}</td>
      ${ehProprio ? `<td class="num">${consumoStr} ${escapeHtml(r.unidadeConsumo || '')}</td>` : ''}
    </tr>`;
  }).join('');

  const colunas = ehProprio ? 7 : 6;

  return `
  <div class="secao">
    <div class="secao-header"><span class="secao-num">${num}</span><span class="secao-titulo">${titulo}</span></div>
    <div class="secao-sub">${subtitulo} · ordenado do maior para o menor consumo</div>
    <div class="tabela-scroll" style="overflow-x:auto">
      <table class="ranking">
        <thead><tr>
          <th>#</th><th>${ehProprio?'Equipamento':'Proprietário / Empresa'}</th><th>Obj. Custo</th>
          <th class="num">Volume (L)</th>
          <th class="num">Custo (R$)</th>
          <th class="num">Part.%</th>
          ${ehProprio ? '<th class="num">Cons. Médio</th>' : ''}
        </tr></thead>
        <tbody>${linhas || `<tr><td colspan="${colunas}" style="text-align:center;color:var(--ink-3);padding:20px">Sem dados no período.</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

// ── Chart helper ──────────────────────────────────────────────────────────

function novoChart(id, config) {
  if (charts[id]) charts[id].destroy();
  const canvas = document.getElementById(id);
  if (!canvas) return;
  charts[id] = new Chart(canvas, config);
}

// ── Export Excel ────────────────────────────────────────────────────────

function exportarExcel() {
  if (!DADOS) return;
  const wb = XLSX.utils.book_new();

  const resumo = [
    ['Volume Total (L)', DADOS.kpis.volumeTotal],
    ['Custo Total (R$)', DADOS.kpis.custoTotal],
    ['Preço Médio Ponderado (R$/L)', DADOS.kpis.precoMedioPonderado],
    ['Equipamentos Monitorados', DADOS.kpis.equipamentosMonitorados],
    ['Volume Próprios (L)', DADOS.kpis.propria.volume],
    ['Volume Terceiros (L)', DADOS.kpis.terceiro.volume],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumo), 'Resumo');

  const semanal = [['Semana','Volume (L)','Custo (R$)','Preço Médio (R$/L)'],
    ...DADOS.serieSemanal.map(s => [s.label, s.volume, s.custo, s.precoMedio])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(semanal), 'Consumo Semanal');

  const areas = [['Área de Negócio','Volume (L)','Custo (R$)','Participação (%)'],
    ...DADOS.porAreaNegocio.map(a => [a.nome, a.volume, a.custo, a.participacao])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(areas), 'Por Área de Negócio');

  const ativ = [['Atividade','Volume (L)','Custo (R$)','Participação (%)'],
    ...DADOS.porAtividade.map(a => [a.nome, a.volume, a.custo, a.participacao])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ativ), 'Top Atividades');

  const classeHeader = ['Classe Operativa', ...DADOS.semanas.map(s => s.label), 'Total'];
  const classeLinhas = DADOS.porClasseOperativa.linhas.map(l => [l.nome, ...l.porSemana, l.total]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([classeHeader, ...classeLinhas]), 'Classe Operativa');

  const proprios = [['#','Equipamento','Modelo','Obj. Custo','Volume (L)','Custo (R$)','Consumo Médio','Unidade','Participação (%)'],
    ...DADOS.topProprios.map(r => [r.posicao, r.equipamento, r.modelo, r.grupo, r.volume, r.custo, r.consumoMedio, r.unidadeConsumo, r.participacao])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(proprios), 'Top Próprios');

  const terceiros = [['#','Proprietário','Obj. Custo','Volume (L)','Custo (R$)','Participação (%)'],
    ...DADOS.topTerceiros.map(r => [r.posicao, r.proprietario, r.atividade, r.volume, r.custo, r.participacao])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(terceiros), 'Top Terceiros');

  const detalhe = DADOS.detalhe.map(d => ({
    'Data': d.data ? String(d.data).substring(0,10) : '', 'Hora': d.hora_ini || '',
    'Equipamento': d.des_equipamento || d.prefixo || '', 'Combustível': d.des_combustivel || '',
    'Litros': d.qtde_litros || 0, 'R$/Litro': d.valor_unitario || 0, 'Valor Total': d.valor_total || 0,
    'Fazenda': d.des_fazenda || '', 'Tipo Cliente': d.tipocliente || '', 'Área de Negócio': d.desc_negocio || '',
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detalhe), 'Detalhamento');

  const ini = document.getElementById('dataIni').value, fim = document.getElementById('dataFim').value;
  XLSX.writeFile(wb, `relatorio_combustivel_${ini}_a_${fim}.xlsx`);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
