<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento a Fornecedor de Cana</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0f2460; --ink-2: #52514e; --ink-3: #898781; --grade: #e9edf6;
    --cana: #eef7ef; --evt: #fbf3e7; --tot: #eef1f7; --fin: #eaf2fd;
    --pos: #14603f; --neg: #b23b3b;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f6fb; color: #1a1a2e; }

  .header { background: linear-gradient(135deg, #0f2460 0%, #1a3a7c 100%); color: white; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .header-logo { width: 44px; height: 44px; border-radius: 8px; background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 5px; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 19px; font-weight: 800; }
  .header-sub { font-size: 12.5px; opacity: .9; margin-top: 3px; font-weight: 600; }
  .header-periodo { font-size: 11.5px; opacity: .72; margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
  .header-emitido { font-size: 10.5px; opacity: .85; text-align: right; line-height: 1.5; white-space: nowrap; }
  .header-emitido b { font-size: 13px; display: block; }
  .btn-voltar { display: flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-voltar:hover { background: rgba(255,255,255,0.18); }

  .conteudo { max-width: 1700px; margin: 0 auto; padding: 22px; }

  .filtros-card { background: white; border: 1.5px solid #e3e8f5; border-radius: 14px; padding: 16px 20px; margin-bottom: 18px; }
  .filtros-grid { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; }
  .campo { display: flex; flex-direction: column; gap: 5px; }
  .campo label { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .4px; }
  .campo input { padding: 8px 10px; border: 1.5px solid #d6ddec; border-radius: 8px; font-size: 14px; color: var(--ink); }
  .campo input.safra { width: 90px; }
  .btn-gerar { display: flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 8px; border: none; background: #1a3a7c; color: white; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-gerar:hover { background: #14306a; }

  .barra-acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .barra-acoes .esp { flex: 1; }
  .abas { display: inline-flex; gap: 4px; background: #eef1f7; border-radius: 10px; padding: 4px; }
  .aba { padding: 7px 16px; border-radius: 8px; border: none; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 700; cursor: pointer; }
  .aba.ativa { background: #1a3a7c; color: #fff; }
  .aba:not(.ativa):hover { background: #e0e5f0; }
  .btn-acao { display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 8px; border: 1.5px solid #d6ddec; background: white; color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-acao:hover { border-color: #1a3a7c; color: #1a3a7c; }
  .btn-acao.destaque { background: #1baf7a; border-color: #1baf7a; color: white; }
  .btn-acao.destaque:hover { background: #159066; }

  .tabela-wrap { background: white; border: 1.5px solid #e3e8f5; border-radius: 14px; overflow: auto; }
  table.pg { border-collapse: collapse; width: 100%; font-size: 12px; white-space: nowrap; }
  table.pg thead th { background: #0f2460; color: #fff; font-weight: 700; font-size: 11px; padding: 8px; position: sticky; top: 0; z-index: 2; text-align: right; }
  table.pg thead th.grp { background: #1a3a7c; text-align: center; }
  table.pg th.nome, table.pg td.nome { position: sticky; left: 0; z-index: 1; background: #0f2460; text-align: left; min-width: 220px; }
  table.pg tbody td.nome { background: #f7f9fd; font-weight: 600; color: var(--ink); border-right: 2px solid #e3e8f5; }
  table.pg td.nome .cod { color: #8a94a6; font-weight: 700; margin-right: 6px; }
  table.pg td { padding: 5px 8px; border-bottom: 1px solid var(--grade); text-align: right; color: var(--ink-2); }
  table.pg td.left { text-align: left; }
  table.pg td.cana { background: var(--cana); }
  table.pg td.evt { background: var(--evt); }
  table.pg td.tot { background: var(--tot); color: var(--ink); font-weight: 600; }
  table.pg td.fin { background: var(--fin); color: var(--ink); font-weight: 700; }
  table.pg td.neg { color: var(--neg); }
  table.pg tbody tr:hover td { filter: brightness(0.97); }
  table.pg tfoot td { padding: 9px 8px; border-top: 2px solid #1a3a7c; background: #eef1f7; font-weight: 800; color: var(--ink); text-align: right; }
  table.pg tfoot td.nome { background: #1a3a7c; color: #fff; text-align: left; }

  .estado { padding: 60px 20px; text-align: center; color: var(--ink-3); }
  .spinner { width: 34px; height: 34px; border: 3px solid #e3e8f5; border-top-color: #1a3a7c; border-radius: 50%; animation: girar .8s linear infinite; margin: 0 auto 14px; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .erro-box { background: #fdecec; border: 1.5px solid #f5c2c2; color: #b23b3b; border-radius: 10px; padding: 14px 18px; font-size: 13px; }

  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .filtros-card, .barra-acoes, .btn-voltar, .snav-sidebar, .snav-toggle, .snav-backdrop { display: none !important; }
    body { background: #fff; }
    .conteudo { max-width: none; padding: 0; }
    .header { background: #fff !important; color: #0f2460 !important; padding: 0 0 8px; border-bottom: 2px solid #0f2460; margin-bottom: 10px; }
    .header-logo { background: #0f2460 !important; }
    .header-title, .header-sub, .header-periodo, .header-emitido, .header-emitido b { color: #0f2460 !important; opacity: 1 !important; }
    .tabela-wrap { border: none; overflow: visible; }
    table.pg { font-size: 7px; width: 100%; }
    table.pg thead th { position: static; background: #e8eef7 !important; color: #0f2460 !important; border: 1px solid #cdd7ea; padding: 3px; }
    table.pg thead th.grp { background: #d6deee !important; }
    table.pg th.nome, table.pg td.nome { position: static; min-width: 0; white-space: normal; background: #f2f5fb !important; color: #0f2460 !important; font-weight: 700; border: 1px solid #cdd7ea; }
    table.pg td { padding: 2px 3px; border: 1px solid #e3e8f5; color: #1a1a2e; }
    table.pg td.cana, table.pg td.evt, table.pg td.tot, table.pg td.fin { background: #fff !important; }
    table.pg td.neg { color: #b23b3b !important; }
    table.pg tfoot td { background: #e8eef7 !important; color: #0f2460 !important; border: 1px solid #cdd7ea; }
    @page { size: landscape; margin: 6mm; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Usina Santa Clotilde S/A</div>
      <div class="header-sub">Controle de Pagamento — Fornecedor de Cana</div>
      <div class="header-periodo" id="headerPeriodo">&nbsp;</div>
    </div>
  </div>
  <div class="header-right">
    <div class="header-emitido">Emitido em<b id="headerEmitido">—</b></div>
    <button class="btn-voltar" onclick="window.location.href='hub.html'">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar
    </button>
  </div>
</div>

<div class="conteudo">

  <div class="filtros-card">
    <div class="filtros-grid">
      <div class="campo"><label>Safra</label><input type="number" id="safra" class="safra" value="76"></div>
      <div class="campo"><label>Lançamentos de</label><input type="date" id="entIni" value="2025-09-01"></div>
      <div class="campo"><label>Lançamentos até</label><input type="date" id="entFim" value="2026-03-31"></div>
      <div class="campo"><label>Pagamentos de</label><input type="date" id="pagIni" value="2025-09-01"></div>
      <div class="campo"><label>Pagamentos até</label><input type="date" id="pagFim"></div>
      <button class="btn-gerar" id="btnGerar" onclick="carregar()">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        Carregar do sistema
      </button>
    </div>
  </div>

  <div id="painel">
    <div class="tabela-wrap"><div class="estado">Defina os parâmetros e clique em <b>Carregar do sistema</b>.</div></div>
  </div>

</div>

<script src="js/xlsx.full.min.js"></script>
<script>
"use strict";

let LINHAS = [];
let ABA = "detalhado";   // aba visível: "detalhado" ou "levantamento"
let EVENTOS = [];   // metadados das colunas dinâmicas (cod, key, descricao, natureza)
let COLS = [];      // montado a cada consulta a partir de EVENTOS
let SOMAR = new Set();

const nf = (n, d = 2) => (isFinite(+n) ? +n : 0).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });

// Monta as colunas: Cód, um por evento (agrupado em Proventos/Descontos/Outros),
// e o bloco Financeiro (Cana Entregue, Pagamento Realizado, Diferença).
function montarColunas() {
  COLS = [
    { g: "", h: "ATR", k: "atr", d: 2, cls: "cana" }
  ];
  const grupoNat = n => n === "P" ? "Proventos" : n === "D" ? "Descontos" : "Outros";
  EVENTOS.forEach(ev => {
    COLS.push({ g: grupoNat(ev.natureza), h: ev.descricao, k: ev.key, d: 2, cls: "evt", money: true });
  });
  COLS.push({ g: "Financeiro", h: "Cana Entregue R$", k: "cana_entregue", d: 2, cls: "fin", money: true });
  COLS.push({ g: "Financeiro", h: "Pagamento Realizado", k: "pagamento_realizado", d: 2, cls: "fin", money: true });
  COLS.push({ g: "Financeiro", h: "Diferença (Cana − Pago)", k: "saldo", d: 2, cls: "fin", money: true });

  // ATR é média ponderada — não soma no total.
  SOMAR = new Set(COLS.filter(c => c.k !== "cod_fornecedor" && c.k !== "atr").map(c => c.k));
}

function fmtBR(s) { const [a, b, c] = s.split("-"); return c + "/" + b + "/" + a; }

async function carregar() {
  const safra = document.getElementById("safra").value || "74";
  const entIni = document.getElementById("entIni").value;
  const entFim = document.getElementById("entFim").value;
  const pagIni = document.getElementById("pagIni").value;
  const pagFim = document.getElementById("pagFim").value;
  if (!entIni || !entFim) { alert("Informe a janela de entrega."); return; }

  const painel = document.getElementById("painel");
  painel.innerHTML = '<div class="tabela-wrap"><div class="estado"><div class="spinner"></div>Consultando cana e pagamentos… (pode levar alguns segundos)</div></div>';

  try {
    let url = "api/pagamento-cana?safra=" + encodeURIComponent(safra) + "&entIni=" + entIni + "&entFim=" + entFim;
    if (pagIni) url += "&pagIni=" + pagIni;
    if (pagFim) url += "&pagFim=" + pagFim;
    const r = await fetch(url);
    const j = await r.json();
    if (!j.ok) { painel.innerHTML = '<div class="tabela-wrap"><div class="estado"><div class="erro-box">' + (j.erro || "Falha ao consultar.") + '</div></div></div>'; return; }

    LINHAS = j.fornecedores || [];
    EVENTOS = j.eventos || [];
    montarColunas();
    document.getElementById("headerPeriodo").textContent =
      "Safra " + j.safra + " · Lançamentos " + fmtBR(j.entIni) + " a " + fmtBR(j.entFim) + " · Pagamentos " + fmtBR(j.pagIni) + " a " + fmtBR(j.pagFim);
    document.getElementById("headerEmitido").textContent = new Date().toLocaleDateString("pt-BR");
    render();
  } catch (e) {
    painel.innerHTML = '<div class="tabela-wrap"><div class="estado"><div class="erro-box">Erro de conexão: ' + e.message + '</div></div></div>';
  }
}

function celClasse(c, valor) {
  let cls = c.cls || "";
  if (c.money && +valor < 0) cls += " neg";
  return cls.trim();
}

const TH_NOME = '<th class="nome grp" rowspan="2">Cód. · Fornecedor</th>';

// Monta as duas linhas de cabeçalho (grupos + colunas) para uma lista de colunas.
function cabecalhoGrupos(cols) {
  let grpRow = '<tr>' + TH_NOME;
  let subRow = '<tr>';
  for (let i = 0; i < cols.length;) {
    const g = cols[i].g;
    if (g) { let span = 0; while (i + span < cols.length && cols[i + span].g === g) span++;
      grpRow += '<th class="grp" colspan="' + span + '">' + g + '</th>';
      for (let k = 0; k < span; k++) subRow += '<th>' + cols[i + k].h + '</th>';
      i += span;
    } else { grpRow += '<th rowspan="2">' + cols[i].h + '</th>'; i++; }
  }
  return [grpRow + '</tr>', subRow + '</tr>'];
}

const celNome = l => '<td class="nome"><span class="cod">' + escapar(l.cod_fornecedor) + '</span> ' + escapar(l.nome || "") + '</td>';

function render() {
  const painel = document.getElementById("painel");
  if (!LINHAS.length) {
    painel.innerHTML = '<div class="tabela-wrap"><div class="estado">Nenhum fornecedor de cana no período.</div></div>';
    return;
  }
  painel.innerHTML =
    '<div class="barra-acoes">' +
    '  <div class="abas">' +
    '    <button class="aba' + (ABA === "detalhado" ? " ativa" : "") + '" onclick="setAba(\'detalhado\')">Detalhado</button>' +
    '    <button class="aba' + (ABA === "levantamento" ? " ativa" : "") + '" onclick="setAba(\'levantamento\')">Levantamento</button>' +
    '  </div>' +
    '  <span class="esp"></span>' +
    '  <button class="btn-acao" onclick="window.print()">🖨️ Imprimir / PDF</button>' +
    '  <button class="btn-acao destaque" onclick="exportarExcel()">⬇️ Exportar Excel</button>' +
    '</div>' +
    '<div id="tabelaArea"></div>';
  desenharTabela();
}

function setAba(a) { ABA = a; render(); }
function desenharTabela() { ABA === "levantamento" ? desenharLevantamento() : desenharDetalhado(); }

function desenharDetalhado() {
  const [grpRow, subRow] = cabecalhoGrupos(COLS);
  let corpo = "";
  LINHAS.forEach(l => {
    corpo += '<tr>' + celNome(l);
    COLS.forEach(c => {
      const v = l[c.k];
      const txt = c.cls === "left" ? escapar(v == null ? "" : v) : nf(v, c.d);
      corpo += '<td class="' + celClasse(c, v) + '">' + txt + '</td>';
    });
    corpo += '</tr>';
  });
  const tot = {};
  SOMAR.forEach(k => tot[k] = 0);
  LINHAS.forEach(l => SOMAR.forEach(k => tot[k] += (+l[k] || 0)));
  let rodape = '<tr><td class="nome">TOTAL (' + LINHAS.length + ' fornecedores)</td>';
  COLS.forEach(c => {
    if (SOMAR.has(c.k)) rodape += '<td class="' + celClasse(c, tot[c.k]) + '">' + nf(tot[c.k], c.d) + '</td>';
    else rodape += '<td class="' + (c.cls || "") + '"></td>';
  });
  rodape += '</tr>';
  document.getElementById("tabelaArea").innerHTML =
    '<div class="tabela-wrap"><table class="pg"><thead>' + grpRow + subRow + '</thead><tbody>' + corpo + '</tbody><tfoot>' + rodape + '</tfoot></table></div>';
}

// Colunas da aba Levantamento (por tonelada + totais).
const LEV = [
  { g: "", h: "Qtde t", f: v => v.t, d: 3, cls: "cana" },
  { g: "", h: "ATR kg/t", f: v => v.atr, d: 2, cls: "cana" },
  { g: "Por tonelada (R$/t)", h: "Bruto", f: v => v.brutoT, d: 2, cls: "evt" },
  { g: "Por tonelada (R$/t)", h: "CCT", f: v => v.cctT, d: 2, cls: "evt" },
  { g: "Por tonelada (R$/t)", h: "Outros desc.", f: v => v.outrosT, d: 2, cls: "evt" },
  { g: "Por tonelada (R$/t)", h: "Líquido", f: v => v.liquidoT, d: 2, cls: "evt" },
  { g: "Totais (R$)", h: "Líquido total", f: v => v.liquidoTotal, d: 2, cls: "fin", money: true },
  { g: "Totais (R$)", h: "Recebido", f: v => v.recebido, d: 2, cls: "fin", money: true },
  { g: "Totais (R$)", h: "Saldo", f: v => v.saldo, d: 2, cls: "fin", money: true }
];

function desenharLevantamento() {
  const [grpRow, subRow] = cabecalhoGrupos(LEV);
  let corpo = "";
  LINHAS.forEach(l => {
    const v = levantamentoDe(l);
    corpo += '<tr>' + celNome(l);
    LEV.forEach(c => { const val = c.f(v); corpo += '<td class="' + celClasse(c, val) + '">' + nf(val, c.d) + '</td>'; });
    corpo += '</tr>';
  });
  // Totais: t somado; valores/t recompostos sobre o total; ATR ponderado pela t.
  const T = LINHAS.reduce((s, l) => s + (+l.peso_t || 0), 0);
  let sB = 0, sC = 0, sO = 0, sL = 0, sR = 0, sS = 0, sAP = 0;
  LINHAS.forEach(l => { const v = levantamentoDe(l); sB += v.bruto; sC += v.cct; sO += v.outros; sL += v.liquidoTotal; sR += v.recebido; sS += v.saldo; sAP += v.atr * v.t; });
  const pT = x => T > 0 ? x / T : 0;
  const totV = { t: T, atr: pT(sAP), brutoT: pT(sB), cctT: pT(sC), outrosT: pT(sO), liquidoT: pT(sL), liquidoTotal: sL, recebido: sR, saldo: sS };
  let rodape = '<tr><td class="nome">TOTAL (' + LINHAS.length + ' fornecedores)</td>';
  LEV.forEach(c => { rodape += '<td class="' + celClasse(c, c.f(totV)) + '">' + nf(c.f(totV), c.d) + '</td>'; });
  rodape += '</tr>';
  document.getElementById("tabelaArea").innerHTML =
    '<div class="tabela-wrap"><table class="pg"><thead>' + grpRow + subRow + '</thead><tbody>' + corpo + '</tbody><tfoot>' + rodape + '</tfoot></table></div>';
}

function escapar(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

// Soma os valores dos eventos de uma linha que casam com o filtro (por natureza/descrição).
function somaEventos(l, filtro) {
  return EVENTOS.filter(filtro).reduce((s, ev) => s + (+l[ev.key] || 0), 0);
}
const ehCCT = ev => /CCT/i.test(ev.descricao);

// Levantamento por fornecedor: tonelada, ATR, valores por tonelada e totais.
function levantamentoDe(l) {
  const t = +l.peso_t || 0;
  const bruto = somaEventos(l, ev => ev.natureza === "P");
  const cct = somaEventos(l, ev => ev.natureza === "D" && ehCCT(ev));
  const outros = somaEventos(l, ev => ev.natureza === "D" && !ehCCT(ev));
  const liquidoTotal = +l.cana_entregue || 0;
  const porT = v => t > 0 ? v / t : 0;
  return {
    t, atr: +l.atr || 0,
    brutoT: porT(bruto), cctT: porT(cct), outrosT: porT(outros), liquidoT: porT(liquidoTotal),
    liquidoTotal, recebido: +l.pagamento_realizado || 0, saldo: +l.saldo || 0,
    bruto, cct, outros
  };
}

function exportarExcel() {
  const wb = XLSX.utils.book_new();
  const periodo = document.getElementById("headerPeriodo").textContent;

  // ── Aba 1: Detalhado (por evento) ──
  const cab1 = ["Cód.", "Fornecedor", ...COLS.map(c => c.g || "")];
  const cab2 = ["", "", ...COLS.map(c => c.h)];
  const linhasD = LINHAS.map(l => [l.cod_fornecedor, l.nome || "", ...COLS.map(c => (+l[c.k] || 0))]);
  const totD = {}; SOMAR.forEach(k => totD[k] = 0);
  LINHAS.forEach(l => SOMAR.forEach(k => totD[k] += (+l[k] || 0)));
  const linhaTotD = ["", "TOTAL", ...COLS.map(c => SOMAR.has(c.k) ? totD[c.k] : "")];
  const aoaD = [
    ["Usina Santa Clotilde S/A"],
    ["Controle de Pagamento — Fornecedor de Cana"],
    [periodo],
    [], cab1, cab2, ...linhasD, linhaTotD
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaD), "Detalhado");

  // ── Aba 2: Levantamento ──
  const cabLev = ["Cód.", "Fornecedor", "Qtde t de cana", "kg ATR médio/t",
                  "Valor Bruto R$/t", "Desconto CCT R$/t", "Outros descontos R$/t", "Valor Líquido R$/t",
                  "Valor Líquido total R$", "Valor líquido recebido R$", "Saldo restante R$"];
  const linhasLev = LINHAS.map(l => {
    const v = levantamentoDe(l);
    return [l.cod_fornecedor, l.nome || "", v.t, v.atr, v.brutoT, v.cctT, v.outrosT, v.liquidoT,
            v.liquidoTotal, v.recebido, v.saldo];
  });
  // Total: valores por tonelada recompostos sobre o total; ATR ponderado pela tonelada.
  const T = LINHAS.reduce((s, l) => s + (+l.peso_t || 0), 0);
  let sBruto = 0, sCct = 0, sOutros = 0, sLiq = 0, sReceb = 0, sSaldo = 0, sAtrPeso = 0;
  LINHAS.forEach(l => {
    const v = levantamentoDe(l);
    sBruto += v.bruto; sCct += v.cct; sOutros += v.outros; sLiq += v.liquidoTotal;
    sReceb += v.recebido; sSaldo += v.saldo; sAtrPeso += (v.atr * v.t);
  });
  const pT = x => T > 0 ? x / T : 0;
  const linhaTotLev = ["", "TOTAL", T, pT(sAtrPeso), pT(sBruto), pT(sCct), pT(sOutros), pT(sLiq),
                       sLiq, sReceb, sSaldo];
  const aoaLev = [
    ["Levantamento de F de Cana — Safra 2025/26"],
    [periodo],
    [], cabLev, ...linhasLev, linhaTotLev
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaLev), "Levantamento");

  XLSX.writeFile(wb, "Pagamento-Cana_safra" + (document.getElementById("safra").value || "") + ".xlsx");
}

// Padrão: pagamentos até hoje.
document.getElementById("pagFim").value = new Date().toISOString().slice(0, 10);

// Safra padrão da intranet (Administração → Parâmetros gerais → Safra padrão).
fetch("api/parametros", { cache: "no-store" })
  .then(r => r.json())
  .then(j => { const s = j && j.data && j.data["safra.padrao"]; if (s) document.getElementById("safra").value = s; })
  .catch(() => {});
</script>
