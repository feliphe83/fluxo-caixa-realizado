<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento de Compras — Safra — Usina Santa Clotilde</title>
<link rel="icon" href="img/logo.png">
<style>
/* ────────────────────────────────────────────────────────────────────────
   Painel de televisão do orçamento de compras por SAFRA, uma área por vez.

   Mesmo molde de orcamento-tv.html: palco 1920×1080 escalado, aceita
   clique (trocar mês/área), volta sozinho ao estado automático (a área da
   URL, ?area=agricola|industrial|administrativa|comercial — vazio ou
   ausente é a Empresa inteira) depois de 3 minutos sem ninguém mexer.

   Cada TV mostra só a SUA área: a mesma tela, um ?area= por parede.
   ──────────────────────────────────────────────────────────────────────── */
  :root {
    --orcado: #5b6675; --realizado: #2a78d6;
    --acum-prev: #0ca30c; --acum-real: #1e3a8a;
    --sobra: #0ca30c; --estouro: #d03b3b;
    --sem-vermelho: #e03127; --sem-laranja: #f0921f; --sem-amarelo: #ffe14d;
    --ink: #0f2460; --ink-2: #52514e; --ink-3: #898781; --rotulo: #64748b;
    --borda: #e3e8f5; --papel: #fff; --papel-2: #f8faff; --fundo: #f4f6fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--fundo); color: var(--ink-2);
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
               overflow: hidden; font-variant-numeric: tabular-nums; }

  #palco-wrap { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
  #palco { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
           transform-origin: center center; padding: 18px 24px 16px;
           display: grid; grid-template-rows: auto auto auto 1fr 300px; gap: 10px; }

  /* ── Topo ── */
  .topo { display: flex; align-items: center; gap: 16px; }
  .marca { width: 44px; height: 44px; border-radius: 11px; background: var(--ink);
           display: flex; align-items: center; justify-content: center; padding: 6px; flex: none; }
  .marca img { width: 100%; height: 100%; object-fit: contain; }
  .topo h1 { font-size: 27px; font-weight: 800; color: var(--ink); letter-spacing: -.5px; }
  .topo .sub { font-size: 12.5px; font-weight: 700; color: var(--ink-3);
               text-transform: uppercase; letter-spacing: .8px; margin-top: 1px; }
  .cartoes { display: flex; gap: 11px; margin-left: 22px; }
  .cartao { background: var(--papel); border: 1px solid var(--borda); border-radius: 12px;
            padding: 9px 20px; position: relative; overflow: hidden; min-width: 210px; }
  .cartao::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
                    background: var(--cor, var(--ink)); }
  .cartao .rot { font-size: 11.5px; font-weight: 800; color: var(--rotulo);
                 text-transform: uppercase; letter-spacing: .7px; }
  .cartao .cifra { font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1.1;
                   margin-top: 2px; letter-spacing: -.8px; }
  .cartao .cifra.mal { color: var(--estouro); }
  .cartao .base { font-size: 11.5px; font-weight: 700; color: var(--ink-3); margin-top: 1px; }
  .direita { margin-left: auto; text-align: right; }
  .periodo { font-size: 19px; font-weight: 800; color: var(--ink); background: var(--papel);
             border: 1px solid var(--borda); border-radius: 11px; padding: 7px 16px;
             display: inline-block; }
  .relogio { font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-top: 5px; }

  /* ── Faixa: área + tipo ── */
  .faixa { display: flex; align-items: center; gap: 14px; }
  .areas { display: flex; gap: 7px; align-items: center; background: var(--papel);
           border: 1px solid var(--borda); border-radius: 12px; padding: 6px 14px; flex: 1; }
  .areas .rot { font-size: 12px; font-weight: 800; color: var(--rotulo);
                text-transform: uppercase; letter-spacing: .8px; margin-right: 4px; }
  .areas button { font-size: 15px; font-weight: 800; color: var(--ink-2);
                  padding: 7px 20px; border-radius: 999px; border: 1px solid var(--borda);
                  background: var(--papel-2); font-family: inherit; cursor: pointer;
                  white-space: nowrap; }
  .areas button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .areas button:not(.on):hover { background: #e9eefb; color: var(--ink); }
  .tipos { flex: none; display: flex; gap: 8px; background: var(--papel); border: 1px solid var(--borda);
           border-radius: 12px; padding: 6px 10px; align-items: center; }
  .tipos button { font-size: 13.5px; font-weight: 800; color: var(--ink-2); padding: 6px 14px;
                  border-radius: 8px; border: 1.5px solid var(--borda); background: var(--papel-2);
                  font-family: inherit; cursor: pointer; }
  .tipos button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ── Tira de meses ── */
  .meses { display: flex; gap: 6px; background: var(--papel); border: 1px solid var(--borda);
           border-radius: 12px; padding: 5px; }
  .meses button { flex: 1; text-align: center; font-size: 17px; font-weight: 800;
                  color: var(--ink-3); padding: 8px 6px; border-radius: 9px;
                  border: none; background: transparent; font-family: inherit;
                  cursor: pointer; }
  .meses button.on { background: var(--realizado); color: #fff; }
  .meses button.futuro { opacity: .4; }
  .meses button:not(.on):hover { background: var(--papel-2); color: var(--ink); }

  /* Avisa que o painel está fora do automático e quando volta. */
  .manual { display: none; margin-top: 5px; background: #eda100; color: #1a1a19;
            font-size: 13px; font-weight: 800; padding: 5px 14px; border-radius: 999px; }
  .manual.on { display: inline-block; }

  /* ── Quadro ── */
  .bloco { background: var(--papel); border: 1px solid var(--borda); border-radius: 12px;
           padding: 10px 14px 12px; min-height: 0; overflow: hidden; }
  table.q { width: 100%; border-collapse: collapse; font-size: var(--fonte, 16px);
            table-layout: fixed; }
  table.q thead th { background: var(--ink); color: #fff; font-weight: 800; padding: .34em 10px;
                     white-space: nowrap; text-align: right; font-size: .84em;
                     border-right: 1px solid rgba(255,255,255,.14); }
  table.q thead th:last-child { border-right: none; }
  table.q thead th.rot { text-align: left; }
  table.q thead tr.faixat th { text-align: center; font-size: .92em; letter-spacing: .4px; }
  table.q tbody td { padding: .34em 10px; text-align: right; white-space: nowrap;
                     border-bottom: 1px solid #eef1f8; font-weight: 700; color: var(--ink); }
  table.q tbody td.rot { text-align: left; overflow: hidden; text-overflow: ellipsis; }
  table.q tfoot td { padding: .4em 10px; font-weight: 800; color: var(--ink); text-align: right;
                     border-top: 2px solid var(--borda); background: #eef2fa; }
  table.q tfoot td.rot { text-align: left; }
  table.q .divide { border-left: 2px solid var(--borda); }
  .plan { color: var(--orcado); }
  table.q td.dif.bem { color: var(--sobra); }
  table.q td.dif.mal { color: var(--estouro); }
  .pct { font-weight: 800; }
  .pct.vermelho { background: var(--sem-vermelho); color: #fff; }
  .pct.laranja  { background: var(--sem-laranja);  color: #3a2400; }
  .pct.amarelo  { background: var(--sem-amarelo);  color: #3a3400; }

  table.q tbody tr.grupo { cursor: pointer; }
  table.q tbody tr.grupo:hover td { background: var(--papel-2); }
  table.q tbody tr.grupo .seta { display: inline-block; width: .8em; color: var(--ink-3);
                                 transition: transform .15s; }
  table.q tbody tr.grupo.aberto .seta { transform: rotate(90deg); }
  table.q tbody tr.empenho td { background: var(--papel-2); color: var(--ink-2);
                                font-weight: 600; font-size: .92em; }
  table.q tbody tr.empenho td.rot { padding-left: 2.2em; }
  table.q tbody tr.empenho .cod { color: var(--ink-3); font-weight: 800; margin-right: .5em; }

  table.q td.real-drill { cursor: pointer; color: #1e3a8a; font-weight: 800;
                          text-decoration: underline dotted; text-underline-offset: 3px; }

  .graficos { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; min-height: 0; }
  .graficos .bloco { display: flex; flex-direction: column; }
  .cab { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .cab h2 { font-size: 17px; font-weight: 800; color: var(--ink); }
  .legenda { margin-left: auto; display: flex; gap: 14px; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
                  font-weight: 800; color: var(--ink-2); }
  .legenda i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .tela { position: relative; flex: 1; min-height: 0; }

  .carregando { color: var(--ink-3); font-size: 20px; font-weight: 700; padding: 40px 4px; }
  .tarja { position: fixed; top: 0; left: 0; right: 0; background: #eda100; color: #1a1a19;
           font-size: 17px; font-weight: 800; text-align: center; padding: 7px;
           display: none; z-index: 40; }
  .tarja.on { display: block; }

  /* Modal do comparativo por item — FORA do palco escalado, em pixels reais. */
  .modal-itens { position: fixed; inset: 0; z-index: 2000; display: none;
                 align-items: center; justify-content: center; padding: 30px;
                 background: rgba(15,36,96,.5); }
  .modal-itens.on { display: flex; }
  .mi-caixa { background: #fff; border-radius: 18px; width: min(1200px, 94vw); max-height: 88vh;
              display: flex; flex-direction: column; overflow: hidden;
              box-shadow: 0 30px 90px rgba(15,36,96,.5);
              font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .mi-topo { display: flex; align-items: flex-start; gap: 14px; padding: 20px 26px;
             border-bottom: 1px solid #eef1f8; flex: none; }
  .mi-titulo { font-size: 22px; font-weight: 800; color: #0f2460; }
  .mi-sub { font-size: 14px; font-weight: 700; color: #898781; margin-top: 3px; }
  .mi-fechar { margin-left: auto; border: none; background: none; font-size: 34px; line-height: 1;
               color: #94a0b8; cursor: pointer; }
  .mi-corpo { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .mi-scroll { flex: 1; min-height: 0; overflow: auto; }
  .mi-tabela { width: 100%; border-collapse: collapse; font-size: 15px; }
  .mi-tabela thead th { position: sticky; top: 0; background: #f8faff; color: #898781; font-weight: 800;
                        font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 10px 14px;
                        border-bottom: 1px solid #eef1f8; text-align: right; white-space: nowrap; z-index: 1; }
  .mi-tabela thead th:first-child { text-align: left; }
  .mi-tabela thead tr.mi-super th { text-transform: none; letter-spacing: 0; font-size: 14px;
                                     color: #1a3a7c; padding: 10px 14px 3px; border-bottom: 0; text-align: center; top: 0; }
  .mi-tabela thead tr.mi-super th:first-child { text-align: left; }
  .mi-tabela thead tr:nth-child(2) th { top: 33px; }
  .mi-tabela .sep { border-left: 1px solid #eef1f8; }
  .mi-tabela tbody td { padding: 12px 14px; border-bottom: 1px solid #eef1f8; vertical-align: top; }
  .mi-tabela tbody tr:last-child td { border-bottom: 0; }
  .mi-tabela tbody tr.link { cursor: pointer; }
  .mi-tabela tbody tr.link:hover td { background: #f8faff; }
  .mi-tabela .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mi-mat { font-size: 15px; font-weight: 700; color: #0f2460; line-height: 1.35; }
  .mi-forn { font-size: 12.5px; color: #898781; margin-top: 3px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .mi-oc { font-size: 11px; font-weight: 800; color: #1a3a7c; background: #E3EAF7; padding: 1px 8px; border-radius: 20px; white-space: nowrap; }
  .mi-unit { display: block; font-size: 12px; color: #94a0b8; margin-top: 2px; }
  .mi-dif { font-weight: 800; }
  .mi-dif.pos { color: #B3261E; } .mi-dif.neg { color: #1F4E9C; } .mi-dif.nulo { color: #94a0b8; font-weight: 400; }
  .mi-vazio { padding: 32px 26px; color: #898781; font-size: 16px; }
  .mi-voltar { flex: none; display: flex; align-items: center; gap: 14px; padding: 12px 26px;
               border-bottom: 1px solid #eef1f8; background: #f8faff; }
  .mi-voltar button { background: none; border: 1px solid #eef1f8; border-radius: 8px; padding: 7px 14px;
                       font-size: 14px; color: #1a3a7c; cursor: pointer; font-family: inherit; font-weight: 700; }
  .mi-voltar-tit { font-size: 16px; font-weight: 800; color: #0f2460; }
  .mi-transacoes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
                   background: #eef1f8; overflow: hidden; }
  .mi-coluna { display: flex; flex-direction: column; min-height: 0; background: #fff; }
  .mi-col-head { flex: none; padding: 12px 26px; background: #f8faff; border-bottom: 1px solid #eef1f8;
                 display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .mi-col-tit { font-size: 12.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #898781; flex: 1 1 100%; }
  .mi-col-val { font-size: 19px; font-weight: 800; color: #1a3a7c; }
  .mi-col-n { font-size: 12.5px; color: #94a0b8; }
  .mi-col-lista { overflow: auto; flex: 1; min-height: 0; }
  .mi-item { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 13px 26px; border-bottom: 1px solid #eef1f8; }
  .mi-item:last-child { border-bottom: 0; }
  .mi-desc { flex: 1; min-width: 0; }
  .mi-mat .mes { display: inline-block; color: #94a0b8; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; margin-right: 9px; vertical-align: middle; }
  .mi-val { font-weight: 800; color: #0f2460; white-space: nowrap; font-size: 15px; }
</style>
</head>
<body>

<div class="tarja" id="tarja"></div>

<div id="palco-wrap"><div id="palco">

  <div class="topo">
    <div class="marca"><img src="img/logo.png" alt="USC"></div>
    <div>
      <h1>Usina Santa Clotilde</h1>
      <div class="sub" id="subArea">Orçamento de Compras — Safra</div>
    </div>
    <div class="cartoes">
      <div class="cartao" style="--cor:var(--orcado)">
        <div class="rot">Planejado</div><div class="cifra" id="cPlan">—</div>
        <div class="base" id="cPlanBase"></div>
      </div>
      <div class="cartao" style="--cor:var(--realizado)">
        <div class="rot">Realizado</div><div class="cifra" id="cReal">—</div>
        <div class="base" id="cRealBase"></div>
      </div>
      <div class="cartao" style="--cor:var(--sem-laranja)">
        <div class="rot">Execução %</div><div class="cifra" id="cExec">—</div>
        <div class="base" id="cExecBase"></div>
      </div>
    </div>
    <div class="direita">
      <div class="periodo" id="periodo">—</div>
      <div class="relogio" id="relogio"></div>
      <div class="manual" id="manual"></div>
    </div>
  </div>

  <div class="faixa">
    <div class="areas" id="areas"></div>
    <div class="tipos" id="tipos"></div>
  </div>

  <div class="meses" id="meses"></div>

  <div class="bloco"><div id="quadro"><div class="carregando">Consultando o orçamento…</div></div></div>

  <div class="graficos">
    <div class="bloco">
      <div class="cab"><h2>Mês a mês</h2>
        <div class="legenda">
          <span><i style="background:#5b6675"></i>Orçado</span>
          <span><i style="background:#2a78d6"></i>Realizado</span>
        </div>
      </div>
      <div class="tela"><canvas id="gMensal"></canvas></div>
    </div>
    <div class="bloco">
      <div class="cab"><h2>Acumulado na safra</h2>
        <div class="legenda">
          <span><i style="background:#0ca30c"></i>Orçado</span>
          <span><i style="background:#1e3a8a"></i>Realizado</span>
        </div>
      </div>
      <div class="tela"><canvas id="gAcum"></canvas></div>
    </div>
  </div>

</div></div>

<div class="modal-itens" id="modalItens" onclick="if(event.target===this)fecharDetalheItens()">
  <div class="mi-caixa">
    <div class="mi-topo">
      <div>
        <div class="mi-titulo" id="miTitulo">Itens do realizado</div>
        <div class="mi-sub" id="miSub"></div>
      </div>
      <button class="mi-fechar" onclick="fecharDetalheItens()" title="Fechar (Esc)">×</button>
    </div>
    <div class="mi-corpo" id="miCorpo"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
// A contabilidade de custo fecha ao longo do mês; de dez em dez minutos a
// parede acompanha sem martelar o Oracle.
const INTERVALO_MS = 10 * 60 * 1000;

/* ?area=agricola|industrial|administrativa|comercial — vazio/ausente = Empresa
   inteira. É o estado "automático" desta parede: cada TV recebe o ?area= da
   sua própria área e volta pra ele sozinha depois de mexerem na tela. */
const AREA_SLUG_PARA_NOME = {
  agricola: 'ÁREA AGRÍCOLA', industrial: 'ÁREA INDUSTRIAL',
  administrativa: 'ÁREA ADMINISTRATIVA', comercial: 'LOGÍSTICA E COMERCIALIZAÇÃO'
};
const AREA_ROTULO = { '': 'Empresa', 'ÁREA AGRÍCOLA': 'Agrícola', 'ÁREA INDUSTRIAL': 'Industrial',
                      'ÁREA ADMINISTRATIVA': 'Administrativa', 'LOGÍSTICA E COMERCIALIZAÇÃO': 'Comercial' };
const AREA_INICIAL = AREA_SLUG_PARA_NOME[(new URLSearchParams(location.search).get('area') || '').toLowerCase()] || '';

let DADOS = [], MESES = [], PERIODO_ATUAL = null, PERIODO_ANTERIOR = null;
let AREA = AREA_INICIAL, mes = 0, tipos = { OC: true, CT: true }, ABERTOS = {};

/* ── Interação numa parede é temporária ──
   Quem clica vai embora. Sem isto, o painel ficaria preso na área/mês
   escolhido para sempre. */
const VOLTA_MS = 3 * 60 * 1000;
let MANUAL = false;
let relogioVolta = null;

function mexeu() {
  MANUAL = true;
  clearTimeout(relogioVolta);
  relogioVolta = setTimeout(voltarAoAutomatico, VOLTA_MS);
  contarVolta();
}
function voltarAoAutomatico() {
  MANUAL = false;
  AREA = AREA_INICIAL;
  tipos = { OC: true, CT: true };
  ABERTOS = {};
  clearTimeout(relogioVolta);
  document.getElementById('manual').classList.remove('on');
  mes = mesAutomatico();
  render();
}
function contarVolta() {
  const cx = document.getElementById('manual');
  const fim = Date.now() + VOLTA_MS;
  cx.classList.add('on');
  clearInterval(contarVolta.tique);
  contarVolta.tique = setInterval(() => {
    const resta = Math.max(0, Math.round((fim - Date.now()) / 1000));
    if (!MANUAL || resta === 0) { clearInterval(contarVolta.tique); return; }
    cx.textContent = 'Visualização manual · volta ao automático em '
                   + Math.floor(resta / 60) + ':' + String(resta % 60).padStart(2, '0');
  }, 1000);
  cx.textContent = 'Visualização manual · volta ao automático em 3:00';
}

/** O mês que o painel mostra sozinho: o último com movimento (orçado ou realizado). */
function mesAutomatico() {
  if (!DADOS.length) return 0;
  const comDado = new Set(DADOS.filter(d => d[4] || d[7]).map(d => d[3]));
  for (let i = 5; i >= 0; i--) if (comDado.has(i)) return i;
  return 5;
}

function trocarMes(i) { if (mes === i) return; mes = i; mexeu(); render(); }
function trocarArea(a) { if (AREA === a) return; AREA = a; ABERTOS = {}; mexeu(); render(); }
function alternarTipo(qual) {
  if (tipos[qual] && !tipos[qual === 'OC' ? 'CT' : 'OC']) return;
  tipos[qual] = !tipos[qual];
  mexeu(); render();
}
function alternarGrupo(k) { ABERTOS[k] = !ABERTOS[k]; mexeu(); render(); }

const fmt = n => Math.round(Number(n) || 0).toLocaleString('pt-BR');
const fmtDif = d => d < 0 ? '(' + fmt(Math.abs(d)) + ')' : fmt(d);
const fmtQtd = n => Number.isInteger(n) ? String(n) : n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const $ = s => document.querySelector(s);

function ajustarEscala() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('palco').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
}
window.addEventListener('resize', ajustarEscala);

async function carregar() {
  try {
    const r = await fetch('api/orcamento-safra', { headers: { 'Accept': 'application/json' } });
    if (r.status === 401) {
      const t = document.getElementById('tarja');
      t.textContent = '⚠ Sessão expirada — faça login neste navegador para o painel voltar a atualizar';
      t.classList.add('on');
      return;
    }
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Consulta recusada');
    document.getElementById('tarja').classList.remove('on');
    DADOS = j.dados || [];
    MESES = j.meses || [];
    PERIODO_ATUAL = j.periodoAtual;
    PERIODO_ANTERIOR = j.periodoAnterior;
    document.getElementById('periodo').textContent = PERIODO_ATUAL.rotulo;
    document.getElementById('relogio').textContent = 'Atualizado em ' + new Date().toLocaleTimeString('pt-BR');
    // A recarga de dez em dez minutos NÃO rouba a área/mês de quem está olhando.
    if (!MANUAL) mes = mesAutomatico();
    render();
  } catch (e) {
    if (!DADOS.length) document.getElementById('quadro').innerHTML =
      `<div class="carregando" style="color:#d03b3b">Não foi possível consultar: ${esc(e.message || e)}</div>`;
  }
}

function agregar() {
  const grupos = new Map();
  for (const [g, e, a, mi, o, rAnt, tp, rAtu, ce] of DADOS) {
    if (!tipos[tp]) continue;
    if (AREA && a !== AREA) continue;
    let grp = grupos.get(g);
    if (!grp) { grp = { chave: g, nome: g, oM: 0, rM: 0, oA: 0, rA: 0, emp: new Map() }; grupos.set(g, grp); }
    let emp = grp.emp.get(e);
    if (!emp) { emp = { chave: g + '|' + e, cod: ce, nome: e, oM: 0, rM: 0, oA: 0, rA: 0 }; grp.emp.set(e, emp); }
    if (mi === mes) { grp.oM += o; grp.rM += rAtu; emp.oM += o; emp.rM += rAtu; }
    if (mi <= mes)  { grp.oA += o; grp.rA += rAtu; emp.oA += o; emp.rA += rAtu; }
  }
  const vivo = x => x.oM || x.rM || x.oA || x.rA;
  const maior = (a, b) => Math.max(b.oA, b.rA) - Math.max(a.oA, a.rA);
  const lista = [...grupos.values()].filter(vivo).sort(maior);
  lista.forEach(g => { g.empenhos = [...g.emp.values()].filter(vivo).sort(maior); });
  return lista;
}
function serie() {
  const arr = MESES.map(m => ({ label: m.m, o: 0, r: 0 }));
  for (const [g, e, a, mi, o, rAnt, tp, rAtu] of DADOS) {
    if (!tipos[tp]) continue;
    if (AREA && a !== AREA) continue;
    arr[mi].o += o; arr[mi].r += rAtu;
  }
  let ao = 0, ar = 0;
  arr.forEach(m => { ao += m.o; ar += m.r; m.ao = ao; m.ar = ar; });
  return arr;
}

function pct(r, p) { return p ? r * 100 / p : null; }
function classePct(p) {
  if (p === null) return '';
  if (p > 100) return 'vermelho';
  if (p >= 90)  return 'laranja';
  if (p >= 85)  return 'amarelo';
  return '';
}

function render() {
  const grupos = agregar();
  const M = MESES[mes];

  document.getElementById('subArea').textContent = 'Orçamento de Compras — Safra · ' + AREA_ROTULO[AREA];

  document.getElementById('areas').innerHTML = '<span class="rot">Área</span>'
    + ['', 'ÁREA AGRÍCOLA', 'ÁREA INDUSTRIAL', 'ÁREA ADMINISTRATIVA', 'LOGÍSTICA E COMERCIALIZAÇÃO'].map(a =>
        `<button class="${AREA === a ? 'on' : ''}" onclick="trocarArea('${a}')">${esc(AREA_ROTULO[a])}</button>`
      ).join('');

  document.getElementById('tipos').innerHTML =
      `<button class="${tipos.OC ? 'on' : ''}" onclick="alternarTipo('OC')">OC</button>`
    + `<button class="${tipos.CT ? 'on' : ''}" onclick="alternarTipo('CT')">CT</button>`;

  const comDado = new Set(DADOS.filter(d => d[4] || d[7]).map(d => d[3]));
  document.getElementById('meses').innerHTML = MESES.map((m, i) =>
    `<button class="${mes === i ? 'on' : ''} ${comDado.has(i) ? '' : 'futuro'}"
             onclick="trocarMes(${i})">${esc(m.m)}</button>`).join('');

  const tp = grupos.reduce((a, g) => a + g.oM, 0), tr = grupos.reduce((a, g) => a + g.rM, 0);
  const tap = grupos.reduce((a, g) => a + g.oA, 0), tar = grupos.reduce((a, g) => a + g.rA, 0);
  const ex = pct(tr, tp), exA = pct(tar, tap);
  document.getElementById('cPlan').textContent = fmt(tp);
  document.getElementById('cPlanBase').textContent = M.l + ' · R$';
  document.getElementById('cReal').textContent = fmt(tr);
  document.getElementById('cRealBase').textContent = M.l + ' · R$';
  const cx = document.getElementById('cExec');
  cx.textContent = ex === null ? '—' : ex.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  cx.className = 'cifra' + (ex !== null && ex > 100 ? ' mal' : '');
  document.getElementById('cExecBase').textContent =
    'acumulado ' + (exA === null ? '—' : exA.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%');

  const bloco = (p, r, acaoReal) => {
    const d = p - r;
    const drill = (acaoReal && r) ? ` class="real-drill" onclick="event.stopPropagation();${acaoReal}"` : '';
    return `<td class="plan divide">${p ? fmt(p) : ''}</td>
            <td${drill}>${r ? fmt(r) : ''}</td>
            <td class="dif ${d >= 0 ? 'bem' : 'mal'}">${(p || r) ? fmtDif(d) : ''}</td>
            <td class="pct ${classePct(pct(r, p))}">${pct(r, p) === null ? '—' : pct(r, p).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</td>`;
  };

  document.getElementById('quadro').innerHTML = `
    <table class="q">
      <colgroup><col style="width:430px">${Array(8).fill('<col>').join('')}</colgroup>
      <thead>
        <tr class="faixat"><th class="rot" rowspan="2">Grupo de Empenho</th>
          <th colspan="4" class="divide">${esc(M.l)}</th>
          <th colspan="4" class="divide">Acumulado</th></tr>
        <tr><th class="divide">Plan (R$)</th><th>Real (R$)</th><th>Dif.</th><th>%</th>
            <th class="divide">Plan (R$)</th><th>Real (R$)</th><th>Dif.</th><th>%</th></tr>
      </thead>
      <tbody>${grupos.map(g => {
        const aberto = ABERTOS[g.chave];
        return `<tr class="grupo ${aberto ? 'aberto' : ''}"
                    onclick="alternarGrupo('${esc(g.chave).replace(/'/g, "\\'")}')">
          <td class="rot"><span class="seta">▶</span> ${esc(g.nome)}</td>
          ${bloco(g.oM, g.rM)}${bloco(g.oA, g.rA)}
        </tr>` + (aberto ? g.empenhos.map(e => {
          const acao = e.cod ? acaoDetalhe(e.cod, e.nome) : null;
          return `<tr class="empenho">
            <td class="rot"><span class="cod">${esc(e.cod)}</span>${esc(e.nome)}</td>
            ${bloco(e.oM, e.rM, acao)}${bloco(e.oA, e.rA, acao)}
          </tr>`;
        }).join('') : '');
      }).join('')}</tbody>
      <tfoot><tr><td class="rot">Total</td>${bloco(tp, tr)}${bloco(tap, tar)}</tr></tfoot>
    </table>`;

  encaixar();
  graficoMensal();
  graficoAcumulado();
}

function encaixar() {
  const caixa = document.querySelector('#quadro').parentElement;
  const tabela = caixa.querySelector('table');
  if (!tabela) return;
  const disponivel = caixa.clientHeight - 24;
  let fonte = 16;
  for (let passada = 0; passada < 3; passada++) {
    document.documentElement.style.setProperty('--fonte', fonte.toFixed(2) + 'px');
    const ocupado = tabela.offsetHeight;
    if (!ocupado) return;
    fonte = Math.max(8, Math.min(26, fonte * (disponivel * 0.99) / ocupado));
  }
  document.documentElement.style.setProperty('--fonte', fonte.toFixed(2) + 'px');
}

// ── Comparativo por item (material/fornecedor), safra atual x anterior ──
// Reaproveita o mesmo endpoint do BI de Compras (api/orcamento-compras/itens)
// e a mesma lógica de orcamento-safra.html — escopo só do mês selecionado.
const ITENS_DETALHE = {};

function anomesDoMes(ini, indice) {
  let ano = Math.floor(ini / 100), m = (ini % 100) + indice;
  while (m > 12) { m -= 12; ano++; }
  return ano * 100 + m;
}
async function buscarItens(codEmpenho, anomes) {
  const url = 'api/orcamento-compras/itens?meses=' + encodeURIComponent(anomes)
            + '&empenho=' + encodeURIComponent(codEmpenho);
  const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Falha ao detalhar');
  return { lista: j.itens || [], soma: j.soma || 0 };
}
function acaoDetalhe(codEmpenho, nomeEmpenho) {
  const a = s => esc(String(s == null ? '' : s)).replace(/'/g, "\\'");
  return `abrirDetalheItens('${a(codEmpenho)}','${a(nomeEmpenho)}')`;
}
async function abrirDetalheItens(codEmpenho, tituloEmpenho) {
  const modal = $('#modalItens');
  const M = MESES[mes];
  $('#miTitulo').textContent = tituloEmpenho;
  $('#miSub').textContent = `Comparativo por item — ${M.l}: ${PERIODO_ATUAL.rotulo} x ${PERIODO_ANTERIOR.rotulo}`;
  modal.classList.add('on');
  mexeu();

  const ck = codEmpenho + '|' + mes;
  if (!ITENS_DETALHE[ck]) {
    ITENS_DETALHE[ck] = { carregando: true };
    pintarDetalheItens(ck);
    try {
      const [atual, anterior] = await Promise.all([
        buscarItens(codEmpenho, anomesDoMes(PERIODO_ATUAL.ini, mes)),
        buscarItens(codEmpenho, anomesDoMes(PERIODO_ANTERIOR.ini, mes)).catch(() => ({ lista: [], soma: 0 }))
      ]);
      ITENS_DETALHE[ck] = { atual, anterior };
    } catch (e) {
      ITENS_DETALHE[ck] = { erro: e.message || String(e) };
    }
  }
  pintarDetalheItens(ck);
}
function pintarDetalheItens(ck) {
  const it = ITENS_DETALHE[ck];
  const corpo = $('#miCorpo');
  if (!it || it.carregando) { corpo.innerHTML = '<div class="mi-vazio">Carregando itens…</div>'; return; }
  if (it.erro) { corpo.innerHTML = `<div class="mi-vazio" style="color:#d03b3b">${esc(it.erro)}</div>`; return; }
  if (it.vendo) { pintarTransacoesItem(ck, it); return; }
  const linhas = montarComparativo(it.atual.lista, it.anterior.lista);
  if (!linhas.length) { corpo.innerHTML = '<div class="mi-vazio">Sem itens detalhados no período.</div>'; return; }
  corpo.innerHTML = `<div class="mi-scroll"><table class="mi-tabela">
    <thead>
      <tr class="mi-super"><th></th><th colspan="2" class="sep">${esc(PERIODO_ATUAL.rotulo)}</th><th colspan="2" class="sep">${esc(PERIODO_ANTERIOR.rotulo)}</th><th class="sep"></th></tr>
      <tr><th>Material / Contrato</th><th class="sep">Valor</th><th>Preço un.</th><th class="sep">Valor</th><th>Preço un.</th><th class="sep">Dif. preço un.</th></tr>
    </thead>
    <tbody>${linhas.map(l => linhaComparativoHtml(ck, l)).join('')}</tbody>
  </table></div>`;
}
function fecharDetalheItens() { $('#modalItens').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharDetalheItens(); });

function chaveItem(x) {
  if (x.origem === 'contrato' && x.contrato) return 'c:' + x.contrato;
  if (x.material || x.fornecedor) return 'm:' + (x.codMaterial || x.material || '?');
  return 's:semdetalhe';
}
function agruparPorItem(lista) {
  const map = new Map();
  for (const x of lista) {
    const chave = chaveItem(x);
    let rotulo, contrato = false;
    if (x.origem === 'contrato' && x.contrato) { rotulo = '📄 Contrato ' + esc(x.contrato); contrato = true; }
    else if (x.material || x.fornecedor) { rotulo = x.material || '(material sem descrição)'; }
    else { rotulo = 'Sem detalhe de compra'; }
    if (!map.has(chave)) map.set(chave, { rotulo, contrato, fornecedor: '', valor: 0, qtde: 0 });
    const g = map.get(chave);
    g.valor += x.valor || 0;
    if (x.quantidade) g.qtde += x.quantidade;
    if (!g.fornecedor && x.fornecedor) g.fornecedor = x.fornecedor;
  }
  return map;
}
function montarComparativo(listaAtual, listaAnterior) {
  const ma = agruparPorItem(listaAtual), mb = agruparPorItem(listaAnterior);
  const chaves = new Set([...ma.keys(), ...mb.keys()]);
  const linhas = [];
  for (const k of chaves) {
    const a = ma.get(k), b = mb.get(k), base = a || b;
    linhas.push({
      chave: k, rotulo: base.rotulo, contrato: base.contrato,
      fornecedor: (a && a.fornecedor) || (b && b.fornecedor) || '',
      valorA: a ? a.valor : 0, qtdeA: a && a.qtde ? a.qtde : 0,
      valorB: b ? b.valor : 0, qtdeB: b && b.qtde ? b.qtde : 0
    });
  }
  return linhas.sort((x, y) => Math.max(y.valorA, y.valorB) - Math.max(x.valorA, x.valorB));
}
function linhaComparativoHtml(ck, l) {
  const puA = l.qtdeA ? l.valorA / l.qtdeA : null, puB = l.qtdeB ? l.valorB / l.qtdeB : null;
  const dif = puA !== null && puB !== null ? (puA / puB - 1) * 100 : null;
  const difCls = dif === null ? 'nulo' : Math.abs(dif) < 0.5 ? 'nulo' : dif > 0 ? 'pos' : 'neg';
  const difTxt = dif === null ? '—' : (dif > 0 ? '+' : '') + dif.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
  return `<tr class="link" onclick="abrirTransacoesItem('${esc(ck)}','${l.chave.replace(/'/g, "\\'")}')">
    <td><div class="mi-mat">${l.contrato ? l.rotulo : esc(l.rotulo)}</div>${l.fornecedor ? `<div class="mi-forn">${esc(l.fornecedor)}</div>` : ''}</td>
    <td class="num sep">${l.valorA ? fmt(l.valorA) : '—'}</td>
    <td class="num">${puA !== null ? fmt(puA) + `<span class="mi-unit">${fmtQtd(l.qtdeA)} un</span>` : '—'}</td>
    <td class="num sep">${l.valorB ? fmt(l.valorB) : '—'}</td>
    <td class="num">${puB !== null ? fmt(puB) + `<span class="mi-unit">${fmtQtd(l.qtdeB)} un</span>` : '—'}</td>
    <td class="num sep mi-dif ${difCls}">${difTxt}</td>
  </tr>`;
}
function abrirTransacoesItem(ck, chave) { ITENS_DETALHE[ck].vendo = chave; pintarDetalheItens(ck); }
function voltarComparativo(ck) { ITENS_DETALHE[ck].vendo = null; pintarDetalheItens(ck); }
function pintarTransacoesItem(ck, it) {
  const chave = it.vendo;
  const itensA = it.atual.lista.filter(x => chaveItem(x) === chave);
  const itensB = it.anterior.lista.filter(x => chaveItem(x) === chave);
  const base = itensA[0] || itensB[0];
  const titulo = !base ? '' : base.origem === 'contrato' ? '📄 Contrato ' + esc(base.contrato) : esc(base.material || '(material sem descrição)');
  $('#miCorpo').innerHTML = `
    <div class="mi-voltar"><button onclick="voltarComparativo('${esc(ck)}')">‹ Voltar ao comparativo</button><span class="mi-voltar-tit">${titulo}</span></div>
    <div class="mi-transacoes">
      ${colunaTransacoes(PERIODO_ATUAL.rotulo, itensA)}
      ${colunaTransacoes(PERIODO_ANTERIOR.rotulo, itensB)}
    </div>`;
}
function colunaTransacoes(titulo, itens) {
  const soma = itens.reduce((s, x) => s + (x.valor || 0), 0);
  const ordenados = itens.slice().sort((a, b) => (a.anomes || 0) - (b.anomes || 0));
  const lista = ordenados.length ? ordenados.map(x => `<div class="mi-item">
      <div class="mi-desc">
        <div class="mi-mat">${x.anomes ? `<span class="mes">${esc(rotuloAnomes(x.anomes))}</span>` : ''}${x.nroc ? `<span class="mi-oc">OC ${esc(x.nroc)}</span>` : ''}</div>
        ${x.quantidade ? `<div class="mi-forn">${fmtQtd(x.quantidade)} un · ${fmt(x.valorUnitario || 0)}/un</div>` : ''}
      </div>
      <div class="mi-val">${x.valor ? fmt(x.valor) : ''}</div>
    </div>`).join('') : '<div class="mi-vazio">Sem itens neste período.</div>';
  return `<div class="mi-coluna">
    <div class="mi-col-head"><span class="mi-col-tit">${esc(titulo)}</span><span class="mi-col-val">${fmt(soma)}</span><span class="mi-col-n">${itens.length} item(ns)</span></div>
    <div class="mi-col-lista">${lista}</div>
  </div>`;
}
function rotuloAnomes(anomes) {
  const ABREV = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const ano = Math.floor(anomes / 100), m = anomes % 100;
  return ABREV[m - 1] + '/' + String(ano % 100).padStart(2, '0');
}

// ── Gráficos ────────────────────────────────────────────────────────────
const graficos = {};
function linha(id, dados, series, doZero) {
  const canvas = document.getElementById(id);
  if (graficos[id]) graficos[id].destroy();
  graficos[id] = new Chart(canvas, {
    type: 'line',
    data: { labels: dados.map(m => m.label), datasets: series },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 26, right: 16, left: 10, bottom: 4 } },
      scales: {
        x: { grid: { display: false }, border: { color: '#e3e8f5' },
             ticks: { color: '#52514e', font: { size: 14, weight: '800' } } },
        y: { ticks: { color: '#898781', font: { size: 12, weight: '700' }, maxTicksLimit: 5,
                      callback: v => v === 0 ? '0' : (v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' mi' },
             grid: { color: '#e9edf6' }, border: { display: false },
             beginAtZero: doZero, grace: doZero ? 0 : '18%' }
      },
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    },
    plugins: [{
      id: 'rotulos',
      afterDatasetsDraw(chart) {
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '800 13px system-ui, sans-serif';
        chart.data.datasets.forEach((ds, di) => {
          ctx.fillStyle = ds.borderColor;
          const outro = chart.getDatasetMeta(1 - di).data;
          const ultimo = ds.data.length - 1;
          chart.getDatasetMeta(di).data.forEach((p, i) => {
            const v = ds.data[i];
            if (!v) return;
            const acima = !outro[i] || p.y <= outro[i].y;
            ctx.textBaseline = acima ? 'bottom' : 'top';
            ctx.textAlign = i === 0 ? 'left' : (i === ultimo ? 'right' : 'center');
            const dx = i === 0 ? 5 : (i === ultimo ? -5 : 0);
            ctx.fillText((v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' mi', p.x + dx, p.y + (acima ? -9 : 9));
          });
        });
        ctx.restore();
      }
    }]
  });
}
const estilo = (label, cor, dados) => ({
  label, data: dados, borderColor: cor, backgroundColor: 'transparent',
  borderWidth: 3, pointRadius: 5, pointBackgroundColor: cor,
  pointBorderColor: '#fff', pointBorderWidth: 2, tension: .3, spanGaps: false
});
const zeroNulo = v => (Number(v) || 0) === 0 ? null : Number(v);
function graficoMensal() {
  const s = serie();
  linha('gMensal', s, [ estilo('Orçado', '#5b6675', s.map(m => zeroNulo(m.o))),
                        estilo('Realizado', '#2a78d6', s.map(m => zeroNulo(m.r))) ], false);
}
function graficoAcumulado() {
  const s = serie();
  linha('gAcum', s, [ estilo('Orçado', '#0ca30c', s.map(m => zeroNulo(m.ao))),
                      estilo('Realizado', '#1e3a8a', s.map(m => zeroNulo(m.ar))) ], true);
}

ajustarEscala();
carregar();
setInterval(carregar, INTERVALO_MS);
</script>
