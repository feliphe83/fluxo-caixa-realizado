<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento de Compras — Usina Santa Clotilde</title>
<link rel="icon" href="img/logo.png">
<style>
/* ────────────────────────────────────────────────────────────────────────
   Painel de televisão do orçamento de compras.

   Palco de 1920×1080 fixos, ESCALADO para caber na tela em vez de se
   reorganizar. Numa TV ninguém corrige layout quebrado.

   SOZINHO ele mostra o último mês com movimento e os grupos fechados — é o
   que se quer ver de longe: quem estourou.

   MAS ACEITA CLIQUE, porque muita TV fica ao alcance da mão: dá para trocar
   de mês, filtrar por negócio e abrir um grupo nos empenhos.

   E VOLTA SOZINHO. Toda interação numa parede é temporária: quem clicou vai
   embora e o painel ficaria presos naquele mês para sempre, mostrando abril
   em agosto para todo mundo que passasse. Passados três minutos sem
   ninguém mexer, ele retorna ao estado automático.
   ──────────────────────────────────────────────────────────────────────── */
  :root {
    --orcado: #5b6675; --realizado: #2a78d6;
    --acum-prev: #0ca30c; --acum-real: #1e3a8a;
    --sobra: #0ca30c; --estouro: #d03b3b;
    --sem-vermelho: #e03127; --sem-laranja: #f0921f; --sem-amarelo: #ffe14d;
    --ink: #0f2460; --ink-2: #52514e; --ink-3: #898781; --rotulo: #64748b;
    --borda: #e3e8f5; --papel: #fff; --papel-2: #f8faff; --fundo: #f4f6fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--fundo); color: var(--ink-2);
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
               overflow: hidden; font-variant-numeric: tabular-nums; }

  #palco-wrap { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
  #palco { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
           transform-origin: center center; padding: 18px 24px 16px;
           display: grid; grid-template-rows: auto auto auto 1fr 300px; gap: 10px; }

  /* ── Topo ── */
  .topo { display: flex; align-items: center; gap: 16px; }
  .marca { width: 44px; height: 44px; border-radius: 11px; background: var(--ink);
           display: flex; align-items: center; justify-content: center; padding: 6px; flex: none; }
  .marca img { width: 100%; height: 100%; object-fit: contain; }
  .topo h1 { font-size: 27px; font-weight: 800; color: var(--ink); letter-spacing: -.5px; }
  .topo .sub { font-size: 12.5px; font-weight: 700; color: var(--ink-3);
               text-transform: uppercase; letter-spacing: .8px; margin-top: 1px; }
  .cartoes { display: flex; gap: 11px; margin-left: 22px; }
  .cartao-tipo { display: flex; flex-direction: column; justify-content: center; gap: 5px; min-width: 168px; }
  .cartao-tipo .rot { margin-bottom: 2px; }
  .mini-tog { font-size: 13.5px; font-weight: 800; color: var(--ink-2); padding: 5px 12px;
              border-radius: 8px; border: 1.5px solid var(--borda); background: var(--papel-2);
              font-family: inherit; cursor: pointer; text-align: left; }
  .mini-tog.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .cartao { background: var(--papel); border: 1px solid var(--borda); border-radius: 12px;
            padding: 9px 20px; position: relative; overflow: hidden; min-width: 210px; }
  .cartao::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
                    background: var(--cor, var(--ink)); }
  .cartao .rot { font-size: 11.5px; font-weight: 800; color: var(--rotulo);
                 text-transform: uppercase; letter-spacing: .7px; }
  .cartao .cifra { font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1.1;
                   margin-top: 2px; letter-spacing: -.8px; }
  .cartao .cifra.mal { color: var(--estouro); }
  .cartao .base { font-size: 11.5px; font-weight: 700; color: var(--ink-3); margin-top: 1px; }
  .direita { margin-left: auto; text-align: right; }
  .periodo { font-size: 19px; font-weight: 800; color: var(--ink); background: var(--papel);
             border: 1px solid var(--borda); border-radius: 11px; padding: 7px 16px;
             display: inline-block; }
  .relogio { font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-top: 5px; }

  /* ── Tira de meses ── */
  .meses { display: flex; gap: 6px; background: var(--papel); border: 1px solid var(--borda);
           border-radius: 12px; padding: 5px; }
  .meses button { flex: 1; text-align: center; font-size: 17px; font-weight: 800;
                  color: var(--ink-3); padding: 8px 6px; border-radius: 9px;
                  border: none; background: transparent; font-family: inherit;
                  cursor: pointer; }
  .meses button.on { background: var(--realizado); color: #fff; }
  .meses button.futuro { opacity: .4; }
  .meses button:not(.on):hover { background: var(--papel-2); color: var(--ink); }

  /* O negócio é filtro, não navegação: tira mais baixa e em pílula, para
     não competir com a dos meses, que é a escolha principal. */
  .negocios { display: flex; gap: 7px; align-items: center; background: var(--papel);
              border: 1px solid var(--borda); border-radius: 12px; padding: 6px 14px; }
  .negocios .rot { font-size: 12px; font-weight: 800; color: var(--rotulo);
                   text-transform: uppercase; letter-spacing: .8px; margin-right: 4px; }
  .negocios button { font-size: 14.5px; font-weight: 800; color: var(--ink-2);
                     padding: 6px 18px; border-radius: 999px; border: 1px solid var(--borda);
                     background: var(--papel-2); font-family: inherit; cursor: pointer;
                     white-space: nowrap; }
  .negocios button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .negocios .dica { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-3); }
  .negocios button:not(.on):hover { background: #e9eefb; color: var(--ink); }

  /* Linha de grupo clicável, como na tela de computador. */
  table.q tbody tr.grupo { cursor: pointer; }
  table.q tbody tr.grupo:hover td { background: var(--papel-2); }
  table.q tbody tr.grupo .seta { display: inline-block; width: .8em; color: var(--ink-3);
                                 transition: transform .15s; }
  table.q tbody tr.grupo.aberto .seta { transform: rotate(90deg); }
  table.q tbody tr.empenho td { background: var(--papel-2); color: var(--ink-2);
                                font-weight: 600; font-size: .92em; }
  table.q tbody tr.empenho td.rot { padding-left: 2.2em; }
  table.q tbody tr.empenho .cod { color: var(--ink-3); font-weight: 800; margin-right: .5em; }
  table.q tbody tr.empenho.expansivel { cursor: pointer; }
  table.q tbody tr.empenho .seta { display: inline-block; width: .8em; color: var(--ink-3);
                                   transition: transform .15s; }
  table.q tbody tr.empenho.aberto .seta { transform: rotate(90deg); }
  /* Espaço da seta mesmo sem seta: coluna de texto que dança conforme a
     linha abre ou não é ruído. */
  table.q tbody tr.empenho .semseta { display: inline-block; width: .8em; }

  /* Terceiro nível: objeto de custo, mais recuado e mais claro. */
  table.q tbody tr.objeto td { background: #eef2fa; color: var(--ink-2);
                               font-weight: 600; font-size: .88em; }
  table.q tbody tr.objeto td.rot { padding-left: 3.6em; }
  table.q tbody tr.objeto .cod { color: var(--ink-3); font-weight: 800; margin-right: .5em; }

  /* Avisa que o painel está fora do automático e quando volta.
     Fica no topo, junto do período: flutuando no rodapé ele cobria o rótulo
     do eixo do gráfico — tapar dado para avisar sobre o painel é troca ruim. */
  .manual { display: none; margin-top: 5px; background: #eda100; color: #1a1a19;
            font-size: 13px; font-weight: 800; padding: 5px 14px; border-radius: 999px; }
  .manual.on { display: inline-block; }

  /* ── Quadro ── */
  .bloco { background: var(--papel); border: 1px solid var(--borda); border-radius: 12px;
           padding: 10px 14px 12px; min-height: 0; overflow: hidden; }
  table.q { width: 100%; border-collapse: collapse; font-size: var(--fonte, 16px);
            table-layout: fixed; }
  table.q thead th { background: var(--ink); color: #fff; font-weight: 800; padding: .34em 10px;
                     white-space: nowrap; text-align: right; font-size: .84em;
                     border-right: 1px solid rgba(255,255,255,.14); }
  table.q thead th:last-child { border-right: none; }
  table.q thead th.rot { text-align: left; }
  table.q thead tr.faixa th { text-align: center; font-size: .92em; letter-spacing: .4px; }
  table.q tbody td { padding: .34em 10px; text-align: right; white-space: nowrap;
                     border-bottom: 1px solid #eef1f8; font-weight: 700; color: var(--ink); }
  table.q tbody td.rot { text-align: left; overflow: hidden; text-overflow: ellipsis; }
  table.q tfoot td { padding: .4em 10px; font-weight: 800; color: var(--ink); text-align: right;
                     border-top: 2px solid var(--borda); background: #eef2fa; }
  table.q tfoot td.rot { text-align: left; }
  table.q .divide { border-left: 2px solid var(--borda); }
  .plan { color: var(--orcado); }
  /* Qualificado com a tabela porque "table.q tr.grupo td" tem mais
     elementos e vencia por especificidade — a diferença da linha de grupo
     saía na cor da tinta, e é justamente nela que se vê o estouro. */
  table.q td.dif.bem { color: var(--sobra); }
  table.q td.dif.mal { color: var(--estouro); }
  .pct { font-weight: 800; }
  .pct.vermelho { background: var(--sem-vermelho); color: #fff; }
  .pct.laranja  { background: var(--sem-laranja);  color: #3a2400; }
  .pct.amarelo  { background: var(--sem-amarelo);  color: #3a3400; }

  .graficos { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; min-height: 0; }
  .graficos .bloco { display: flex; flex-direction: column; }
  .cab { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .cab h2 { font-size: 17px; font-weight: 800; color: var(--ink); }
  .legenda { margin-left: auto; display: flex; gap: 14px; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
                  font-weight: 800; color: var(--ink-2); }
  .legenda i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .tela { position: relative; flex: 1; min-height: 0; }

  .carregando { color: var(--ink-3); font-size: 20px; font-weight: 700; padding: 40px 4px; }
  .tarja { position: fixed; top: 0; left: 0; right: 0; background: #eda100; color: #1a1a19;
           font-size: 17px; font-weight: 800; text-align: center; padding: 7px;
           display: none; z-index: 40; }
  .tarja.on { display: block; }

  /* O valor realizado do objeto é clicável: salta os itens num modal. */
  table.q td.real-drill { cursor: pointer; color: #1e3a8a; font-weight: 800;
                          text-decoration: underline dotted; text-underline-offset: 3px; }

  /* Modal dos itens — FORA do palco escalado, em pixels reais, legível de
     qualquer distância. */
  .modal-itens { position: fixed; inset: 0; z-index: 2000; display: none;
                 align-items: center; justify-content: center; padding: 40px;
                 background: rgba(15,36,96,.5); }
  .modal-itens.on { display: flex; }
  .mi-caixa { background: #fff; border-radius: 18px; width: min(900px, 90vw); max-height: 82vh;
              display: flex; flex-direction: column; overflow: hidden;
              box-shadow: 0 30px 90px rgba(15,36,96,.5);
              font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .mi-topo { display: flex; align-items: flex-start; gap: 14px; padding: 20px 26px;
             border-bottom: 1px solid #eef1f8; }
  .mi-titulo { font-size: 22px; font-weight: 800; color: #0f2460; }
  .mi-sub { font-size: 14px; font-weight: 700; color: #898781; margin-top: 3px; }
  .mi-fechar { margin-left: auto; border: none; background: none; font-size: 34px; line-height: 1;
               color: #94a0b8; cursor: pointer; }
  .mi-corpo { overflow: auto; }
  .mi-item { display: flex; gap: 18px; align-items: baseline; padding: 14px 26px;
             border-bottom: 1px solid #f2f5fb; }
  .mi-desc { flex: 1; min-width: 0; font-size: 17px; color: #0f2460; line-height: 1.35; }
  .mi-desc .forn { color: #898781; font-weight: 700; }
  .mi-desc .refs { color: #2a78d6; font-weight: 700; }
  .mi-desc .semdet { color: #898781; font-style: italic; }
  .mi-val { font-size: 18px; font-weight: 800; color: #0f2460; white-space: nowrap; }
  .mi-vazio { padding: 32px 26px; color: #898781; font-size: 16px; }
  .mi-rodape { display: flex; justify-content: space-between; padding: 16px 26px;
               border-top: 1px solid #eef1f8; font-size: 15px; color: #52514e; }
</style>
</head>
<body>

<div class="tarja" id="tarja"></div>

<div id="palco-wrap"><div id="palco">

  <div class="topo">
    <div class="marca"><img src="img/logo.png" alt="USC"></div>
    <div>
      <h1>Usina Santa Clotilde</h1>
      <div class="sub">Orçamento de Compras · planejado × realizado</div>
    </div>
    <div class="cartoes">
      <div class="cartao" style="--cor:var(--orcado)">
        <div class="rot">Planejado</div><div class="cifra" id="cPlan">—</div>
        <div class="base" id="cPlanBase"></div>
      </div>
      <div class="cartao" style="--cor:var(--realizado)">
        <div class="rot">Realizado</div><div class="cifra" id="cReal">—</div>
        <div class="base" id="cRealBase"></div>
      </div>
      <div class="cartao" style="--cor:var(--sem-laranja)">
        <div class="rot">Execução %</div><div class="cifra" id="cExec">—</div>
        <div class="base" id="cExecBase"></div>
      </div>
      <div class="cartao cartao-tipo" id="tipos"></div>
    </div>
    <div class="direita">
      <div class="periodo" id="periodo">—</div>
      <div class="relogio" id="relogio"></div>
      <div class="manual" id="manual"></div>
    </div>
  </div>

  <div class="meses" id="meses"></div>
  <div class="negocios" id="negocios" style="display:none"></div>

  <div class="bloco"><div id="quadro"><div class="carregando">Consultando o orçamento…</div></div></div>

  <div class="graficos">
    <div class="bloco">
      <div class="cab"><h2>Mês a mês</h2>
        <div class="legenda">
          <span><i style="background:#5b6675"></i>Previsto</span>
          <span><i style="background:#2a78d6"></i>Realizado</span>
        </div>
      </div>
      <div class="tela"><canvas id="gMensal"></canvas></div>
    </div>
    <div class="bloco">
      <div class="cab"><h2>Acumulado no período</h2>
        <div class="legenda">
          <span><i style="background:#0ca30c"></i>Previsto</span>
          <span><i style="background:#1e3a8a"></i>Realizado</span>
        </div>
      </div>
      <div class="tela"><canvas id="gAcum"></canvas></div>
    </div>
  </div>

</div></div>

<div class="modal-itens" id="modalItens" onclick="if(event.target===this)fecharItens()">
  <div class="mi-caixa">
    <div class="mi-topo">
      <div>
        <div class="mi-titulo" id="miTitulo">Itens do realizado</div>
        <div class="mi-sub" id="miSub"></div>
      </div>
      <button class="mi-fechar" onclick="fecharItens()" title="Fechar (Esc)">×</button>
    </div>
    <div class="mi-corpo" id="miCorpo"></div>
    <div class="mi-rodape" id="miRodape"></div>
  </div>
</div>

<script src="js/chart.umd.min.js"></script>
<script>
const COR_ORCADO='#5b6675', COR_REALIZADO='#2a78d6', COR_ACUM_PREV='#0ca30c', COR_ACUM_REAL='#1e3a8a';
// A contabilidade de custo fecha ao longo do mês; de dez em dez minutos a
// parede acompanha sem martelar o Oracle.
const INTERVALO_MS = 10 * 60 * 1000;
let DADOS = null;
/* Os meses marcados. Ctrl+clique (ou ⌘ no Mac) soma vários; clique simples
   troca para um só. Nunca fica vazio. */
let SEL = new Set();
const graficos = {};

/* ── Interação numa parede é temporária ──
   Quem clica vai embora. Sem isto, o painel ficaria preso no mês escolhido
   para sempre — mostrando abril em agosto para todo mundo que passasse. */
const VOLTA_MS = 3 * 60 * 1000;
let MANUAL = false;          // alguém mexeu?
let ABERTOS = {};            // grupos abertos
let NEGOCIO = '';            // '' = todos
let TIPO_COMPRA = true, TIPO_INVEST = true;   // os dois ligados por padrão
let relogioVolta = null;     // conta o tempo até voltar ao automático

function mexeu() {
  MANUAL = true;
  clearTimeout(relogioVolta);
  relogioVolta = setTimeout(voltarAoAutomatico, VOLTA_MS);
  contarVolta();
}

function voltarAoAutomatico() {
  MANUAL = false;
  ABERTOS = {};
  NEGOCIO = '';
  TIPO_COMPRA = true; TIPO_INVEST = true;
  clearTimeout(relogioVolta);
  document.getElementById('manual').classList.remove('on');
  SEL = new Set([ mesAutomatico() ]);
  desenhar();
}

/** A contagem regressiva à vista: quem está olhando entende que o painel
 *  vai voltar sozinho, em vez de achar que travou. */
function contarVolta() {
  const cx = document.getElementById('manual');
  const fim = Date.now() + VOLTA_MS;
  cx.classList.add('on');
  clearInterval(contarVolta.tique);
  contarVolta.tique = setInterval(() => {
    const resta = Math.max(0, Math.round((fim - Date.now()) / 1000));
    if (!MANUAL || resta === 0) { clearInterval(contarVolta.tique); return; }
    cx.textContent = 'Visualização manual · volta ao automático em '
                   + Math.floor(resta / 60) + ':' + String(resta % 60).padStart(2, '0');
  }, 1000);
  cx.textContent = 'Visualização manual · volta ao automático em 3:00';
}

/** O mês que o painel mostra sozinho: o último com movimento. */
function mesAutomatico() {
  if (!DADOS) return null;
  const comDado = new Set(DADOS.linhas.map(l => l.anomes));
  const ultimo = DADOS.meses.filter(m => comDado.has(m.anomes)).pop();
  return ultimo ? ultimo.anomes : DADOS.meses[DADOS.meses.length - 1].anomes;
}

function trocarMes(anomes, ev) {
  const somando = ev && (ev.ctrlKey || ev.metaKey);   // ⌘ no Mac
  if (!somando) {
    if (SEL.size === 1 && SEL.has(anomes)) return;
    SEL = new Set([anomes]);
  } else if (SEL.has(anomes)) {
    // Desmarcar o último deixaria o quadro sem nada para somar.
    if (SEL.size === 1) return;
    SEL.delete(anomes);
  } else {
    SEL.add(anomes);
  }
  mexeu();
  desenhar();
}

/** Até onde o acumulado vai: o ÚLTIMO mês marcado. */
function mesLimite() { return Math.max(...SEL); }

/**
 * O nome do primeiro bloco. Com vários meses precisa dizer QUAIS, senão a
 * coluna vira um número sem procedência — "Agosto" com março somado dentro
 * é pior do que não ter a soma.
 */
function rotuloSelecao() {
  if (SEL.size === DADOS.meses.length) return 'Período inteiro';
  const nomes = DADOS.meses.filter(m => SEL.has(m.anomes)).map(m => m.nome);
  if (nomes.length === 1) return nomes[0];
  if (nomes.length <= 3) return nomes.join(' + ');
  return nomes.length + ' meses';
}

function alternarGrupo(k) {
  ABERTOS[k] = !ABERTOS[k];
  mexeu();
  desenhar();
}

function trocarNegocio(n) {
  if (n === NEGOCIO) return;
  NEGOCIO = n;
  // Grupo aberto de um negócio não faz sentido depois de trocar de negócio:
  // fecha tudo, senão sobra uma linha expandida sem nada por dentro.
  ABERTOS = {};
  mexeu();
  desenhar();
}

function alternarTipo(qual) {
  if (qual === 'Compra') {
    if (TIPO_COMPRA && !TIPO_INVEST) return;   // não deixa ficar sem nenhum ligado
    TIPO_COMPRA = !TIPO_COMPRA;
  } else {
    if (TIPO_INVEST && !TIPO_COMPRA) return;
    TIPO_INVEST = !TIPO_INVEST;
  }
  mexeu();
  desenhar();
}

const fmt0 = v => Math.round(Number(v)||0).toLocaleString('pt-BR');
const fmt2 = (v,c) => (Number(v)||0).toLocaleString('pt-BR',
  {minimumFractionDigits:c==null?2:c, maximumFractionDigits:c==null?2:c});
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/** Estouro entre parênteses: num quadro de orçamento o sinal de menos passa
 *  despercebido de longe, o parêntese não. */
const fmtDif = d => d < 0 ? '(' + fmt0(Math.abs(d)) + ')' : fmt0(d);

function ajustarEscala() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('palco').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
}
window.addEventListener('resize', ajustarEscala);

/* Períodos: SAFRA de setembro a fevereiro, ENTRESSAFRA de março a agosto. */
function periodoCorrente() {
  const h = new Date(), ano = h.getFullYear(), mes = h.getMonth() + 1;
  if (mes >= 3 && mes <= 8)
    return { rotulo:'EntreSafra ' + ano, ini: ano*100+3, fim: ano*100+8 };
  const inicio = mes >= 9 ? ano : ano - 1;
  return { rotulo:'Safra ' + inicio + '/' + (inicio+1), ini: inicio*100+9, fim: (inicio+1)*100+2 };
}

async function carregar() {
  const p = periodoCorrente();
  try {
    const r = await fetch(`api/orcamento-compras?ini=${p.ini}&fim=${p.fim}`,
                          {headers:{'Accept':'application/json'}});
    if (r.status === 401) {
      const t = document.getElementById('tarja');
      t.textContent = '⚠ Sessão expirada — faça login neste navegador para o painel voltar a atualizar';
      t.classList.add('on');
      return;
    }
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Consulta recusada');
    document.getElementById('tarja').classList.remove('on');
    DADOS = j;
    document.getElementById('periodo').textContent = p.rotulo;
    document.getElementById('relogio').textContent = 'Atualizado em ' + j.atualizadoEm;
    // A recarga de dez em dez minutos NÃO rouba o mês de quem está olhando:
    // trocar a tela embaixo da mão de alguém é pior do que o dado ficar
    // alguns minutos parado.
    if (!MANUAL || !SEL.size) SEL = new Set([ mesAutomatico() ]);
    desenhar();
  } catch (e) {
    // Numa parede, tabela em branco é pior do que número de dez minutos
    // atrás. Só a data do fechamento é que não se inventa.
    if (!DADOS) document.getElementById('quadro').innerHTML =
      `<div class="carregando" style="color:#d03b3b">Não foi possível consultar: ${esc(e.message||e)}</div>`;
  }
}

function agregar() {
  const limite = mesLimite();
  const grupos = new Map();
  for (const l of DADOS.linhas) {
    if (NEGOCIO && l.negocio !== NEGOCIO) continue;
    if (l.tipo === 'Compra' && !TIPO_COMPRA) continue;
    if (l.tipo === 'Investimento' && !TIPO_INVEST) continue;
    const noMes = SEL.has(l.anomes), noAcum = l.anomes <= limite;
    if (!noMes && !noAcum) continue;
    const k = l.codGrupo + '|' + l.grupo;
    let g = grupos.get(k);
    if (!g) { g = {chave:k, nome:l.grupo, mp:0, mr:0, ap:0, ar:0, emp:new Map()};
              grupos.set(k, g); }
    let e = g.emp.get(l.codEmpenho);
    if (!e) { e = {chave:k + '|' + l.codEmpenho, cod:l.codEmpenho, nome:l.empenho,
                   mp:0, mr:0, ap:0, ar:0, obj:new Map()};
              g.emp.set(l.codEmpenho, e); }
    // Terceiro nível: objeto de custo. Grupo e empenho dizem "o quê"; o
    // objeto de custo diz "para onde foi".
    const ko = l.codObjeto || l.objeto;
    let o = e.obj.get(ko);
    if (!o) { o = {cod:l.codObjeto, nome:l.objeto, mp:0, mr:0, ap:0, ar:0};
              e.obj.set(ko, o); }
    if (noMes)  { for (const x of [g,e,o]) { x.mp += +l.orcado; x.mr += +l.realizado; } }
    if (noAcum) { for (const x of [g,e,o]) { x.ap += +l.orcado; x.ar += +l.realizado; } }
  }
  const vivo = x => x.mp||x.mr||x.ap||x.ar;
  const maior = (a,b) => Math.max(b.ap,b.ar) - Math.max(a.ap,a.ar);
  const lista = [...grupos.values()].filter(vivo).sort(maior);
  lista.forEach(g => {
    g.empenhos = [...g.emp.values()].filter(vivo).sort(maior);
    g.empenhos.forEach(e => { e.objetos = [...e.obj.values()].filter(vivo).sort(maior); });
  });
  return lista;
}

function serie() {
  const porMes = new Map(DADOS.meses.map(m => [m.anomes, {label:m.label, p:0, r:0}]));
  for (const l of DADOS.linhas) {
    if (NEGOCIO && l.negocio !== NEGOCIO) continue;
    if (l.tipo === 'Compra' && !TIPO_COMPRA) continue;
    if (l.tipo === 'Investimento' && !TIPO_INVEST) continue;
    const m = porMes.get(l.anomes);
    if (m) { m.p += +l.orcado; m.r += +l.realizado; }
  }
  const arr = [...porMes.values()];
  let ap = 0, ar = 0;
  arr.forEach(m => { ap += m.p; ar += m.r; m.ap = ap; m.ar = ar; });
  return arr;
}

/** Sem orçamento não existe percentual: "—", nunca 100%. */
function pct(r, p) { return p ? r * 100 / p : null; }
function classePct(p) {
  if (p === null) return '';
  if (p > 100) return 'vermelho';
  if (p >= 90)  return 'laranja';
  if (p >= 85)  return 'amarelo';
  return '';
}

function desenhar() {
  const grupos = agregar();
  const rotulo = rotuloSelecao();
  const comDado = new Set(DADOS.linhas.map(l => l.anomes));

  document.getElementById('meses').innerHTML = DADOS.meses.map(m =>
    `<button class="${SEL.has(m.anomes)?'on':''} ${comDado.has(m.anomes)?'':'futuro'}"
             onclick="trocarMes(${m.anomes}, event)">${esc(m.nome)}</button>`).join('');

  // Compra/Investimento ao lado do card de Execução — os dois ligados por
  // padrão, cada um alternável de forma independente (não deixa desligar os
  // dois ao mesmo tempo, senão o painel fica sem nada para mostrar).
  document.getElementById('tipos').innerHTML = '<div class="rot">Tipo</div>'
    + `<button class="mini-tog ${TIPO_COMPRA?'on':''}" onclick="alternarTipo('Compra')">Compra</button>`
    + `<button class="mini-tog ${TIPO_INVEST?'on':''}" onclick="alternarTipo('Investimento')">Investimento</button>`;

  // A tira de negócios só existe quando há negócio: filtro que não filtra é
  // pior do que filtro nenhum.
  const cxNeg = document.getElementById('negocios');
  if (DADOS.temNegocio && (DADOS.negocios||[]).length) {
    cxNeg.style.display = '';
    cxNeg.innerHTML = '<span class="rot">Negócio</span>'
      + `<button class="${NEGOCIO===''?'on':''}" onclick="trocarNegocio('')">Todos</button>`
      + DADOS.negocios.map(n =>
          `<button class="${NEGOCIO===n?'on':''}"
                   onclick="trocarNegocio('${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`
        ).join('')
      + '<span class="dica">Ctrl+clique nos meses soma vários</span>';
  } else {
    cxNeg.style.display = 'none';
  }

  const tp = grupos.reduce((a,g)=>a+g.mp,0), tr = grupos.reduce((a,g)=>a+g.mr,0);
  const tap = grupos.reduce((a,g)=>a+g.ap,0), tar = grupos.reduce((a,g)=>a+g.ar,0);
  const ex = pct(tr, tp), exA = pct(tar, tap);
  document.getElementById('cPlan').textContent = fmt0(tp);
  document.getElementById('cPlanBase').textContent = rotulo + ' · R$';
  document.getElementById('cReal').textContent = fmt0(tr);
  document.getElementById('cRealBase').textContent = rotulo + ' · R$';
  const cx = document.getElementById('cExec');
  cx.textContent = ex === null ? '—' : fmt2(ex);
  cx.className = 'cifra' + (ex !== null && ex > 100 ? ' mal' : '');
  document.getElementById('cExecBase').textContent =
    'acumulado ' + (exA === null ? '—' : fmt2(exA) + '%');

  // acaoReal: quando presente e há realizado, o VALOR REALIZADO vira o botão
  // que SALTA os itens (material + fornecedor / contrato) num modal.
  const bloco = (p, r, acaoReal) => {
    const d = p - r;
    const drill = (acaoReal && r)
      ? ` class="real-drill" onclick="event.stopPropagation();${acaoReal}"` : '';
    return `<td class="plan divide">${p?fmt0(p):''}</td>
            <td${drill}>${r?fmt0(r):''}</td>
            <td class="dif ${d>=0?'bem':'mal'}">${(p||r)?fmtDif(d):''}</td>
            <td class="pct ${classePct(pct(r,p))}">${pct(r,p)===null?'—':fmt2(pct(r,p))}</td>`;
  };

  document.getElementById('quadro').innerHTML = `
    <table class="q">
      <colgroup><col style="width:430px">${Array(8).fill('<col>').join('')}</colgroup>
      <thead>
        <tr class="faixa"><th class="rot" rowspan="2">Grupo de Empenho</th>
          <th colspan="4" class="divide">${esc(rotulo)}</th>
          <th colspan="4" class="divide">Acumulado</th></tr>
        <tr><th class="divide">Plan (R$)</th><th>Real (R$)</th><th>Dif.</th><th>%</th>
            <th class="divide">Plan (R$)</th><th>Real (R$)</th><th>Dif.</th><th>%</th></tr>
      </thead>
      <tbody>${grupos.map(g => {
        const aberto = ABERTOS[g.chave];
        return `<tr class="grupo ${aberto?'aberto':''}"
                    onclick="alternarGrupo('${esc(g.chave).replace(/'/g,"\\'")}')">
          <td class="rot"><span class="seta">▶</span> ${esc(g.nome)}</td>
          ${bloco(g.mp,g.mr)}${bloco(g.ap,g.ar)}
        </tr>` + (aberto ? g.empenhos.map(e => {
          const abertoE = ABERTOS[e.chave];
          // Empenho com um objeto só não abre: a linha de dentro repetiria a
          // de fora, e uma seta que não revela nada ensina a desconfiar das
          // outras.
          const vale = e.objetos.length > 1;
          // Objeto único: o realizado do empenho salta os itens. Vários
          // objetos: a linha abre nos objetos, e o realizado de cada um salta.
          const o0 = e.objetos[0] || {cod:'', nome:''};
          const acaoE = vale ? null : acaoItens(e.cod, o0.cod, e.nome, 'Empenho ' + e.cod);
          return `<tr class="empenho ${vale?'expansivel':''} ${abertoE?'aberto':''}"
                      ${vale ? `onclick="alternarGrupo('${esc(e.chave).replace(/'/g,"\\'")}')"` : ''}>
            <td class="rot">${vale ? '<span class="seta">▶</span>' : '<span class="semseta"></span>'}<span class="cod">${esc(e.cod)}</span>${esc(e.nome)}</td>
            ${bloco(e.mp,e.mr,acaoE)}${bloco(e.ap,e.ar,acaoE)}
          </tr>` + ((vale && abertoE) ? e.objetos.map(o => {
            const acaoO = acaoItens(e.cod, o.cod, o.nome, 'Empenho ' + e.cod + ' · ' + e.nome);
            return `<tr class="objeto">
            <td class="rot">${o.cod ? `<span class="cod">${esc(o.cod)}</span>` : ''}${esc(o.nome)}</td>
            ${bloco(o.mp,o.mr,acaoO)}${bloco(o.ap,o.ar,acaoO)}
          </tr>`;}).join('') : '');
        }).join('') : '');
      }).join('')}</tbody>
      <tfoot><tr><td class="rot">Total</td>${bloco(tp,tr)}${bloco(tap,tar)}</tr></tfoot>
    </table>`;

  encaixar();
  graficoMensal();
  graficoAcumulado();
}

// ── Itens (material + fornecedor / contrato), num MODAL que salta na tela ──
//
// Clicar no valor REALIZADO de um objeto abre um modal FORA do palco escalado
// (por isso legível em qualquer distância). Vem sob demanda, guardado por
// (empenho, objeto, meses). O total pode não fechar com o realizado — o número
// que vale é o do quadro; aqui é só o endereço do gasto.
const ITENS = {};

function acaoItens(empenho, objeto, titulo, sub) {
  const a = s => esc(String(s == null ? '' : s)).replace(/'/g, "\\'");
  return `abrirItens('${a(empenho)}','${a(objeto || '')}','${a(titulo)}','${a(sub)}')`;
}

function chaveItens(empenho, objeto) {
  return empenho + '|' + (objeto || '') + '|' + [...SEL].sort((a, b) => a - b).join(',');
}

async function abrirItens(empenho, objeto, titulo, sub) {
  document.getElementById('miTitulo').textContent = titulo || 'Itens do realizado';
  document.getElementById('miSub').textContent = (sub ? sub + ' · ' : '') + rotuloSelecao();
  document.getElementById('modalItens').classList.add('on');

  const ck = chaveItens(empenho, objeto);
  if (!ITENS[ck]) {
    ITENS[ck] = { carregando: true };
    pintarItens(ck);
    try {
      const meses = [...SEL].join(',');
      const url = 'api/orcamento-compras/itens?meses=' + encodeURIComponent(meses)
                + '&empenho=' + encodeURIComponent(empenho)
                + '&objeto=' + encodeURIComponent(objeto || '');
      const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || 'Falha ao detalhar');
      ITENS[ck] = { lista: j.itens || [], soma: j.soma || 0 };
    } catch (e) {
      ITENS[ck] = { erro: e.message || String(e) };
    }
  }
  pintarItens(ck);
}

function pintarItens(ck) {
  const it = ITENS[ck];
  const corpo = document.getElementById('miCorpo');
  const rodape = document.getElementById('miRodape');
  if (!it || it.carregando) { corpo.innerHTML = '<div class="mi-vazio">Carregando itens…</div>'; rodape.innerHTML = ''; return; }
  if (it.erro)             { corpo.innerHTML = `<div class="mi-vazio" style="color:#d03b3b">${esc(it.erro)}</div>`; rodape.innerHTML = ''; return; }
  if (!it.lista.length)    { corpo.innerHTML = '<div class="mi-vazio">Sem itens detalhados no período.</div>'; rodape.innerHTML = ''; return; }
  corpo.innerHTML = it.lista.map(x =>
    `<div class="mi-item"><div class="mi-desc">${rotuloItem(x)}</div>` +
    `<div class="mi-val">${x.valor ? fmt0(x.valor) : ''}</div></div>`).join('');
  rodape.innerHTML = `<span>${it.lista.length} item(ns)</span>`
    + `<span>Soma dos itens: <b>${fmt0(it.soma || 0)}</b></span>`;
}

function fecharItens() { document.getElementById('modalItens').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharItens(); });

function rotuloItem(x) {
  if (x.origem === 'contrato' && x.contrato) return `📄 Contrato ${esc(x.contrato)}`;
  if (x.material || x.fornecedor) {
    let s = esc(x.material || '(material sem descrição)');
    if (x.fornecedor) s += ` · <span class="forn">${esc(x.fornecedor)}</span>`;
    const refs = [];
    if (x.cotacao)     refs.push('Cot ' + esc(x.cotacao));
    if (x.nroc)        refs.push('OC ' + esc(x.nroc));
    if (x.solicitacao) refs.push('Sol ' + esc(x.solicitacao));
    if (refs.length) s += ` <span class="refs">${refs.join(' · ')}</span>`;
    return s;
  }
  return '<span class="semdet">sem detalhe de compra</span>';
}

/**
 * Encaixa o quadro na altura do bloco MEDINDO, não estimando.
 *
 * O número de grupos varia com o período e com o que a controladoria
 * cadastrou; a fonte que preenche doze linhas derruba vinte para fora da
 * tela. Tudo na tabela está em em, então mexer em --fonte encolhe a tabela
 * inteira de uma vez.
 */
function encaixar() {
  const caixa = document.querySelector('#quadro').parentElement;
  const tabela = caixa.querySelector('table');
  if (!tabela) return;
  const disponivel = caixa.clientHeight - 24;
  let fonte = 16;
  // Encolhe E CRESCE. Se só encolhesse, um recorte com poucos grupos —
  // filtrar por um negócio deixa três ou quatro — esvaziaria metade do
  // bloco, e numa parede altura sobrando é altura de leitura jogada fora.
  //
  // O teto é 26px: acima disso as oito colunas de dinheiro deixam de caber
  // na largura, que é o limite real aqui, não a altura.
  for (let passada = 0; passada < 3; passada++) {
    document.documentElement.style.setProperty('--fonte', fonte.toFixed(2) + 'px');
    const ocupado = tabela.offsetHeight;
    if (!ocupado) return;
    fonte = Math.max(8, Math.min(26, fonte * (disponivel * 0.99) / ocupado));
  }
  document.documentElement.style.setProperty('--fonte', fonte.toFixed(2) + 'px');
}

// ── Gráficos ────────────────────────────────────────────────────────────
/* doZero: no acumulado a história é o crescimento desde o zero; no mensal é
   a distância entre duas linhas coladas, que do zero ficam espremidas no
   topo e escondem justamente o assunto. */
function linha(id, dados, series, doZero) {
  const canvas = document.getElementById(id);
  if (graficos[id]) graficos[id].destroy();
  graficos[id] = new Chart(canvas, {
    type: 'line',
    data: { labels: dados.map(m => m.label), datasets: series },
    options: {
      responsive:true, maintainAspectRatio:false, animation:false,
      layout:{ padding:{ top:26, right:16, left:10, bottom:4 } },
      scales:{
        x:{ grid:{display:false}, border:{color:'#e3e8f5'},
            ticks:{ color:'#52514e', font:{size:14, weight:'800'} } },
        y:{ ticks:{ color:'#898781', font:{size:12, weight:'700'}, maxTicksLimit:5,
                    callback: v => v === 0 ? '0' : fmt2(v/1e6,1) + ' mi' },
            grid:{ color:'#e9edf6' }, border:{display:false},
            beginAtZero: doZero, grace: doZero ? 0 : '18%' }
      },
      plugins:{ legend:{display:false}, tooltip:{enabled:false} }
    },
    plugins: [{
      id: 'rotulos',
      afterDatasetsDraw(chart) {
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '800 13px system-ui, sans-serif';
        chart.data.datasets.forEach((ds, di) => {
          ctx.fillStyle = ds.borderColor;
          const outro = chart.getDatasetMeta(1 - di).data;
          const ultimo = ds.data.length - 1;
          chart.getDatasetMeta(di).data.forEach((p, i) => {
            const v = ds.data[i];
            if (!v) return;
            const acima = !outro[i] || p.y <= outro[i].y;
            ctx.textBaseline = acima ? 'bottom' : 'top';
            // As pontas escrevem para dentro: centralizado, o primeiro
            // rótulo cavalga a marca do eixo e o último sai do quadro.
            ctx.textAlign = i === 0 ? 'left' : (i === ultimo ? 'right' : 'center');
            // Nas pontas, um respiro horizontal: alinhado exatamente no x do
            // ponto, o texto encosta no próprio marcador.
            const dx = i === 0 ? 5 : (i === ultimo ? -5 : 0);
            ctx.fillText(fmt2(v/1e6,1) + ' mi', p.x + dx, p.y + (acima ? -9 : 9));
          });
        });
        ctx.restore();
      }
    }]
  });
}

const estilo = (label, cor, dados) => ({
  label, data: dados, borderColor: cor, backgroundColor: 'transparent',
  borderWidth: 3, pointRadius: 5, pointBackgroundColor: cor,
  pointBorderColor: '#fff', pointBorderWidth: 2, tension: .3, spanGaps: false
});
const zeroNulo = v => (Number(v)||0) === 0 ? null : Number(v);

function graficoMensal() {
  const s = serie();
  linha('gMensal', s, [ estilo('Previsto',  COR_ORCADO,    s.map(m => zeroNulo(m.p))),
                        estilo('Realizado', COR_REALIZADO, s.map(m => zeroNulo(m.r))) ], false);
}
function graficoAcumulado() {
  const s = serie();
  linha('gAcum', s, [ estilo('Previsto',  COR_ACUM_PREV, s.map(m => zeroNulo(m.ap))),
                      estilo('Realizado', COR_ACUM_REAL, s.map(m => zeroNulo(m.ar))) ], true);
}

ajustarEscala();
carregar();
setInterval(carregar, INTERVALO_MS);
</script>
