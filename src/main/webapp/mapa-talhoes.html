<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Talhões · Usina Santa Clotilde</title>
<link rel="stylesheet" href="css/leaflet.css">
<link rel="manifest" href="mapa-talhoes.webmanifest">
<!-- O iOS ignora os ícones do manifest ao "Adicionar à Tela de Início":
     sem apple-touch-icon ele usa uma captura da própria tela como ícone. -->
<link rel="apple-touch-icon" href="img/mapa-talhoes-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/mapa-talhoes-192.png">
<meta name="apple-mobile-web-app-title" content="Talhões">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16342a">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Slots categóricos na ordem canônica, atribuídos por cod_situacao —
       a cor segue a identidade da situação, nunca a ordem em que ela
       aparece na tela. Verde e vermelho não são usados aqui: seriam lidos
       como "bom/ruim", e situação de talhão não tem esse juízo. */
    --sit-1: #2a78d6;   /* Colheita   */
    --sit-2: #eb6834;   /* Reforma    */
    --sit-3: #1baf7a;   /* Expansão   */
    --sit-4: #eda100;   /* Pousio     */
    --sit-5: #e87ba4;   /* Improdutivo*/
    --sit-0: #98a2b3;   /* sem cadastro na safra */
    --ink: #0f2460;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; background: #f4f6fb; color: #1a1a2e;
  }

  .header {
    background: linear-gradient(135deg, #16342a 0%, #234f3b 100%);
    color: white; padding: 12px 20px; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; flex-wrap: wrap; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .header-logo { width: 38px; height: 38px; border-radius: 8px; background: white;
                 display: flex; align-items: center; justify-content: center; padding: 4px; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 17px; font-weight: 800; }
  .header-sub { font-size: 11.5px; opacity: .85; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .header select, .header input {
    padding: 6px 10px; border-radius: 7px; border: 1.5px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.12); color: white; font-size: 12px; outline: none;
  }
  .header select option { color: #1a1a2e; }
  .header input::placeholder { color: rgba(255,255,255,.6); }
  .btn-topo {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px;
    border: 1.5px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.9); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-topo:hover { background: rgba(255,255,255,.22); }

  .corpo { flex: 1; display: flex; min-height: 0; }
  #mapa { flex: 1; min-width: 0; background: #dfe6f2; }

  /* ── Painel lateral ── */
  .painel {
    width: 300px; flex-shrink: 0; background: white; border-left: 1px solid #e3e8f5;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .painel h3 {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    color: #64748b; padding: 14px 16px 8px;
  }
  .legenda-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer;
    border-left: 3px solid transparent; font-size: 13px;
  }
  .legenda-item:hover { background: #f5f7fb; }
  .legenda-item.oculta { opacity: .38; }
  .legenda-item.oculta .nome { text-decoration: line-through; }
  .caixa { width: 15px; height: 15px; border-radius: 4px; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,.25); }
  .legenda-item .nome { font-weight: 600; color: var(--ink); flex: 1; }
  .legenda-item .qtde { font-size: 11.5px; color: #64748b; text-align: right; font-variant-numeric: tabular-nums; }

  .resumo { padding: 10px 16px 16px; border-top: 1px solid #eef1f8; margin-top: 6px; }
  .resumo .linha { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; color: #475569; }
  .resumo .linha b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .aviso {
    margin: 10px 16px; padding: 10px 12px; border-radius: 8px; font-size: 11.5px; line-height: 1.5;
    background: #fffaf0; border-left: 3px solid #eda100; color: #52514e;
  }

  /* ── Popup ── */
  .leaflet-popup-content { margin: 12px 14px; min-width: 240px; }
  .pop-tit { font-size: 14px; font-weight: 800; color: var(--ink); }
  .pop-faz { font-size: 11.5px; color: #64748b; margin-bottom: 8px; }
  .pop-sit { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
             padding: 3px 9px; border-radius: 999px; color: white; margin-bottom: 9px; }
  .pop-tab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .pop-tab td { padding: 3px 0; }
  .pop-tab td:first-child { color: #64748b; padding-right: 12px; white-space: nowrap; }
  .pop-tab td:last-child { text-align: right; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pop-vazio { font-size: 12px; color: #94a0b8; font-style: italic; }

  .carregando {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(244,246,251,.92); z-index: 1000; font-size: 13px; color: #475569; flex-direction: column; gap: 10px;
  }
  .spinner { width: 28px; height: 28px; border: 3px solid #e3e8f5; border-top-color: #1a3a7c;
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Onde estou: cartão fixo do talhão sob o GPS ── */
  .cartao-gps {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 900;
    background: white; border-radius: 12px; box-shadow: 0 6px 24px rgba(15,36,96,.22);
    padding: 12px 14px; display: none; max-width: 420px;
  }
  .cartao-gps.on { display: block; }
  .cartao-gps .fechar { position: absolute; top: 8px; right: 10px; border: none; background: none;
                        font-size: 18px; color: #94a0b8; cursor: pointer; line-height: 1; }
  .cartao-gps .rot { font-size: 10px; font-weight: 700; text-transform: uppercase;
                     letter-spacing: .5px; color: #64748b; }
  .cartao-gps .fora { font-size: 13px; color: #52514e; margin-top: 4px; }

  /* Estado da conexão e do GPS */
  .tarja {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 900;
    background: #fffaf0; border: 1.5px solid #eda100; color: #52514e;
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
    display: none; white-space: nowrap; box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .tarja.on { display: block; }
  .btn-topo.ativo { background: white; color: #16342a; border-color: white; }

  /* Gravar trilha: bolinha vermelha de verdade, não o glifo ⏺, que desenha
     como um círculo preto qualquer e some no meio dos outros botões — abaixo
     de 560px os rótulos saem e sobra só o ícone para distinguir. Gravando, o
     botão inteiro fica vermelho e a bolinha pulsa: é o sinal, visível de
     relance, de que o aparelho ainda está registrando. */
  .btn-trilha .ponto {
    width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block;
    background: #ff5a5a; box-shadow: 0 0 0 2px rgba(255,90,90,.30);
  }
  .btn-topo.btn-trilha.ativo { background: #d03b3b; border-color: #d03b3b; color: white; }
  .btn-topo.btn-trilha.ativo .ponto {
    background: white; box-shadow: 0 0 0 2px rgba(255,255,255,.40);
    animation: pulsa 1.4s ease-in-out infinite;
  }

  /* Rótulo sobre o talhão: sem caixa, para não tapar a imagem. A leitura
     vem do contorno escuro, que funciona tanto sobre cana quanto sobre
     solo exposto. */
  .rot-talhao {
    color: #fff; font-size: 11px; font-weight: 700; line-height: 1.15;
    text-align: center; white-space: nowrap; pointer-events: none;
    text-shadow: 0 0 3px rgba(0,0,0,.95), 0 1px 2px rgba(0,0,0,.9);
  }
  .rot-talhao .area { font-size: 10px; font-weight: 600; opacity: .95; }

  /* Painel da gravação: fica visível o tempo todo enquanto grava, porque é
     o que diz que o aparelho ainda está registrando.
     Abaixo do controle de zoom (que ocupa o canto até uns 70px) e longe do
     rodapé, onde o cartão "Você está em" abre — e ele abre justamente durante
     a gravação, porque gravar trilha liga o GPS junto. */
  .grav {
    position: absolute; left: 12px; top: 84px; z-index: 900;
    background: rgba(255,255,255,.96); border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 4px 18px rgba(15,36,96,.25); display: none; min-width: 172px;
  }
  .grav.on { display: block; }
  .grav .tit { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 800;
               text-transform: uppercase; letter-spacing: .5px; color: #d03b3b; }
  .grav .bolha { width: 9px; height: 9px; border-radius: 50%; background: #d03b3b;
                 animation: pulsa 1.4s ease-in-out infinite; }
  @keyframes pulsa { 0%,100%{opacity:1} 50%{opacity:.25} }
  .grav .num { font-size: 20px; font-weight: 800; color: var(--ink);
               font-variant-numeric: tabular-nums; margin-top: 5px; }
  .grav .sub { font-size: 11.5px; color: #64748b; font-variant-numeric: tabular-nums; }
  .grav .acoes { display: flex; gap: 6px; margin-top: 9px; }
  .grav button { flex: 1; padding: 6px 8px; border-radius: 7px; border: 1.5px solid #d8dfee;
                 background: white; font-size: 12px; font-weight: 700; cursor: pointer; color: #475569; }
  .grav button.parar { background: #d03b3b; border-color: #d03b3b; color: white; }

  /* Diálogo de nome ao salvar a trilha.
     Feito na própria tela em vez de prompt(): no iPhone, com o app instalado
     na tela de início, o prompt do navegador não aparece — a trilha era salva
     sem nome e sem ninguém entender por quê. */
  .modal { position: fixed; inset: 0; z-index: 2000; display: none;
           align-items: center; justify-content: center; padding: 20px;
           background: rgba(15,36,96,.45); }
  .modal.on { display: flex; }
  .modal .cx { background: white; border-radius: 14px; padding: 18px 18px 16px;
               width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(15,36,96,.35); }
  .modal h4 { font-size: 15px; font-weight: 800; color: var(--ink); }
  .modal .resumo { font-size: 12.5px; color: #64748b; margin-top: 3px;
                   font-variant-numeric: tabular-nums; }
  .modal input { width: 100%; margin-top: 13px; padding: 11px 12px; font-size: 16px;
                 border: 1.5px solid #d8dfee; border-radius: 9px; color: var(--ink);
                 font-family: inherit; box-sizing: border-box; }
  .modal input:focus { outline: none; border-color: #2a78d6; }
  .modal .acoes { display: flex; gap: 8px; margin-top: 14px; }
  .modal button { flex: 1; padding: 11px 10px; border-radius: 9px; font-size: 13.5px;
                  font-weight: 700; cursor: pointer; border: 1.5px solid #d8dfee;
                  background: white; color: #475569; font-family: inherit; }
  .modal button.pri { background: #16342a; border-color: #16342a; color: white; }

  /* Lista de trilhas no painel lateral */
  .trilha-item { display: flex; align-items: center; gap: 8px; padding: 7px 16px;
                 font-size: 12.5px; border-top: 1px solid #f1f4fa; }
  .trilha-item .nome { flex: 1; min-width: 0; color: var(--ink); font-weight: 600;
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .trilha-item .med { color: #64748b; font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trilha-item .ico { border: none; background: none; cursor: pointer; font-size: 13px; padding: 2px 4px; color: #94a0b8; }
  .trilha-item.pendente .nome::after { content: ' ⏳'; }

  .marca-eu {
    width: 18px; height: 18px; border-radius: 50%; background: #2a78d6;
    border: 3px solid white; box-shadow: 0 0 0 1px rgba(0,0,0,.3);
  }

  /* No celular o cabeçalho vira duas faixas: identificação em cima, e os
     controles embaixo ocupando a largura toda. Antes, .header-right não
     quebrava linha e os botões da direita saíam da tela. */
  @media (max-width: 820px) {
    .corpo { flex-direction: column; }
    .painel { width: 100%; max-height: 40vh; border-left: none; border-top: 1px solid #e3e8f5; }

    .header { padding: 10px 12px; gap: 10px; }
    .header-left { width: 100%; }
    .header-right { width: 100%; justify-content: flex-start; gap: 6px; }
    .header select { flex: 0 0 auto; }
    .header input[type="search"] { flex: 1 1 130px; min-width: 0; width: auto !important; }
    .btn-topo { padding: 7px 10px; font-size: 12px; }
  }

  /* Telas estreitas: os rótulos dão lugar aos ícones, que já dizem o que é.
     O title continua descrevendo cada botão para quem tocar e segurar. */
  @media (max-width: 560px) {
    .header-title { font-size: 15px; }
    .header-sub { display: none; }
    .btn-topo { padding: 7px 9px; }
    .btn-topo .rotulo { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Mapa de Talhões</div>
      <div class="header-sub">Situação atual por talhão · clique para ver os detalhes</div>
    </div>
  </div>
  <div class="header-right">
    <select id="selSafra" onchange="carregarDados()"><option>…</option></select>
    <input type="search" id="busca" placeholder="Buscar talhão ou fazenda…" oninput="aplicarFiltros()" style="width:190px">
    <button class="btn-topo" id="btnGps" onclick="alternarGps()" title="Mostrar minha posição">📍<span class="rotulo"> Onde estou</span></button>
    <button class="btn-topo" id="btnOffline" onclick="prepararOffline()"
            title="O mapa é guardado sozinho sempre que há rede. Toque para atualizar agora.">⬇<span class="rotulo"> Offline</span></button>
    <button class="btn-topo btn-trilha" id="btnTrilha" onclick="alternarTrilha()"
            title="Gravar o caminho percorrido"><span class="ponto"></span><span class="rotulo">Trilha</span></button>
    <button class="btn-topo" id="btnImagens" onclick="atualizarTudo()"
            title="Atualizar o app, os dados e as imagens de satélite">🛰<span class="rotulo"> Atualizar</span></button>
    <button class="btn-topo" onclick="enquadrarTudo()" title="Enquadrar todos os talhões">⤢<span class="rotulo"> Ver tudo</span></button>
    <button class="btn-topo" onclick="window.location.href='hub.html'" title="Voltar ao Hub">←<span class="rotulo"> Hub</span></button>
  </div>
</div>

<div class="corpo">
  <div id="mapa" style="position:relative">
    <div class="carregando" id="carregando"><div class="spinner"></div><span id="carregandoTxt">Carregando mapa…</span></div>
    <div class="tarja" id="tarjaErro" style="background:#fef2f2;border-color:#d03b3b;color:#991b1b;
         max-width:min(560px,92%);white-space:normal;text-align:center;line-height:1.45"></div>
    <div class="grav" id="painelGrav">
      <div class="tit"><span class="bolha"></span> Gravando trilha</div>
      <div class="num" id="gravDist">0 m</div>
      <div class="sub"><span id="gravTempo">00:00</span> · <span id="gravPontos">0</span> pontos</div>
      <div class="acoes">
        <button onclick="pedirNomeDaTrilha()">Salvar</button>
        <button class="parar" onclick="pararTrilha(false)">Descartar</button>
      </div>
    </div>
    <div class="cartao-gps" id="cartaoGps">
      <button class="fechar" onclick="fecharCartao()">×</button>
      <div class="rot">Você está em</div>
      <div id="cartaoConteudo"></div>
    </div>
  </div>
  <div class="painel">
    <h3>Minhas trilhas</h3>
    <div id="listaTrilhas"></div>
    <h3>Situação do talhão</h3>
    <div id="legenda"></div>
    <div class="resumo" id="resumo"></div>
  </div>
</div>

<!-- No nível do body, e não dentro do #mapa: position:fixed é relativo à
     viewport até alguém pôr um transform num ancestral — e aí o diálogo
     passaria a ficar preso à moldura do mapa, sem cobrir o painel lateral. -->
<div class="modal" id="modalNome">
  <div class="cx">
    <h4>Salvar trilha</h4>
    <div class="resumo" id="nomeResumo"></div>
    <input type="text" id="nomeTrilha" maxlength="80" placeholder="Nome da trilha"
           autocomplete="off" autocapitalize="sentences"
           onkeydown="if(event.key==='Enter'){event.preventDefault();salvarComNome()}">
    <div class="acoes">
      <button onclick="fecharNomeDaTrilha()">Continuar gravando</button>
      <button class="pri" onclick="salvarComNome()">Salvar</button>
    </div>
  </div>
</div>

<script src="js/leaflet.js"></script>
<script>
// ── Situações (agricola.situacao_talhao) ─────────────────────────────────
// A cor é atribuída pelo CÓDIGO, não pela ordem de exibição: filtrar ou
// reordenar a legenda não pode repintar os talhões que continuam na tela.
const SITUACOES = {
  1: { nome: 'Colheita',    cor: '#2a78d6' },
  2: { nome: 'Reforma',     cor: '#eb6834' },
  3: { nome: 'Expansão',    cor: '#1baf7a' },
  4: { nome: 'Pousio',      cor: '#eda100' },
  5: { nome: 'Improdutivo', cor: '#e87ba4' }
};
const SEM_DADOS = { nome: 'Sem cadastro na safra', cor: '#98a2b3' };

let MAPA, CAMADA, GEO = null, DADOS = {}, OCULTAS = new Set();
let GPS = null, MARCA_EU = null, CIRCULO_EU = null, TALHAO_ATUAL = null, SEGUINDO = true;
let SAFRAS = [];

/** A partir daqui os rótulos aparecem. Abaixo disso a mediana de 8,5 ha
 *  vira um amontoado ilegível — melhor mostrar nada. */
const ZOOM_ROTULOS = 15;
/** Teto por segurança: com o mapa muito aberto num monitor grande, desenhar
 *  centenas de rótulos trava a rolagem. */
const MAX_ROTULOS = 400;
let ROTULOS = null;

/** Nível mais fundo de imagem guardado; acima disso o Leaflet amplia. */
const ZOOM_MAX_IMAGEM = 16;
const ZOOM_MIN_IMAGEM = 12;

const fmtNum = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = v => (Number(v) || 0).toLocaleString('pt-BR');
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function situacaoDe(chave) {
  const d = DADOS[chave];
  if (!d || d.cod_situacao == null) return { cod: 0, ...SEM_DADOS };
  const s = SITUACOES[d.cod_situacao];
  return s ? { cod: Number(d.cod_situacao), nome: d.desc_situacao || s.nome, cor: s.cor }
           : { cod: Number(d.cod_situacao), nome: d.desc_situacao || ('Situação ' + d.cod_situacao), cor: SEM_DADOS.cor };
}

function estilo(feature) {
  const s = situacaoDe(feature.properties.chave);
  const escondido = OCULTAS.has(s.cod) || !passaBusca(feature);
  return {
    color: '#ffffff', weight: 1, opacity: escondido ? 0 : .9,
    fillColor: s.cor, fillOpacity: escondido ? 0 : .68,
    interactive: !escondido
  };
}

function passaBusca(feature) {
  const termo = (document.getElementById('busca').value || '').trim().toLowerCase();
  if (!termo) return true;
  const p = feature.properties;
  const d = DADOS[p.chave] || {};
  return [p.chave, p.nomeFazenda, d.desc_fazenda, d.desc_variedade, 'talhão ' + p.talhao]
    .some(v => String(v || '').toLowerCase().includes(termo));
}

// ── Popup ────────────────────────────────────────────────────────────────
function conteudoPopup(p) {
  const d = DADOS[p.chave];
  const s = situacaoDe(p.chave);
  const linha = (rot, val) => val == null || val === '' ? ''
      : `<tr><td>${rot}</td><td>${esc(val)}</td></tr>`;

  const corpo = !d
    ? `<div class="pop-vazio">Sem cadastro para este talhão na safra selecionada.</div>
       <table class="pop-tab">${linha('Área (mapa)', fmtNum(p.areaShape) + ' ha')}</table>`
    : `<table class="pop-tab">
         ${linha('TCH estimado', d.tch_estimado ? fmtNum(d.tch_estimado) + ' t/ha' : null)}
         ${linha('Variedade', d.desc_variedade)}
         ${linha('Idade', d.desc_idade || (d.numerocorte != null ? d.numerocorte + 'º corte' : null))}
         ${linha('Área de produção', d.areaproducao ? fmtNum(d.areaproducao) + ' ha' : null)}
         ${linha('Área plantada', d.areaplantada ? fmtNum(d.areaplantada) + ' ha' : null)}
         ${linha('Área (mapa)', fmtNum(p.areaShape) + ' ha')}
         ${linha('Último corte', formatarData(d.data_ultimo_corte))}
       </table>`;

  return `
    <div class="pop-tit">Talhão ${esc(p.talhao)} <span style="font-weight:400;color:#94a0b8">· zona ${esc(p.zona)}</span></div>
    <div class="pop-faz">${esc((d && d.desc_fazenda) || p.nomeFazenda || 'Fazenda ' + p.fazenda)}</div>
    <div class="pop-sit" style="background:${s.cor}">${esc(s.nome)}</div>
    ${corpo}`;
}

function formatarData(v) {
  if (!v) return null;
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v);
}

// ── Legenda e resumo ─────────────────────────────────────────────────────
function montarLegenda() {
  const cont = {}, area = {};
  GEO.features.forEach(f => {
    const s = situacaoDe(f.properties.chave);
    cont[s.cod] = (cont[s.cod] || 0) + 1;
    area[s.cod] = (area[s.cod] || 0) + (Number(f.properties.areaShape) || 0);
  });

  const ordem = Object.keys(SITUACOES).map(Number).filter(c => cont[c]);
  if (cont[0]) ordem.push(0);

  document.getElementById('legenda').innerHTML = ordem.map(cod => {
    const s = cod === 0 ? SEM_DADOS : SITUACOES[cod];
    return `<div class="legenda-item ${OCULTAS.has(cod) ? 'oculta' : ''}" onclick="alternarSituacao(${cod})"
                 title="Clique para mostrar ou esconder">
              <span class="caixa" style="background:${s.cor}"></span>
              <span class="nome">${esc(s.nome)}</span>
              <span class="qtde">${fmtInt(cont[cod])} talh.<br>${fmtNum(area[cod])} ha</span>
            </div>`;
  }).join('');

  const totalArea = GEO.features.reduce((a, f) => a + (Number(f.properties.areaShape) || 0), 0);
  document.getElementById('resumo').innerHTML =
    `<div class="linha"><span>Área total</span><b>${fmtNum(totalArea)} ha</b></div>`;
}

function alternarSituacao(cod) {
  if (OCULTAS.has(cod)) OCULTAS.delete(cod); else OCULTAS.add(cod);
  montarLegenda();
  aplicarFiltros();
}

function aplicarFiltros() {
  if (CAMADA) CAMADA.setStyle(estilo);
  desenharRotulos();          // esconder uma situação esconde os rótulos dela
}

function enquadrarTudo() {
  if (CAMADA) MAPA.fitBounds(CAMADA.getBounds(), { padding: [20, 20] });
}

// ── Em qual talhão eu estou ──────────────────────────────────────────────
// Raio horizontal: conta quantas vezes a semirreta que sai do ponto cruza o
// anel. Ímpar = dentro. Coordenadas em grau servem direto — o teste é
// topológico, não métrico.
function pontoEmAnel(lng, lat, anel) {
  let dentro = false;
  for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) {
    const xi = anel[i][0], yi = anel[i][1], xj = anel[j][0], yj = anel[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) dentro = !dentro;
  }
  return dentro;
}

function pontoEmGeometria(lng, lat, geom) {
  const poligonos = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  for (const pol of poligonos) {
    if (!pontoEmAnel(lng, lat, pol[0])) continue;        // fora do contorno
    let emBuraco = false;                                 // anéis seguintes são furos
    for (let i = 1; i < pol.length; i++) {
      if (pontoEmAnel(lng, lat, pol[i])) { emBuraco = true; break; }
    }
    if (!emBuraco) return true;
  }
  return false;
}

/** Caixa envolvente pré-calculada: descarta quase tudo antes do teste caro. */
function caixaDe(f) {
  if (f._caixa) return f._caixa;
  let x1 = 180, y1 = 90, x2 = -180, y2 = -90;
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  polys.forEach(pol => pol[0].forEach(c => {
    if (c[0] < x1) x1 = c[0]; if (c[0] > x2) x2 = c[0];
    if (c[1] < y1) y1 = c[1]; if (c[1] > y2) y2 = c[1];
  }));
  f._caixa = [x1, y1, x2, y2];
  return f._caixa;
}

function talhaoEm(lng, lat) {
  if (!GEO) return null;
  for (const f of GEO.features) {
    const [x1, y1, x2, y2] = caixaDe(f);
    if (lng < x1 || lng > x2 || lat < y1 || lat > y2) continue;
    if (pontoEmGeometria(lng, lat, f.geometry)) return f;
  }
  return null;
}

// ── Trilha de GPS ────────────────────────────────────────────────────────
//
// Grava no aparelho e sobe depois. No campo não há rede para depender, e
// perder o percurso de uma manhã por causa disso seria o pior resultado
// possível — por isso cada ponto vai para o localStorage na hora, e o envio
// ao servidor é uma etapa separada, que pode falhar e ser repetida.

let TRILHA = null;          // gravação em andamento
let LINHA_TRILHA = null;    // traço da gravação em andamento
let LINHA_VISTA = null;     // traço de uma trilha antiga aberta pelo usuário
let RELOGIO_TRILHA = null;

/** Precisão pior que isto entra como ruído e distorce a distância. */
const PRECISAO_MAX_M = 35;
/** Abaixo disso é tremor do GPS parado, não deslocamento. */
const PASSO_MIN_M = 6;

/** Distância entre dois pontos na superfície da Terra, em metros. */
function distanciaM(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(2).replace('.', ',') + ' km';
const fmtDur = s => {
  const h = Math.floor(s/3600), mi = Math.floor((s%3600)/60), se = Math.floor(s%60);
  const dd = n => String(n).padStart(2,'0');
  return (h ? h + ':' : '') + dd(mi) + ':' + dd(se);
};

function trilhasLocais() { return lerLocal('trilhas') || []; }
function gravarTrilhasLocais(v) { return guardarLocal('trilhas', v); }

/**
 * As trilhas prontas, da mais recente para a mais antiga.
 *
 * A ordenação vive aqui e não em cada tela porque a lista da barra lateral e
 * os índices usados por verTrilha/excluirTrilha precisam ser exatamente a
 * mesma sequência — do contrário o lixo de uma linha apaga a trilha de outra.
 */
function trilhasEncerradas() {
  return trilhasLocais().filter(t => t.encerrada)
         .sort((a, b) => String(b.inicio).localeCompare(String(a.inicio)));
}

function alternarTrilha() {
  if (TRILHA) { pedirNomeDaTrilha(); return; }
  iniciarTrilha();
}

/**
 * Pede o nome antes de encerrar — e a gravação continua correndo enquanto o
 * diálogo está aberto. Assim "Continuar gravando" é de fato voltar ao que
 * estava, sem buraco no percurso, e nenhum caminho daqui joga fora o que já
 * foi andado.
 */
function pedirNomeDaTrilha() {
  if (!TRILHA) return;
  if (TRILHA.pontos.length < 2) {
    alert('Ainda não há percurso suficiente para guardar. Ande um pouco e tente de novo.');
    return;
  }
  const d = new Date(TRILHA.inicio);
  const p = n => String(n).padStart(2, '0');
  document.getElementById('nomeResumo').textContent =
      fmtDist(TRILHA.distancia) + ' · ' + fmtDur((Date.now() - d.getTime()) / 1000) +
      ' · ' + TRILHA.pontos.length + ' pontos';

  const campo = document.getElementById('nomeTrilha');
  campo.value = 'Trilha ' + p(d.getDate()) + '/' + p(d.getMonth() + 1) +
                ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  document.getElementById('modalNome').classList.add('on');
  // O foco vem depois de a caixa estar visível: no iOS, focar num elemento
  // ainda escondido não abre o teclado.
  setTimeout(() => { campo.focus(); campo.select(); }, 60);
}

function fecharNomeDaTrilha() {
  document.getElementById('modalNome').classList.remove('on');
}

function salvarComNome() {
  const nome = (document.getElementById('nomeTrilha').value || '').trim();
  fecharNomeDaTrilha();
  pararTrilha(true, nome || null);
}

function iniciarTrilha() {
  if (!navigator.geolocation) { alert('Este aparelho não informa a localização.'); return; }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    alert('A localização só funciona em HTTPS. Abra a intranet pelo endereço https://.');
    return;
  }
  // Pergunta depois das checagens: não faz sentido pedir confirmação para
  // depois avisar que o aparelho não vai gravar de qualquer jeito.
  if (!confirm('Deseja gravar a trilha do caminho percorrido?')) return;

  TRILHA = {
    idLocal: 't' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    inicio: new Date().toISOString(),
    pontos: [],            // [lat, lng, segundos desde o início]
    distancia: 0,
    vigia: null
  };
  LINHA_TRILHA = L.polyline([], { color: '#d03b3b', weight: 4, opacity: .9 }).addTo(MAPA);

  document.getElementById('painelGrav').classList.add('on');
  document.getElementById('btnTrilha').classList.add('ativo');
  atualizarPainelTrilha();
  RELOGIO_TRILHA = setInterval(atualizarPainelTrilha, 1000);

  TRILHA.vigia = navigator.geolocation.watchPosition(aoPontoTrilha,
      e => { if (e.code === 1) { alert('Permissão de localização negada.'); pararTrilha(false); } },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });

  // Liga o "onde estou" junto: quem grava trilha quer se ver no mapa.
  if (!GPS) alternarGps();
}

function aoPontoTrilha(pos) {
  if (!TRILHA) return;
  const { latitude: lat, longitude: lng, accuracy: prec } = pos.coords;
  if (prec && prec > PRECISAO_MAX_M) return;              // leitura ruim, descarta

  const ult = TRILHA.pontos[TRILHA.pontos.length - 1];
  if (ult) {
    const d = distanciaM(ult[0], ult[1], lat, lng);
    if (d < PASSO_MIN_M) return;                          // parado: não anda no traço
    TRILHA.distancia += d;
  }
  TRILHA.pontos.push([
    Number(lat.toFixed(6)), Number(lng.toFixed(6)),
    Math.round((Date.now() - new Date(TRILHA.inicio).getTime()) / 1000)
  ]);
  LINHA_TRILHA.addLatLng([lat, lng]);

  // Grava a cada ponto: se o app for fechado ou o celular desligar, o que
  // já foi percorrido não se perde.
  salvarRascunho();
  atualizarPainelTrilha();
}

function salvarRascunho() {
  const lista = trilhasLocais().filter(t => t.idLocal !== TRILHA.idLocal);
  lista.unshift(resumoTrilha(TRILHA, false));
  gravarTrilhasLocais(lista);
}

function resumoTrilha(t, encerrada) {
  const fim = encerrada ? new Date().toISOString() : null;
  return {
    idLocal: t.idLocal, nome: t.nome || null,
    inicio: t.inicio, fim: fim,
    duracaoS: Math.round(((fim ? new Date(fim) : new Date()) - new Date(t.inicio)) / 1000),
    distanciaM: Math.round(t.distancia),
    pontos: t.pontos,
    encerrada: encerrada, enviada: false
  };
}

function atualizarPainelTrilha() {
  if (!TRILHA) return;
  document.getElementById('gravDist').textContent = fmtDist(TRILHA.distancia);
  document.getElementById('gravPontos').textContent = TRILHA.pontos.length;
  document.getElementById('gravTempo').textContent =
      fmtDur((Date.now() - new Date(TRILHA.inicio).getTime()) / 1000);
}

/** @param nome nome escolhido no diálogo; null guarda a trilha sem nome */
async function pararTrilha(salvar, nome) {
  if (!TRILHA) return;
  if (!salvar && TRILHA.pontos.length &&
      !confirm('Descartar esta trilha? O percurso gravado será perdido.')) return;
  fecharNomeDaTrilha();

  if (TRILHA.vigia !== null) navigator.geolocation.clearWatch(TRILHA.vigia);
  clearInterval(RELOGIO_TRILHA);
  document.getElementById('painelGrav').classList.remove('on');
  document.getElementById('btnTrilha').classList.remove('ativo');
  if (LINHA_TRILHA) { MAPA.removeLayer(LINHA_TRILHA); LINHA_TRILHA = null; }

  const t = TRILHA;
  TRILHA = null;

  let lista = trilhasLocais().filter(x => x.idLocal !== t.idLocal);
  if (!salvar || t.pontos.length < 2) {
    gravarTrilhasLocais(lista);
    if (salvar && t.pontos.length < 2) alert('Trilha curta demais para guardar.');
    renderTrilhas();
    return;
  }

  t.nome = (nome || '').trim() || null;

  const reg = resumoTrilha(t, true);
  lista.unshift(reg);
  if (!gravarTrilhasLocais(lista)) {
    alert('Não foi possível guardar a trilha no aparelho: memória cheia.');
  }
  renderTrilhas();
  enviarPendentes();
}

/** Sobe o que ainda não subiu. Falhar aqui é normal — tenta de novo depois. */
let ENVIANDO = false;

/**
 * Sobe o que ainda não subiu.
 *
 * @param manual quando true, conta o resultado na tela — inclusive o motivo
 *        da falha. No automático o silêncio é proposital: falhar sem rede é
 *        o normal, e avisar a cada vez viraria ruído no meio do talhão.
 */
async function enviarPendentes(manual) {
  const lista = trilhasLocais();
  const pendentes = lista.filter(t => t.encerrada && !t.enviada);
  if (!pendentes.length) {
    if (manual) mostrarAviso('Não há trilha esperando envio.');
    return { enviadas: 0, faltando: 0 };
  }
  if (ENVIANDO) return { enviadas: 0, faltando: pendentes.length };
  ENVIANDO = true;
  renderTrilhas();

  let enviadas = 0, mudou = false, motivo = null, sessaoCaiu = false;
  try {
    for (const t of pendentes) {
      try {
        const r = await fetch('api/trilha-gps', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ idLocal: t.idLocal, nome: t.nome, inicio: t.inicio, fim: t.fim,
                                 duracaoS: t.duracaoS, distanciaM: t.distanciaM, pontos: t.pontos })
        });
        // 401 é o caso que mais engana: a trilha está inteira no aparelho, a
        // rede está boa, e o que falta é login. Sem dizer isso, a pessoa fica
        // olhando a ampulheta sem entender.
        if (r.status === 401) { sessaoCaiu = true; break; }
        const j = await r.json();
        if (j && j.ok) { t.enviada = true; t.id = j.id; mudou = true; enviadas++; }
        else motivo = (j && j.erro) || ('o servidor respondeu ' + r.status);
      } catch(e) {
        motivo = 'sem conexão com a usina';
      }
    }
  } finally {
    ENVIANDO = false;
    if (mudou) gravarTrilhasLocais(lista);
    renderTrilhas();
  }

  const faltando = pendentes.length - enviadas;
  if (manual) {
    if (sessaoCaiu) {
      mostrarAviso('Sua sessão expirou. Entre de novo na intranet e toque em enviar outra vez — ' +
                   'nenhuma trilha foi perdida, todas estão guardadas neste aparelho.');
    } else if (faltando === 0) {
      mostrarAviso(enviadas + (enviadas === 1 ? ' trilha enviada.' : ' trilhas enviadas.'));
    } else {
      mostrarAviso((enviadas ? enviadas + ' enviada(s), ' : '') + faltando +
                   ' ainda esperando' + (motivo ? ' — ' + motivo : '') +
                   '. As trilhas continuam guardadas aqui.');
    }
  }
  return { enviadas, faltando };
}

/**
 * Traz as trilhas deste usuário que estão no servidor e não neste aparelho.
 *
 * É isto que faz "cada um ter as suas": quem gravou pelo celular abre pelo
 * computador e continua vendo o que andou. Vêm só os resumos — os pontos, que
 * são o volume, ficam para quando a trilha for de fato aberta no mapa.
 *
 * Sem rede não faz nada e não avisa: a lista local já está na tela.
 */
async function baixarTrilhas() {
  let j;
  try {
    const r = await fetch('api/trilha-gps', { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return;
    j = await r.json();
  } catch(e) { return; }
  if (!j || !j.ok || !Array.isArray(j.data)) return;

  const lista = trilhasLocais();
  const daqui = new Set(lista.map(t => t.idLocal));
  let mudou = false;
  j.data.forEach(s => {
    if (!s.idLocal || daqui.has(s.idLocal)) return;
    lista.push({ idLocal: s.idLocal, id: s.id, nome: s.nome,
                 inicio: s.inicio, fim: s.fim, duracaoS: s.duracaoS,
                 distanciaM: s.distanciaM, qtdePontos: s.qtdePontos,
                 pontos: null,            // baixados sob demanda em verTrilha
                 encerrada: true, enviada: true });
    mudou = true;
  });
  if (mudou) { gravarTrilhasLocais(lista); renderTrilhas(); }
}

/**
 * Gravação que ficou aberta — o app foi fechado, a bateria acabou ou o
 * navegador matou a aba no meio do percurso.
 *
 * O rascunho no localStorage tem tudo até o último ponto recebido. Encerrar
 * aqui transforma isso numa trilha normal, que aparece na lista e sobe na
 * próxima rede. Deixar o rascunho aberto seria perder justamente o caso em
 * que a gravação mais precisa ter valido a pena.
 */
function recuperarRascunho() {
  const lista = trilhasLocais();
  const antes = lista.length;
  let mudou = false;
  const mantidas = lista.filter(t => {
    if (t.encerrada) return true;
    if (!t.pontos || t.pontos.length < 2) return false;   // nada de útil
    t.encerrada = true;
    t.enviada = false;
    t.fim = t.fim || new Date(new Date(t.inicio).getTime() + (t.duracaoS || 0) * 1000).toISOString();
    t.nome = t.nome || 'Trilha interrompida';
    mudou = true;
    return true;
  });
  if (mudou || mantidas.length !== antes) gravarTrilhasLocais(mantidas);
}

function renderTrilhas() {
  const el = document.getElementById('listaTrilhas');
  if (!el) return;
  const lista = trilhasEncerradas();

  // Botão só aparece quando há o que enviar: botão que nunca faz nada ensina
  // a ignorar botão. No iPhone o app fica suspenso e não recarrega, então
  // sem esta saída manual a trilha podia ficar dias esperando a abertura da
  // tela que nunca vinha.
  const pendentes = lista.filter(t => !t.enviada).length;
  const botao = !pendentes ? '' :
    `<div style="padding:2px 16px 10px">
       <button id="btnEnviarTrilhas" onclick="enviarPendentes(true)" ${ENVIANDO ? 'disabled' : ''}
         style="width:100%;padding:9px;border-radius:8px;border:1.5px solid #16342a;
                background:${ENVIANDO ? '#8ba39a' : '#16342a'};color:#fff;font-size:12.5px;
                font-weight:700;font-family:inherit;cursor:pointer">
         ${ENVIANDO ? 'Enviando…' : '⬆ Enviar ' + pendentes + (pendentes === 1 ? ' trilha' : ' trilhas') + ' ao servidor'}
       </button>
     </div>`;

  if (!lista.length) {
    el.innerHTML = '<div style="padding:2px 16px 10px;font-size:12px;color:#94a0b8">' +
                   'Nenhuma trilha gravada. Toque no botão vermelho <b>Trilha</b>, ' +
                   'no topo da tela, para começar.</div>';
    return;
  }
  el.innerHTML = botao + lista.map((t, i) => {
    const d = new Date(t.inicio);
    const quando = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') +
                   ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    return `<div class="trilha-item ${t.enviada ? '' : 'pendente'}">
      <span class="nome" onclick="verTrilha(${i})" title="${t.enviada ? 'Enviada' : 'Aguardando rede para enviar'}">${esc(t.nome || quando)}</span>
      <span class="med">${fmtDist(t.distanciaM)}</span>
      <button class="ico" onclick="excluirTrilha(${i})" title="Excluir">🗑</button>
    </div>`;
  }).join('');
}

/** Busca no servidor os pontos de uma trilha que veio só como resumo. */
async function pontosDaTrilha(t) {
  if (t.pontos && t.pontos.length >= 2) return t.pontos;
  if (!t.id) return null;
  try {
    const r = await fetch('api/trilha-gps/' + t.id, { headers: { 'Accept': 'application/json' } });
    const j = await r.json();
    if (!j || !j.ok || !Array.isArray(j.pontos) || j.pontos.length < 2) return null;
    // Guarda no aparelho: aberta uma vez com rede, abre sempre sem ela.
    const lista = trilhasLocais();
    const alvo = lista.find(x => x.idLocal === t.idLocal);
    if (alvo) { alvo.pontos = j.pontos; gravarTrilhasLocais(lista); }
    return j.pontos;
  } catch(e) { return null; }
}

async function verTrilha(i) {
  const t = trilhasEncerradas()[i];
  if (!t) return;
  const pontos = await pontosDaTrilha(t);
  if (!pontos) {
    alert('Esta trilha está guardada no servidor e ainda não foi baixada para este aparelho. Abra-a uma vez com rede.');
    return;
  }
  t.pontos = pontos;
  if (LINHA_VISTA) MAPA.removeLayer(LINHA_VISTA);
  LINHA_VISTA = L.polyline(t.pontos.map(p => [p[0], p[1]]),
      { color: '#4a3aa7', weight: 4, opacity: .9, dashArray: '1,0' }).addTo(MAPA);
  LINHA_VISTA.bindPopup(esc(t.nome || 'Trilha') + '<br>' + fmtDist(t.distanciaM) +
                        ' · ' + fmtDur(t.duracaoS));
  MAPA.fitBounds(LINHA_VISTA.getBounds(), { padding: [30, 30] });
}

async function excluirTrilha(i) {
  const t = trilhasEncerradas()[i];
  if (!t) return;
  if (!confirm('Excluir a trilha "' + (t.nome || 'sem nome') + '"?')) return;

  if (t.enviada && t.id) {
    try { await fetch('api/trilha-gps?id=' + t.id,
              { method: 'DELETE', headers: { 'Accept': 'application/json' } }); } catch(e) {}
  }
  gravarTrilhasLocais(trilhasLocais().filter(x => x.idLocal !== t.idLocal));
  if (LINHA_VISTA) { MAPA.removeLayer(LINHA_VISTA); LINHA_VISTA = null; }
  renderTrilhas();
}

// ── Rótulos sobre os talhões ─────────────────────────────────────────────

/** Área do anel pela fórmula do laço (sinal indica o sentido). */
function areaAnel(anel) {
  let s = 0;
  for (let i = 0; i < anel.length - 1; i++) {
    s += anel[i][0] * anel[i+1][1] - anel[i+1][0] * anel[i][1];
  }
  return s / 2;
}

/**
 * Ponto onde o rótulo é escrito: centroide do MAIOR anel do talhão.
 *
 * O centro da caixa envolvente seria mais simples, mas cai fora da figura
 * em talhão curvo — e talhão que contorna estrada ou córrego é comum aqui.
 */
function centroDe(f) {
  if (f._centro) return f._centro;
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  let anel = null, maior = -1;
  polys.forEach(pol => {
    const a = Math.abs(areaAnel(pol[0]));
    if (a > maior) { maior = a; anel = pol[0]; }
  });
  let cx = 0, cy = 0, a2 = 0;
  for (let i = 0; i < anel.length - 1; i++) {
    const c = anel[i][0] * anel[i+1][1] - anel[i+1][0] * anel[i][1];
    a2 += c;
    cx += (anel[i][0] + anel[i+1][0]) * c;
    cy += (anel[i][1] + anel[i+1][1]) * c;
  }
  const cxa = caixaDe(f);
  let lng, lat;
  if (a2 === 0) { lng = (cxa[0] + cxa[2]) / 2; lat = (cxa[1] + cxa[3]) / 2; }
  else          { lng = cx / (3 * a2);         lat = cy / (3 * a2); }

  // Talhão côncavo — o que contorna estrada ou córrego — tem o centroide
  // fora da própria figura, e o rótulo ficaria boiando no vizinho. Nesses
  // casos, procura um ponto de dentro na mesma altura.
  if (!pontoEmGeometria(lng, lat, f.geometry)) {
    const p = pontoInterno(f, lat);
    if (p) { lng = p[0]; lat = p[1]; }
  }
  f._centro = [lat, lng];
  return f._centro;
}

/**
 * Ponto dentro do talhão na altura dada: corta a figura com uma reta
 * horizontal e devolve o meio do maior trecho interno. Simples e suficiente
 * — o objetivo é só pousar o rótulo em cima do talhão certo.
 */
function pontoInterno(f, lat) {
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  const cortes = [];
  polys.forEach(pol => pol.forEach(anel => {
    for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) {
      const [xi, yi] = anel[i], [xj, yj] = anel[j];
      if ((yi > lat) !== (yj > lat)) cortes.push(xi + (lat - yi) * (xj - xi) / (yj - yi));
    }
  }));
  if (cortes.length < 2) return null;
  cortes.sort((a, b) => a - b);
  let melhor = null, maior = 0;
  for (let i = 0; i + 1 < cortes.length; i++) {
    const meio = (cortes[i] + cortes[i+1]) / 2;
    const larg = cortes[i+1] - cortes[i];
    if (larg > maior && pontoEmGeometria(meio, lat, f.geometry)) { maior = larg; melhor = [meio, lat]; }
  }
  return melhor;
}

/** Área que vai no rótulo: a de produção do ERP quando há cadastro; sem ele,
 *  a área do próprio desenho, que existe sempre. */
function areaDoRotulo(p) {
  const d = DADOS[p.chave];
  const a = d && Number(d.areaproducao) ? Number(d.areaproducao) : Number(p.areaShape);
  return a ? fmtNum(a) + ' ha' : '';
}

function desenharRotulos() {
  if (!CAMADA) return;
  if (!ROTULOS) ROTULOS = L.layerGroup().addTo(MAPA);
  ROTULOS.clearLayers();
  if (MAPA.getZoom() < ZOOM_ROTULOS) return;

  const vista = MAPA.getBounds();
  let postos = 0;
  for (const f of GEO.features) {
    if (postos >= MAX_ROTULOS) break;
    const s = situacaoDe(f.properties.chave);
    if (OCULTAS.has(s.cod) || !passaBusca(f)) continue;      // segue o filtro da tela
    const c = centroDe(f);
    if (!vista.contains(c)) continue;                         // só o que está à vista

    const p = f.properties;
    const area = areaDoRotulo(p);
    L.marker(c, { interactive: false, keyboard: false,
      icon: L.divIcon({ className: 'rot-talhao', iconSize: null,
        html: esc(p.fazenda) + '-' + esc(p.talhao) + (area ? '<div class="area">' + area + '</div>' : '') })
    }).addTo(ROTULOS);
    postos++;
  }
}

// ── GPS ──────────────────────────────────────────────────────────────────
function alternarGps() {
  if (GPS) { pararGps(); return; }
  if (!navigator.geolocation) { alert('Este aparelho não informa a localização.'); return; }
  // Navegadores só liberam a posição em HTTPS (ou localhost).
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    alert('A localização só funciona em HTTPS. Abra a intranet pelo endereço https://.');
    return;
  }
  document.getElementById('btnGps').classList.add('ativo');
  SEGUINDO = true;
  // Zera para o cartão ser montado na primeira leitura, mesmo que a pessoa
  // já esteja no mesmo talhão de antes — quem toca no botão quer ver a
  // informação agora, não só quando mudar de talhão.
  TALHAO_ATUAL = undefined;
  GPS = navigator.geolocation.watchPosition(aoPosicionar, erroGps,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  // Arrastar o mapa desliga o "seguir", senão a tela briga com o usuário.
  MAPA.on('dragstart', () => { SEGUINDO = false; });
}

function pararGps() {
  if (GPS !== null) navigator.geolocation.clearWatch(GPS);
  GPS = null; TALHAO_ATUAL = null;
  document.getElementById('btnGps').classList.remove('ativo');
  if (MARCA_EU) { MAPA.removeLayer(MARCA_EU); MARCA_EU = null; }
  if (CIRCULO_EU) { MAPA.removeLayer(CIRCULO_EU); CIRCULO_EU = null; }
  fecharCartao();
}

function erroGps(e) {
  pararGps();
  alert(e.code === 1 ? 'Permissão de localização negada. Libere no navegador para usar "Onde estou".'
                     : 'Não foi possível obter a localização: ' + e.message);
}

function aoPosicionar(pos) {
  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  const precisao = pos.coords.accuracy || 0;
  const p = [lat, lng];

  if (!MARCA_EU) {
    MARCA_EU = L.marker(p, { icon: L.divIcon({ className: '', html: '<div class="marca-eu"></div>',
                             iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 1000 }).addTo(MAPA);
    CIRCULO_EU = L.circle(p, { radius: precisao, color: '#2a78d6', weight: 1,
                               fillColor: '#2a78d6', fillOpacity: .12 }).addTo(MAPA);
  } else {
    MARCA_EU.setLatLng(p);
    CIRCULO_EU.setLatLng(p).setRadius(precisao);
  }
  if (SEGUINDO) MAPA.setView(p, Math.max(MAPA.getZoom(), 16));

  const f = talhaoEm(lng, lat);
  const chave = f ? f.properties.chave : null;
  if (chave !== TALHAO_ATUAL) {          // só redesenha ao mudar de talhão
    TALHAO_ATUAL = chave;
    mostrarCartao(f, precisao);
  }
}

function mostrarCartao(f, precisao) {
  const cartao = document.getElementById('cartaoGps');
  const alvo = document.getElementById('cartaoConteudo');
  if (!f) {
    alvo.innerHTML = `<div class="fora">Fora dos talhões mapeados${
      precisao ? ' · precisão de ' + Math.round(precisao) + ' m' : ''}</div>`;
  } else {
    alvo.innerHTML = conteudoPopup(f.properties) +
      (precisao > 25 ? `<div class="fora" style="margin-top:6px">Precisão do GPS: ${Math.round(precisao)} m — pode estar no talhão vizinho.</div>` : '');
  }
  cartao.classList.add('on');
}

function fecharCartao() { document.getElementById('cartaoGps').classList.remove('on'); }

// ── Offline ──────────────────────────────────────────────────────────────
/** Falha do ERP fica na tela, não num alerta que se fecha e some. */
/** Recado curto na tarja — o que a pessoa precisa saber, sem alert. */
function mostrarAviso(texto) {
  const t = document.getElementById('tarjaErro');
  t.style.background = '#fffaf0'; t.style.borderColor = '#eda100'; t.style.color = '#52514e';
  t.innerHTML = esc(texto);
  t.classList.add('on');
  clearTimeout(mostrarAviso._t);
  mostrarAviso._t = setTimeout(() => t.classList.remove('on'), 9000);
}

function mostrarErro(onde, e) {
  const t = document.getElementById('tarjaErro');
  t.innerHTML = '<b>' + onde + '</b><br>' + esc(e && e.message ? e.message : String(e));
  t.classList.add('on');
  console.error('[mapa-talhoes] ' + onde, e);
}
function limparErro() { document.getElementById('tarjaErro').classList.remove('on'); }

/**
 * Cópia dos dados no localStorage, além do cache do service worker.
 *
 * São duas redes de segurança de propósito: o Cache API pode ser descartado
 * pelo navegador (o iOS é agressivo com isso), e o worker só responde se a
 * requisição passar por ele. O localStorage sobrevive aos dois casos, e é
 * ele que garante que a tela abre com dado no meio do talhão.
 */
function guardarLocal(chave, valor) {
  try { localStorage.setItem('mapaTalhoes.' + chave, JSON.stringify(valor)); return true; }
  catch(e) { return false; }   // cota estourada: segue sem a cópia
}
function lerLocal(chave) {
  try {
    const v = localStorage.getItem('mapaTalhoes.' + chave);
    return v ? JSON.parse(v) : null;
  } catch(e) { return null; }
}

/** Quando esta safra foi consultada pela última vez com sinal. */
function dataDosDados(safra) {
  safra = safra || document.getElementById('selSafra').value;
  let iso = null;
  try { iso = localStorage.getItem('mapaTalhoes.dadosEm.' + safra); } catch(e) {}
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth()+1) + ' às ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/** A idade do dado vive no título dos botões, não em faixa na tela. */
function mostrarIdadeDados(safra, doCache) {
  conferirOffline();
}

/*
 * navigator.onLine não decide nada aqui: em app instalado no iOS ele mente
 * com frequência, ficando falso com 5G ligado. Quem diz se há rede é a
 * própria requisição — se volta, há; se falha, entra o que está guardado,
 * em silêncio. A atualização é do usuário: o botão 🛰.
 */

/** Voltar para o app é o momento natural de buscar dado novo: em modo
 *  aplicativo a página costuma ser retomada, não recarregada. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const safra = document.getElementById('selSafra').value;
  if (safra) carregarDados();
  // Em modo aplicativo a página é retomada, não recarregada — então é aqui
  // que se pergunta ao navegador se há versão nova do app.
  try {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistration()
        .then(reg => reg && reg.update())
        .catch(() => {});
    }
  } catch(e) {}
});
window.addEventListener('online', () => {
  const safra = document.getElementById('selSafra').value;
  if (safra) carregarDados();
});

/**
 * Diz, com sinal ainda, se a tela realmente abre sem ele.
 *
 * Não basta o worker estar registrado: o que decide é a PÁGINA estar no
 * cache. Um atalho criado a partir do login ou do hub abre uma tela que
 * nunca foi guardada — e a falha só aparece no meio do talhão, quando não
 * há como corrigir.
 */
/**
 * Diz, no próprio botão, se a tela já abre sem sinal. O que decide não é o
 * worker estar registrado, e sim a PÁGINA e o desenho estarem no cache — um
 * atalho criado a partir do login abre uma tela que nunca foi guardada, e a
 * falha só apareceria no meio do talhão.
 */
async function conferirOffline() {
  const btn = document.getElementById('btnOffline');
  let pronto = false;
  try {
    const c = await caches.open('mapa-talhoes-v2-casca');
    pronto = !!(await c.match('mapa-talhoes.html')) && !!(await c.match('mapas/talhoes.geojson'));
  } catch(e) { pronto = false; }

  if (!btn) return pronto;
  const quando = dataDosDados();
  btn.innerHTML = (pronto ? '✔' : '⬇') + '<span class="rotulo"> Offline</span>';
  btn.classList.toggle('ativo', pronto);
  btn.title = pronto
    ? 'Funciona sem sinal' + (quando ? ' · dados de ' + quando : '') + '. Toque para atualizar agora.'
    : 'Ainda não funciona sem sinal — toque para guardar agora.';
  return pronto;
}

/**
 * Guarda tudo sozinho quando há rede: o desenho dos talhões e os dados das
 * safras que estão à escolha. Sem depender de alguém lembrar de apertar um
 * botão antes de sair — que é justamente o que não acontece na correria.
 *
 * Recebe a lista já recortada: o que fica guardado é exatamente o que dá para
 * abrir, sem baixar safra que a pessoa nem vê na tela.
 */
async function baixarAutomatico(safras) {
  // Sem porteiro: tenta sempre. Se não houver rede, cada fetch falha
  // sozinho e o catch de dentro cuida — é mais confiável que perguntar ao
  // sistema se há conexão.
  try {
    // Sem worker ainda dá pra guardar a cópia local, que é a rede de
    // segurança que realmente importa — por isso o ready não é obrigatório.
    if (navigator.serviceWorker) await navigator.serviceWorker.ready;
    // Passa pelo worker para as respostas entrarem no cache.
    await fetch('mapas/talhoes.geojson');
    for (const s of (safras || [])) {
      try {
        const r = await fetch('api/mapa-talhoes?safra=' + encodeURIComponent(s.cod_safra));
        const j = await r.json();
        if (j && j.ok && !j.doCache) {
          guardarLocal('dados.' + s.cod_safra, j.data || []);
          try { localStorage.setItem('mapaTalhoes.dadosEm.' + s.cod_safra, new Date().toISOString()); } catch(e) {}
        }
      } catch(e) { /* uma safra que falhe não pode impedir a outra */ }
    }
    guardarLocal('safras', safras || []);
  } catch(e) {
    // Sem worker o mapa continua funcionando online; só não guarda.
  } finally {
    conferirOffline();
  }
}

/** Ladrilhos que cobrem a caixa de um talhão, num nível de zoom. */
function ladrilhosDaCaixa(x1, y1, x2, y2, z) {
  const n = Math.pow(2, z);
  const px = lon => Math.floor((lon + 180) / 360 * n);
  const py = lat => {
    const r = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
  };
  const saida = [];
  for (let x = px(x1); x <= px(x2); x++)
    for (let y = py(y2); y <= py(y1); y++) saida.push([z, x, y]);
  return saida;
}

/** Só os ladrilhos que realmente cobrem talhão — não a região inteira. */
function ladrilhosDosTalhoes() {
  if (!GEO) return [];
  const vistos = new Set(), lista = [];
  GEO.features.forEach(f => {
    const [x1, y1, x2, y2] = caixaDe(f);
    for (let z = ZOOM_MIN_IMAGEM; z <= ZOOM_MAX_IMAGEM; z++) {
      ladrilhosDaCaixa(x1, y1, x2, y2, z).forEach(t => {
        const k = t.join('/');
        if (!vistos.has(k)) { vistos.add(k); lista.push(t); }
      });
    }
  });
  return lista;
}

/**
 * Guarda as imagens de satélite da área dos talhões. Bounded de propósito:
 * só onde há talhão e até o zoom 16 — não é espelhar o acervo do provedor,
 * é guardar a área de trabalho de quem vai a campo.
 */
/**
 * Atualização manual, no comando do usuário: busca os dados da safra e, se
 * ele quiser, guarda as imagens de satélite da área dos talhões.
 *
 * É o único ponto em que a tela pede rede de forma explícita — no resto do
 * tempo ela usa o que tem e não incomoda com aviso de conexão.
 */
async function atualizarTudo() {
  const btnA = document.getElementById('btnImagens');
  const rotuloA = btnA.innerHTML;
  btnA.disabled = true;
  btnA.innerHTML = '🛰<span class="rotulo"> Buscando…</span>';

  // Antes dos dados: se saiu versão nova do app, recarrega e tudo vem com
  // ela. Este é o caminho manual para o iPhone, onde o app fica suspenso e
  // pode não ter recarregado sozinho — e o único caminho para quem está com
  // uma versão antiga demais para conferir a versão por conta própria.
  await conferirVersao(true);

  let dadosOk = false;
  try {
    await carregarSafras();          // lista de safras
    await carregarDados();           // talhões da safra selecionada
    dadosOk = !!Object.keys(DADOS).length;
  } catch(e) {
    dadosOk = false;
  } finally {
    btnA.disabled = false;
    btnA.innerHTML = rotuloA;
  }

  const quando = dataDosDados();
  if (!dadosOk) {
    alert('Não foi possível buscar os dados agora.\n\n' +
          'A tela segue com o que estava guardado' + (quando ? ' (de ' + quando + ')' : '') + '.');
    return;
  }

  const lista = ladrilhosDosTalhoes();
  if (!lista.length) { alert('Dados atualizados.'); return; }
  const mb = Math.round(lista.length * 22 / 1024);
  if (!confirm('Dados atualizados' + (quando ? ' (' + quando + ')' : '') + '.\n\n' +
               'Guardar também as imagens de satélite da área dos talhões?\n' +
               lista.length + ' imagens, cerca de ' + mb + ' MB — de preferência no Wi-Fi.\n' +
               'Com elas o mapa aproxima sem sinal.')) return;

  const btn = document.getElementById('btnOffline');
  const rotulo = btn.innerHTML;
  btn.disabled = true;
  let feitos = 0, falhas = 0;
  const url = ([z, x, y]) =>
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x;

  // Seis por vez: rápido sem sufocar a rede do celular.
  const fila = lista.slice();
  async function trabalhar() {
    while (fila.length) {
      const t = fila.shift();
      try { await fetch(url(t), { mode: 'no-cors' }); } catch(e) { falhas++; }
      if (++feitos % 20 === 0) btn.innerHTML = '⬇<span class="rotulo"> ' + Math.round(feitos * 100 / lista.length) + '%</span>';
    }
  }
  try {
    await Promise.all(Array.from({ length: 6 }, trabalhar));
    alert('Imagens guardadas: ' + (lista.length - falhas) + ' de ' + lista.length +
          (falhas ? '\n\n' + falhas + ' falharam — repita no Wi-Fi para completar.' : ''));
  } finally {
    btn.disabled = false; btn.innerHTML = rotulo;
    conferirOffline();
  }
}

async function prepararOffline() {
  const btn = document.getElementById('btnOffline');
  const rotulo = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    if (!navigator.serviceWorker) throw new Error('Este navegador não guarda páginas para uso offline.');
    await navigator.serviceWorker.register('sw-mapa.js');
    await navigator.serviceWorker.ready;
    await baixarAutomatico(SAFRAS);
    await conferirOffline();
    alert('Pronto. O mapa e os dados desta safra abrem sem sinal — não precisa fazer login no campo.\n\n' +
          'No iPhone, use o Safari e toque em Compartilhar → "Adicionar à Tela de Início". ' +
          'Só assim o iOS mantém o que foi guardado; um atalho comum é apagado depois de alguns dias sem uso.\n\n' +
          'Para o satélite aparecer ao aproximar sem sinal, toque também em 🛰 Imagens.');
  } catch(e) {
    alert('Não foi possível preparar o uso offline: ' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = rotulo;
  }
}

// ── Carga ────────────────────────────────────────────────────────────────
function iniciarMapa() {
  MAPA = L.map('mapa', { preferCanvas: true }).setView([-9.47, -35.85], 11);

  // maxNativeZoom: acima de ZOOM_MAX_IMAGEM o Leaflet reaproveita o ladrilho
  // desse nível, ampliado, em vez de pedir um que não existe no cache. É o
  // que faz o mapa continuar aparecendo ao aproximar sem sinal — fica menos
  // nítido, mas o contorno dos talhões é vetor e continua exato.
  const satelite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 20, maxNativeZoom: ZOOM_MAX_IMAGEM,
      attribution: 'Imagens: Esri, Maxar, Earthstar Geographics' });
  const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 20, maxNativeZoom: 18, attribution: '© OpenStreetMap' });

  // Mover ou aproximar muda o que está à vista, e o rótulo acompanha.
  MAPA.on('moveend zoomend', desenharRotulos);

  satelite.addTo(MAPA);
  L.control.layers({ 'Satélite': satelite, 'Mapa de ruas': ruas }, null, { position: 'topright' }).addTo(MAPA);
  L.control.scale({ imperial: false }).addTo(MAPA);
}

/**
 * Lista de safras e carga da safra selecionada. Extraída da inicialização
 * para o botão 🛰 poder repetir tudo quando o usuário mandar atualizar.
 *
 * Preserva a safra já escolhida: quem estava olhando uma safra antiga não
 * pode ser jogado de volta para a atual só por ter pedido atualização.
 */
// ── Parâmetros gerais (safra padrão e quantas safras aparecem) ───────────
//
// Vêm da Administração, não daqui: qual safra está corrente é assunto da
// empresa, e telas diferentes lendo isso de lugares diferentes é como se
// chega a duas respostas para a mesma pergunta. A cópia local existe porque
// no campo não há rede para consultar — e sem ela a lista abriria diferente
// justamente onde ninguém pode conferir.

const PARAM_PADRAO = { 'safra.padrao': '76', 'safra.quantidade': '4' };
let PARAMETROS = PARAM_PADRAO;

async function carregarParametros() {
  PARAMETROS = Object.assign({}, PARAM_PADRAO, lerLocal('parametros') || {});
  try {
    const r = await fetch('api/parametros', { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.ok || !j.data) return;
    PARAMETROS = Object.assign({}, PARAM_PADRAO, j.data);
    guardarLocal('parametros', j.data);
  } catch(e) { /* sem rede: fica com a última cópia, ou com o padrão */ }
}

/** Quantas safras ficam à escolha. Valor inválido não derruba a tela. */
function quantasSafras() {
  const n = parseInt(PARAMETROS['safra.quantidade'], 10);
  return (n >= 1 && n <= 20) ? n : 4;
}

/**
 * As N safras mais recentes. As antigas somem da lista de vez — com sinal ou
 * sem ele, porque uma lista que muda de tamanho conforme a rede é pior do que
 * uma lista curta.
 */
function recortarSafras(safras) {
  return (safras || [])
    .slice()
    .sort((a, b) => Number(b.cod_safra) - Number(a.cod_safra))
    .slice(0, quantasSafras());
}

/** Safra com que a tela abre: a configurada, se estiver na lista. */
function safraDeAbertura(safras) {
  const padrao = String(PARAMETROS['safra.padrao'] || '').trim();
  if (padrao && safras.some(s => String(s.cod_safra) === padrao)) return padrao;
  return (safras.find(s => s.atual === 'S') || safras[0] || {}).cod_safra;
}

async function carregarSafras() {
  const sel = document.getElementById('selSafra');
  const escolhida = sel.value;
  let safras = null;
  try {
    const r = await fetch('api/mapa-talhoes/safras');
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Consulta recusada');
    safras = j.data || [];
    if (!j.doCache) guardarLocal('safras', safras);
  } catch(e) {
    // Sem a lista, a tela não sabe o que carregar e nada aparece — por isso
    // ela também tem cópia local. O erro só vai à tela se as duas faltarem.
    safras = lerLocal('safras');
    if (!safras || !safras.length) {
      esconderCarregando();
      montarLegenda();
      sel.innerHTML = '<option>—</option>';
      mostrarErro('Não foi possível listar as safras', e);
      return;
    }
  }

  try {
    safras = recortarSafras(safras);
    SAFRAS = safras;
    sel.innerHTML = safras.map(s =>
      `<option value="${esc(s.cod_safra)}">Safra ${esc(s.cod_safra)}${s.atual === 'S' ? ' (atual)' : ''}</option>`).join('');
    const manter = safras.some(s => String(s.cod_safra) === String(escolhida)) ? escolhida : null;
    const alvo = manter || safraDeAbertura(safras);
    if (alvo) { sel.value = alvo; await carregarDados(); }
    else { esconderCarregando(); montarLegenda(); }

    // Sem esperar e sem travar a tela: guarda as safras que estão à escolha.
    baixarAutomatico(safras);
  } catch(e) {
    esconderCarregando();
    montarLegenda();
    mostrarErro('Falha ao montar a lista de safras', e);
  }
}

async function carregarDados() {
  const safra = document.getElementById('selSafra').value;
  if (!safra) return;
  mostrarCarregando('Consultando talhões da safra…');
  try {
    const r = await fetch('api/mapa-talhoes?safra=' + encodeURIComponent(safra));
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Consulta recusada');
    limparErro();
    DADOS = {};
    (j.data || []).forEach(d => { DADOS[d.chave] = d; });
    if (!j.doCache) guardarLocal('dados.' + safra, j.data || []);
    montarLegenda();
    aplicarFiltros();

    // "De quando são estes dados" é a pergunta de quem está no campo sem
    // sinal: sem isso, dado de uma semana atrás parece dado de agora.
    if (j.doCache) {
      // Veio do que estava guardado. Sem aviso na tela — a data da última
      // atualização fica no título do botão 🛰, para quem quiser conferir.
    } else {
      try { localStorage.setItem('mapaTalhoes.dadosEm.' + safra, new Date().toISOString()); } catch(e) {}
      document.getElementById('tarja').classList.remove('on');
    }
    mostrarIdadeDados(safra, j.doCache);
  } catch(e) {
    // Última rede: a cópia local. Só se ela também faltar é que a tela fica
    // sem dado — e aí o motivo aparece escrito.
    const local = lerLocal('dados.' + safra);
    DADOS = {};
    if (local && local.length) {
      local.forEach(d => { DADOS[d.chave] = d; });
      limparErro();
    } else {
      mostrarErro('Não foi possível carregar os talhões da safra ' + safra, e);
    }
    montarLegenda();
    aplicarFiltros();
  } finally {
    esconderCarregando();
  }
}

function mostrarCarregando(txt) {
  document.getElementById('carregandoTxt').textContent = txt;
  document.getElementById('carregando').style.display = 'flex';
}
function esconderCarregando() { document.getElementById('carregando').style.display = 'none'; }

// ── Versão nova publicada no servidor ────────────────────────────────────
//
// No iPhone o app instalado na tela de início não recarrega quando é
// reaberto: o iOS suspende a página e devolve o mesmo contexto de volta. Não
// há navegação, não há requisição, e o deploy feito ontem nunca chega em quem
// deixou o app aberto — e ninguém fecha app de celular. Era isso que fazia a
// tela continuar velha por dias depois de publicar.
//
// A conferência é um HEAD no próprio HTML. Requisição que não é GET passa
// direto pelo service worker (ele só trata GET), então o Last-Modified vem do
// servidor sem cache no caminho — e sem precisar de número de versão escrito
// à mão em lugar nenhum, já que o arquivo muda de data a cada deploy.

let VERSAO_TELA = null;          // marca do HTML com que esta tela está rodando
let ULTIMA_CONFERIDA = 0;

/** Marca da versão publicada agora, ou null se não deu para saber. */
async function versaoPublicada() {
  try {
    const r = await fetch('mapa-talhoes.html', { method: 'HEAD', cache: 'no-store' });
    // redirected = sessão caiu e veio o login; a data seria a do login.html
    if (!r.ok || r.redirected) return null;
    const lm = r.headers.get('Last-Modified');
    if (lm) { const d = new Date(lm); if (!isNaN(d)) return { texto: lm, ms: d.getTime() }; }
    const et = r.headers.get('ETag');
    return et ? { texto: et, ms: null } : null;
  } catch(e) { return null; }    // sem rede: segue com o que está na tela
}

/** Data do HTML que o navegador de fato carregou (vale para o do cache). */
function versaoDaTelaCarregada() {
  const d = new Date(document.lastModified);
  return isNaN(d) ? null : d.getTime();
}

function recarregarPorVersaoNova(marca) {
  // Uma vez por versão. Se algo impedir a tela nova de subir, é melhor ficar
  // na antiga do que entrar em ciclo de recarregamento no meio do talhão.
  try {
    if (sessionStorage.getItem('mapaTalhoes.recarregouPara') === marca) return;
    sessionStorage.setItem('mapaTalhoes.recarregouPara', marca);
  } catch(e) {}
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistration()
      .then(reg => reg && reg.update())
      .catch(() => {})
      .then(() => location.reload());
    return;
  }
  location.reload();
}

async function conferirVersao(forcar) {
  const agora = Date.now();
  if (!forcar && agora - ULTIMA_CONFERIDA < 10000) return;
  ULTIMA_CONFERIDA = agora;

  // Gravando trilha, ninguém recarrega a tela por baixo da pessoa. A checagem
  // volta a valer quando ela parar — e é justamente durante a gravação que
  // uma recarga seria mais cara.
  if (TRILHA) return;

  const v = await versaoPublicada();
  if (!v) return;

  if (VERSAO_TELA === null) {
    // Primeira conferência: além de guardar a marca, dá para pegar o caso de
    // a tela ter aberto com HTML velho vindo do cache.
    const daTela = versaoDaTelaCarregada();
    VERSAO_TELA = v.texto;
    if (daTela && v.ms && v.ms - daTela > 2000) recarregarPorVersaoNova(v.texto);
    return;
  }
  if (v.texto !== VERSAO_TELA) recarregarPorVersaoNova(v.texto);
}

// Voltar para o app é o momento em que a versão velha aparece — e no iOS é o
// único, porque não houve navegação nenhuma no meio.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') aoVoltar();
});
window.addEventListener('pageshow', e => { if (e.persisted) aoVoltar(true); });
window.addEventListener('focus', () => aoVoltar());
// Reencontrar rede é o melhor momento para tentar de novo: o aparelho saiu
// da área e voltou, que é exatamente o percurso de quem grava no campo.
window.addEventListener('online', () => enviarPendentes());

/**
 * Volta ao primeiro plano.
 *
 * Sobe as trilhas ANTES de conferir a versão, porque conferir a versão pode
 * recarregar a página — e uma recarga no meio do envio deixaria a trilha
 * pendente de novo, que é o problema que se está resolvendo.
 */
async function aoVoltar(forcar) {
  try { await enviarPendentes(); } catch(e) {}
  conferirVersao(forcar);
}

(async function iniciar() {
  iniciarMapa();

  // Trilhas antes de tudo: são dados do próprio aparelho, aparecem na hora e
  // não dependem de rede nem do desenho dos talhões ter carregado.
  recuperarRascunho();
  renderTrilhas();
  // Registro silencioso: quem já abriu a tela uma vez com sinal passa a ter
  // a casca guardada, mesmo sem clicar em "Offline".
  // "'serviceWorker' in navigator" não basta: no Safari em navegação privada
  // e em contexto não seguro a propriedade existe valendo undefined, e o
  // .register estoura. Como isto roda dentro da função async de início, um
  // throw aqui abortava todo o resto — mapa em "Carregando…" para sempre.
  try {
    if (navigator.serviceWorker) {
      // Já havia um worker no comando? Então uma troca de controlador
      // significa versão nova, e a tela precisa recarregar para usá-la. Sem
      // esse guarda, a primeira instalação (que também troca o controlador)
      // recarregaria à toa.
      const jaControlado = !!navigator.serviceWorker.controller;
      let recarregando = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!jaControlado || recarregando) return;
        recarregando = true;
        location.reload();
      });

      // updateViaCache 'none': o próprio sw-mapa.js não pode vir do cache do
      // navegador, senão uma versão nova pode demorar até 24h para ser vista.
      navigator.serviceWorker.register('sw-mapa.js', { updateViaCache: 'none' })
        .then(reg => {
          reg.update().catch(() => {});
          return navigator.serviceWorker.ready;
        })
        .then(() => conferirOffline())
        .catch(() => conferirOffline());
    } else {
      conferirOffline();
    }
  } catch(e) {
    conferirOffline();
  }

  // 1. Geometria (estática, do shapefile da topografia)
  //
  // É 1,2 MB e é a única coisa sem a qual a tela não existe — sem o desenho
  // não há mapa. Por isso três tentativas antes de desistir: uma falha de
  // rede aqui apagava a tela inteira, e tentar de novo custa segundos contra
  // um "Load failed" que não deixa nada na mão de quem está no campo.
  mostrarCarregando('Carregando o desenho dos talhões…');
  let erroGeo = null;
  for (let tentativa = 1; tentativa <= 3 && !GEO; tentativa++) {
    try {
      if (tentativa > 1) {
        mostrarCarregando('Carregando o desenho dos talhões… (tentativa ' + tentativa + ' de 3)');
        await new Promise(r => setTimeout(r, tentativa * 1500));
      }
      const r = await fetch('mapas/talhoes.geojson');
      if (!r.ok) throw new Error('o servidor respondeu ' + r.status);
      const j = await r.json();
      if (!j || !Array.isArray(j.features)) throw new Error('arquivo incompleto');
      GEO = j;
    } catch(e) {
      erroGeo = e;
    }
  }
  if (!GEO) {
    esconderCarregando();
    mostrarErro('Não foi possível carregar o desenho dos talhões', erroGeo);
    return;
  }

  CAMADA = L.geoJSON(GEO, {
    style: estilo,
    onEachFeature: (f, camada) => {
      camada.bindPopup(() => conteudoPopup(f.properties), { maxWidth: 320 });
      camada.on('mouseover', e => e.target.setStyle({ weight: 3 }));
      camada.on('mouseout',  e => CAMADA.resetStyle(e.target));
    }
  }).addTo(MAPA);
  enquadrarTudo();

  // 2. Safras + dados do ERP. Os parâmetros vêm antes porque decidem quais
  // safras entram na lista e com qual delas a tela abre.
  await carregarParametros();
  await carregarSafras();

  // 3. Trilhas com o servidor. Depois do resto de propósito: sobe o que ficou
  // pendente e traz o que foi gravado em outro aparelho. Falhar aqui é normal
  // — sem rede, a lista local já está na tela desde o início.
  // Um depois do outro: os dois mexem na mesma lista do localStorage, e em
  // paralelo a última gravação apagaria o resultado da outra.
  await enviarPendentes();
  await baixarTrilhas();

  // 4. Marca da versão publicada, para reconhecer o deploy que vier depois.
  conferirVersao(true);
})();
</script>
