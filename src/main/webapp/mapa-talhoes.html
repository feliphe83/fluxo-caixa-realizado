<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Talhões · Usina Santa Clotilde</title>
<link rel="stylesheet" href="css/leaflet.css">
<link rel="manifest" href="mapa-talhoes.webmanifest">
<!-- O iOS ignora os ícones do manifest ao "Adicionar à Tela de Início":
     sem apple-touch-icon ele usa uma captura da própria tela como ícone. -->
<link rel="apple-touch-icon" href="img/mapa-talhoes-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/mapa-talhoes-192.png">
<meta name="apple-mobile-web-app-title" content="Talhões">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16342a">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Slots categóricos na ordem canônica, atribuídos por cod_situacao —
       a cor segue a identidade da situação, nunca a ordem em que ela
       aparece na tela. Verde e vermelho não são usados aqui: seriam lidos
       como "bom/ruim", e situação de talhão não tem esse juízo. */
    --sit-1: #2a78d6;   /* Colheita   */
    --sit-2: #eb6834;   /* Reforma    */
    --sit-3: #1baf7a;   /* Expansão   */
    --sit-4: #eda100;   /* Pousio     */
    --sit-5: #e87ba4;   /* Improdutivo*/
    --sit-0: #98a2b3;   /* sem cadastro na safra */
    --ink: #0f2460;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; background: #f4f6fb; color: #1a1a2e;
  }

  .header {
    background: linear-gradient(135deg, #16342a 0%, #234f3b 100%);
    color: white; padding: 12px 20px; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; flex-wrap: wrap; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .header-logo { width: 38px; height: 38px; border-radius: 8px; background: white;
                 display: flex; align-items: center; justify-content: center; padding: 4px; flex-shrink: 0; }
  .header-logo img { width: 100%; height: 100%; object-fit: contain; }
  .header-title { font-size: 17px; font-weight: 800; }
  .header-sub { font-size: 11.5px; opacity: .85; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .header select, .header input {
    padding: 6px 10px; border-radius: 7px; border: 1.5px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.12); color: white; font-size: 12px; outline: none;
  }
  .header select option { color: #1a1a2e; }
  .header input::placeholder { color: rgba(255,255,255,.6); }
  .btn-topo {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px;
    border: 1.5px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.9); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-topo:hover { background: rgba(255,255,255,.22); }

  .corpo { flex: 1; display: flex; min-height: 0; }
  #mapa { flex: 1; min-width: 0; background: #dfe6f2; }

  /* ── Painel lateral ── */
  .painel {
    width: 300px; flex-shrink: 0; background: white; border-left: 1px solid #e3e8f5;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .painel h3 {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    color: #64748b; padding: 14px 16px 8px;
  }
  .legenda-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer;
    border-left: 3px solid transparent; font-size: 13px;
  }
  .legenda-item:hover { background: #f5f7fb; }
  .legenda-item.oculta { opacity: .38; }
  .legenda-item.oculta .nome { text-decoration: line-through; }
  .caixa { width: 15px; height: 15px; border-radius: 4px; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,.25); }
  .legenda-item .nome { font-weight: 600; color: var(--ink); flex: 1; }
  .legenda-item .qtde { font-size: 11.5px; color: #64748b; text-align: right; font-variant-numeric: tabular-nums; }

  .resumo { padding: 10px 16px 16px; border-top: 1px solid #eef1f8; margin-top: 6px; }
  .resumo .linha { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; color: #475569; }
  .resumo .linha b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .aviso {
    margin: 10px 16px; padding: 10px 12px; border-radius: 8px; font-size: 11.5px; line-height: 1.5;
    background: #fffaf0; border-left: 3px solid #eda100; color: #52514e;
  }

  /* ── Popup ── */
  .leaflet-popup-content { margin: 12px 14px; min-width: 240px; }
  .pop-tit { font-size: 14px; font-weight: 800; color: var(--ink); }
  .pop-faz { font-size: 11.5px; color: #64748b; margin-bottom: 8px; }
  .pop-sit { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
             padding: 3px 9px; border-radius: 999px; color: white; margin-bottom: 9px; }
  .pop-tab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .pop-tab td { padding: 3px 0; }
  .pop-tab td:first-child { color: #64748b; padding-right: 12px; white-space: nowrap; }
  .pop-tab td:last-child { text-align: right; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pop-vazio { font-size: 12px; color: #94a0b8; font-style: italic; }

  .carregando {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(244,246,251,.92); z-index: 1000; font-size: 13px; color: #475569; flex-direction: column; gap: 10px;
  }
  .spinner { width: 28px; height: 28px; border: 3px solid #e3e8f5; border-top-color: #1a3a7c;
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Onde estou: cartão fixo do talhão sob o GPS ── */
  .cartao-gps {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 900;
    background: white; border-radius: 12px; box-shadow: 0 6px 24px rgba(15,36,96,.22);
    padding: 12px 14px; display: none; max-width: 420px;
  }
  .cartao-gps.on { display: block; }
  .cartao-gps .fechar { position: absolute; top: 8px; right: 10px; border: none; background: none;
                        font-size: 18px; color: #94a0b8; cursor: pointer; line-height: 1; }
  .cartao-gps .rot { font-size: 10px; font-weight: 700; text-transform: uppercase;
                     letter-spacing: .5px; color: #64748b; }
  .cartao-gps .fora { font-size: 13px; color: #52514e; margin-top: 4px; }

  /* Estado da conexão e do GPS */
  .tarja {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 900;
    background: #fffaf0; border: 1.5px solid #eda100; color: #52514e;
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
    display: none; white-space: nowrap; box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .tarja.on { display: block; }
  .btn-topo.ativo { background: white; color: #16342a; border-color: white; }

  .marca-eu {
    width: 18px; height: 18px; border-radius: 50%; background: #2a78d6;
    border: 3px solid white; box-shadow: 0 0 0 1px rgba(0,0,0,.3);
  }

  /* No celular o cabeçalho vira duas faixas: identificação em cima, e os
     controles embaixo ocupando a largura toda. Antes, .header-right não
     quebrava linha e os botões da direita saíam da tela. */
  @media (max-width: 820px) {
    .corpo { flex-direction: column; }
    .painel { width: 100%; max-height: 40vh; border-left: none; border-top: 1px solid #e3e8f5; }

    .header { padding: 10px 12px; gap: 10px; }
    .header-left { width: 100%; }
    .header-right { width: 100%; justify-content: flex-start; gap: 6px; }
    .header select { flex: 0 0 auto; }
    .header input[type="search"] { flex: 1 1 130px; min-width: 0; width: auto !important; }
    .btn-topo { padding: 7px 10px; font-size: 12px; }
  }

  /* Telas estreitas: os rótulos dão lugar aos ícones, que já dizem o que é.
     O title continua descrevendo cada botão para quem tocar e segurar. */
  @media (max-width: 560px) {
    .header-title { font-size: 15px; }
    .header-sub { display: none; }
    .btn-topo { padding: 7px 9px; }
    .btn-topo .rotulo { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="img/logo.png" alt="USC"></div>
    <div>
      <div class="header-title">Mapa de Talhões</div>
      <div class="header-sub">Situação atual por talhão · clique para ver os detalhes</div>
    </div>
  </div>
  <div class="header-right">
    <select id="selSafra" onchange="carregarDados()"><option>…</option></select>
    <input type="search" id="busca" placeholder="Buscar talhão ou fazenda…" oninput="aplicarFiltros()" style="width:190px">
    <button class="btn-topo" id="btnGps" onclick="alternarGps()" title="Mostrar minha posição">📍<span class="rotulo"> Onde estou</span></button>
    <button class="btn-topo" id="btnOffline" onclick="prepararOffline()"
            title="O mapa é guardado sozinho sempre que há rede. Toque para atualizar agora.">⬇<span class="rotulo"> Offline</span></button>
    <button class="btn-topo" id="btnImagens" onclick="baixarImagens()"
            title="Guardar as imagens de satélite da área dos talhões, no Wi-Fi">🛰<span class="rotulo"> Imagens</span></button>
    <button class="btn-topo" onclick="enquadrarTudo()" title="Enquadrar todos os talhões">⤢<span class="rotulo"> Ver tudo</span></button>
    <button class="btn-topo" onclick="window.location.href='hub.html'" title="Voltar ao Hub">←<span class="rotulo"> Hub</span></button>
  </div>
</div>

<div class="corpo">
  <div id="mapa" style="position:relative">
    <div class="carregando" id="carregando"><div class="spinner"></div><span id="carregandoTxt">Carregando mapa…</span></div>
    <div class="tarja" id="tarja"></div>
    <div class="tarja" id="tarjaErro" style="background:#fef2f2;border-color:#d03b3b;color:#991b1b;
         max-width:min(560px,92%);white-space:normal;text-align:center;line-height:1.45"></div>
    <div class="cartao-gps" id="cartaoGps">
      <button class="fechar" onclick="fecharCartao()">×</button>
      <div class="rot">Você está em</div>
      <div id="cartaoConteudo"></div>
    </div>
  </div>
  <div class="painel">
    <h3>Situação do talhão</h3>
    <div id="legenda"></div>
    <div class="resumo" id="resumo"></div>
  </div>
</div>

<script src="js/leaflet.js"></script>
<script>
// ── Situações (agricola.situacao_talhao) ─────────────────────────────────
// A cor é atribuída pelo CÓDIGO, não pela ordem de exibição: filtrar ou
// reordenar a legenda não pode repintar os talhões que continuam na tela.
const SITUACOES = {
  1: { nome: 'Colheita',    cor: '#2a78d6' },
  2: { nome: 'Reforma',     cor: '#eb6834' },
  3: { nome: 'Expansão',    cor: '#1baf7a' },
  4: { nome: 'Pousio',      cor: '#eda100' },
  5: { nome: 'Improdutivo', cor: '#e87ba4' }
};
const SEM_DADOS = { nome: 'Sem cadastro na safra', cor: '#98a2b3' };

let MAPA, CAMADA, GEO = null, DADOS = {}, OCULTAS = new Set();
let GPS = null, MARCA_EU = null, CIRCULO_EU = null, TALHAO_ATUAL = null, SEGUINDO = true;
let SAFRAS = [];

/** Nível mais fundo de imagem guardado; acima disso o Leaflet amplia. */
const ZOOM_MAX_IMAGEM = 16;
const ZOOM_MIN_IMAGEM = 12;

const fmtNum = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = v => (Number(v) || 0).toLocaleString('pt-BR');
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function situacaoDe(chave) {
  const d = DADOS[chave];
  if (!d || d.cod_situacao == null) return { cod: 0, ...SEM_DADOS };
  const s = SITUACOES[d.cod_situacao];
  return s ? { cod: Number(d.cod_situacao), nome: d.desc_situacao || s.nome, cor: s.cor }
           : { cod: Number(d.cod_situacao), nome: d.desc_situacao || ('Situação ' + d.cod_situacao), cor: SEM_DADOS.cor };
}

function estilo(feature) {
  const s = situacaoDe(feature.properties.chave);
  const escondido = OCULTAS.has(s.cod) || !passaBusca(feature);
  return {
    color: '#ffffff', weight: 1, opacity: escondido ? 0 : .9,
    fillColor: s.cor, fillOpacity: escondido ? 0 : .68,
    interactive: !escondido
  };
}

function passaBusca(feature) {
  const termo = (document.getElementById('busca').value || '').trim().toLowerCase();
  if (!termo) return true;
  const p = feature.properties;
  const d = DADOS[p.chave] || {};
  return [p.chave, p.nomeFazenda, d.desc_fazenda, d.desc_variedade, 'talhão ' + p.talhao]
    .some(v => String(v || '').toLowerCase().includes(termo));
}

// ── Popup ────────────────────────────────────────────────────────────────
function conteudoPopup(p) {
  const d = DADOS[p.chave];
  const s = situacaoDe(p.chave);
  const linha = (rot, val) => val == null || val === '' ? ''
      : `<tr><td>${rot}</td><td>${esc(val)}</td></tr>`;

  const corpo = !d
    ? `<div class="pop-vazio">Sem cadastro para este talhão na safra selecionada.</div>
       <table class="pop-tab">${linha('Área (mapa)', fmtNum(p.areaShape) + ' ha')}</table>`
    : `<table class="pop-tab">
         ${linha('TCH estimado', d.tch_estimado ? fmtNum(d.tch_estimado) + ' t/ha' : null)}
         ${linha('Variedade', d.desc_variedade)}
         ${linha('Idade', d.desc_idade || (d.numerocorte != null ? d.numerocorte + 'º corte' : null))}
         ${linha('Área de produção', d.areaproducao ? fmtNum(d.areaproducao) + ' ha' : null)}
         ${linha('Área plantada', d.areaplantada ? fmtNum(d.areaplantada) + ' ha' : null)}
         ${linha('Área (mapa)', fmtNum(p.areaShape) + ' ha')}
         ${linha('Último corte', formatarData(d.data_ultimo_corte))}
       </table>`;

  return `
    <div class="pop-tit">Talhão ${esc(p.talhao)} <span style="font-weight:400;color:#94a0b8">· zona ${esc(p.zona)}</span></div>
    <div class="pop-faz">${esc((d && d.desc_fazenda) || p.nomeFazenda || 'Fazenda ' + p.fazenda)}</div>
    <div class="pop-sit" style="background:${s.cor}">${esc(s.nome)}</div>
    ${corpo}`;
}

function formatarData(v) {
  if (!v) return null;
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v);
}

// ── Legenda e resumo ─────────────────────────────────────────────────────
function montarLegenda() {
  const cont = {}, area = {};
  GEO.features.forEach(f => {
    const s = situacaoDe(f.properties.chave);
    cont[s.cod] = (cont[s.cod] || 0) + 1;
    area[s.cod] = (area[s.cod] || 0) + (Number(f.properties.areaShape) || 0);
  });

  const ordem = Object.keys(SITUACOES).map(Number).filter(c => cont[c]);
  if (cont[0]) ordem.push(0);

  document.getElementById('legenda').innerHTML = ordem.map(cod => {
    const s = cod === 0 ? SEM_DADOS : SITUACOES[cod];
    return `<div class="legenda-item ${OCULTAS.has(cod) ? 'oculta' : ''}" onclick="alternarSituacao(${cod})"
                 title="Clique para mostrar ou esconder">
              <span class="caixa" style="background:${s.cor}"></span>
              <span class="nome">${esc(s.nome)}</span>
              <span class="qtde">${fmtInt(cont[cod])} talh.<br>${fmtNum(area[cod])} ha</span>
            </div>`;
  }).join('');

  const totalArea = GEO.features.reduce((a, f) => a + (Number(f.properties.areaShape) || 0), 0);
  document.getElementById('resumo').innerHTML =
    `<div class="linha"><span>Área total</span><b>${fmtNum(totalArea)} ha</b></div>`;
}

function alternarSituacao(cod) {
  if (OCULTAS.has(cod)) OCULTAS.delete(cod); else OCULTAS.add(cod);
  montarLegenda();
  aplicarFiltros();
}

function aplicarFiltros() {
  if (CAMADA) CAMADA.setStyle(estilo);
}

function enquadrarTudo() {
  if (CAMADA) MAPA.fitBounds(CAMADA.getBounds(), { padding: [20, 20] });
}

// ── Em qual talhão eu estou ──────────────────────────────────────────────
// Raio horizontal: conta quantas vezes a semirreta que sai do ponto cruza o
// anel. Ímpar = dentro. Coordenadas em grau servem direto — o teste é
// topológico, não métrico.
function pontoEmAnel(lng, lat, anel) {
  let dentro = false;
  for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) {
    const xi = anel[i][0], yi = anel[i][1], xj = anel[j][0], yj = anel[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) dentro = !dentro;
  }
  return dentro;
}

function pontoEmGeometria(lng, lat, geom) {
  const poligonos = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  for (const pol of poligonos) {
    if (!pontoEmAnel(lng, lat, pol[0])) continue;        // fora do contorno
    let emBuraco = false;                                 // anéis seguintes são furos
    for (let i = 1; i < pol.length; i++) {
      if (pontoEmAnel(lng, lat, pol[i])) { emBuraco = true; break; }
    }
    if (!emBuraco) return true;
  }
  return false;
}

/** Caixa envolvente pré-calculada: descarta quase tudo antes do teste caro. */
function caixaDe(f) {
  if (f._caixa) return f._caixa;
  let x1 = 180, y1 = 90, x2 = -180, y2 = -90;
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  polys.forEach(pol => pol[0].forEach(c => {
    if (c[0] < x1) x1 = c[0]; if (c[0] > x2) x2 = c[0];
    if (c[1] < y1) y1 = c[1]; if (c[1] > y2) y2 = c[1];
  }));
  f._caixa = [x1, y1, x2, y2];
  return f._caixa;
}

function talhaoEm(lng, lat) {
  if (!GEO) return null;
  for (const f of GEO.features) {
    const [x1, y1, x2, y2] = caixaDe(f);
    if (lng < x1 || lng > x2 || lat < y1 || lat > y2) continue;
    if (pontoEmGeometria(lng, lat, f.geometry)) return f;
  }
  return null;
}

// ── GPS ──────────────────────────────────────────────────────────────────
function alternarGps() {
  if (GPS) { pararGps(); return; }
  if (!navigator.geolocation) { alert('Este aparelho não informa a localização.'); return; }
  // Navegadores só liberam a posição em HTTPS (ou localhost).
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    alert('A localização só funciona em HTTPS. Abra a intranet pelo endereço https://.');
    return;
  }
  document.getElementById('btnGps').classList.add('ativo');
  SEGUINDO = true;
  // Zera para o cartão ser montado na primeira leitura, mesmo que a pessoa
  // já esteja no mesmo talhão de antes — quem toca no botão quer ver a
  // informação agora, não só quando mudar de talhão.
  TALHAO_ATUAL = undefined;
  GPS = navigator.geolocation.watchPosition(aoPosicionar, erroGps,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  // Arrastar o mapa desliga o "seguir", senão a tela briga com o usuário.
  MAPA.on('dragstart', () => { SEGUINDO = false; });
}

function pararGps() {
  if (GPS !== null) navigator.geolocation.clearWatch(GPS);
  GPS = null; TALHAO_ATUAL = null;
  document.getElementById('btnGps').classList.remove('ativo');
  if (MARCA_EU) { MAPA.removeLayer(MARCA_EU); MARCA_EU = null; }
  if (CIRCULO_EU) { MAPA.removeLayer(CIRCULO_EU); CIRCULO_EU = null; }
  fecharCartao();
}

function erroGps(e) {
  pararGps();
  alert(e.code === 1 ? 'Permissão de localização negada. Libere no navegador para usar "Onde estou".'
                     : 'Não foi possível obter a localização: ' + e.message);
}

function aoPosicionar(pos) {
  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  const precisao = pos.coords.accuracy || 0;
  const p = [lat, lng];

  if (!MARCA_EU) {
    MARCA_EU = L.marker(p, { icon: L.divIcon({ className: '', html: '<div class="marca-eu"></div>',
                             iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 1000 }).addTo(MAPA);
    CIRCULO_EU = L.circle(p, { radius: precisao, color: '#2a78d6', weight: 1,
                               fillColor: '#2a78d6', fillOpacity: .12 }).addTo(MAPA);
  } else {
    MARCA_EU.setLatLng(p);
    CIRCULO_EU.setLatLng(p).setRadius(precisao);
  }
  if (SEGUINDO) MAPA.setView(p, Math.max(MAPA.getZoom(), 16));

  const f = talhaoEm(lng, lat);
  const chave = f ? f.properties.chave : null;
  if (chave !== TALHAO_ATUAL) {          // só redesenha ao mudar de talhão
    TALHAO_ATUAL = chave;
    mostrarCartao(f, precisao);
  }
}

function mostrarCartao(f, precisao) {
  const cartao = document.getElementById('cartaoGps');
  const alvo = document.getElementById('cartaoConteudo');
  if (!f) {
    alvo.innerHTML = `<div class="fora">Fora dos talhões mapeados${
      precisao ? ' · precisão de ' + Math.round(precisao) + ' m' : ''}</div>`;
  } else {
    alvo.innerHTML = conteudoPopup(f.properties) +
      (precisao > 25 ? `<div class="fora" style="margin-top:6px">Precisão do GPS: ${Math.round(precisao)} m — pode estar no talhão vizinho.</div>` : '');
  }
  cartao.classList.add('on');
}

function fecharCartao() { document.getElementById('cartaoGps').classList.remove('on'); }

// ── Offline ──────────────────────────────────────────────────────────────
/** Falha do ERP fica na tela, não num alerta que se fecha e some. */
function mostrarErro(onde, e) {
  const t = document.getElementById('tarjaErro');
  t.innerHTML = '<b>' + onde + '</b><br>' + esc(e && e.message ? e.message : String(e));
  t.classList.add('on');
  console.error('[mapa-talhoes] ' + onde, e);
}
function limparErro() { document.getElementById('tarjaErro').classList.remove('on'); }

function marcarTarja(txto) {
  const t = document.getElementById('tarja');
  t.textContent = txto;
  t.classList.add('on');
}

/**
 * Cópia dos dados no localStorage, além do cache do service worker.
 *
 * São duas redes de segurança de propósito: o Cache API pode ser descartado
 * pelo navegador (o iOS é agressivo com isso), e o worker só responde se a
 * requisição passar por ele. O localStorage sobrevive aos dois casos, e é
 * ele que garante que a tela abre com dado no meio do talhão.
 */
function guardarLocal(chave, valor) {
  try { localStorage.setItem('mapaTalhoes.' + chave, JSON.stringify(valor)); return true; }
  catch(e) { return false; }   // cota estourada: segue sem a cópia
}
function lerLocal(chave) {
  try {
    const v = localStorage.getItem('mapaTalhoes.' + chave);
    return v ? JSON.parse(v) : null;
  } catch(e) { return null; }
}

/** Quando esta safra foi consultada pela última vez com sinal. */
function dataDosDados(safra) {
  safra = safra || document.getElementById('selSafra').value;
  let iso = null;
  try { iso = localStorage.getItem('mapaTalhoes.dadosEm.' + safra); } catch(e) {}
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth()+1) + ' às ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/** A idade do dado agora vive no título do botão e na tarja, não no painel. */
function mostrarIdadeDados(safra, doCache) {
  const quando = dataDosDados(safra);
  if (doCache) marcarTarja('Sem conexão — dados de ' + (quando || 'uma consulta anterior'));
}

/**
 * navigator.onLine NÃO decide nada aqui.
 *
 * Em app instalado no iOS ele mente com frequência: fica falso com 5G
 * ligado, e aí a tela se declarava offline e o download automático nem
 * tentava. Quem diz se há rede é a requisição: se ela volta, há; se falha,
 * não há. A tarja passa a ser consequência do que aconteceu de fato, não
 * de um palpite do sistema.
 */
function avisarSemConexao(safra) {
  marcarTarja('Sem conexão — dados de ' + (dataDosDados(safra) || 'uma consulta anterior'));
}

/** Voltar para o app é o momento natural de buscar dado novo: em modo
 *  aplicativo a página costuma ser retomada, não recarregada. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const safra = document.getElementById('selSafra').value;
  if (safra) carregarDados();
  // Em modo aplicativo a página é retomada, não recarregada — então é aqui
  // que se pergunta ao navegador se há versão nova do app.
  try {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistration()
        .then(reg => reg && reg.update())
        .catch(() => {});
    }
  } catch(e) {}
});
window.addEventListener('online', () => {
  const safra = document.getElementById('selSafra').value;
  if (safra) carregarDados();
});

/**
 * Diz, com sinal ainda, se a tela realmente abre sem ele.
 *
 * Não basta o worker estar registrado: o que decide é a PÁGINA estar no
 * cache. Um atalho criado a partir do login ou do hub abre uma tela que
 * nunca foi guardada — e a falha só aparece no meio do talhão, quando não
 * há como corrigir.
 */
/**
 * Diz, no próprio botão, se a tela já abre sem sinal. O que decide não é o
 * worker estar registrado, e sim a PÁGINA e o desenho estarem no cache — um
 * atalho criado a partir do login abre uma tela que nunca foi guardada, e a
 * falha só apareceria no meio do talhão.
 */
async function conferirOffline() {
  const btn = document.getElementById('btnOffline');
  let pronto = false;
  try {
    const c = await caches.open('mapa-talhoes-v2-casca');
    pronto = !!(await c.match('mapa-talhoes.html')) && !!(await c.match('mapas/talhoes.geojson'));
  } catch(e) { pronto = false; }

  if (!btn) return pronto;
  const quando = dataDosDados();
  btn.innerHTML = (pronto ? '✔' : '⬇') + '<span class="rotulo"> Offline</span>';
  btn.classList.toggle('ativo', pronto);
  btn.title = pronto
    ? 'Funciona sem sinal' + (quando ? ' · dados de ' + quando : '') + '. Toque para atualizar agora.'
    : 'Ainda não funciona sem sinal — toque para guardar agora.';
  return pronto;
}

/**
 * Guarda tudo sozinho quando há rede: o desenho dos talhões e os dados das
 * duas safras mais recentes. Sem depender de alguém lembrar de apertar um
 * botão antes de sair — que é justamente o que não acontece na correria.
 */
async function baixarAutomatico(safras) {
  // Sem porteiro: tenta sempre. Se não houver rede, cada fetch falha
  // sozinho e o catch de dentro cuida — é mais confiável que perguntar ao
  // sistema se há conexão.
  try {
    // Sem worker ainda dá pra guardar a cópia local, que é a rede de
    // segurança que realmente importa — por isso o ready não é obrigatório.
    if (navigator.serviceWorker) await navigator.serviceWorker.ready;
    // Passa pelo worker para as respostas entrarem no cache.
    await fetch('mapas/talhoes.geojson');
    for (const s of (safras || []).slice(0, 2)) {
      try {
        const r = await fetch('api/mapa-talhoes?safra=' + encodeURIComponent(s.cod_safra));
        const j = await r.json();
        if (j && j.ok && !j.doCache) {
          guardarLocal('dados.' + s.cod_safra, j.data || []);
          try { localStorage.setItem('mapaTalhoes.dadosEm.' + s.cod_safra, new Date().toISOString()); } catch(e) {}
        }
      } catch(e) { /* uma safra que falhe não pode impedir a outra */ }
    }
    guardarLocal('safras', safras || []);
  } catch(e) {
    // Sem worker o mapa continua funcionando online; só não guarda.
  } finally {
    conferirOffline();
  }
}

/** Ladrilhos que cobrem a caixa de um talhão, num nível de zoom. */
function ladrilhosDaCaixa(x1, y1, x2, y2, z) {
  const n = Math.pow(2, z);
  const px = lon => Math.floor((lon + 180) / 360 * n);
  const py = lat => {
    const r = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
  };
  const saida = [];
  for (let x = px(x1); x <= px(x2); x++)
    for (let y = py(y2); y <= py(y1); y++) saida.push([z, x, y]);
  return saida;
}

/** Só os ladrilhos que realmente cobrem talhão — não a região inteira. */
function ladrilhosDosTalhoes() {
  if (!GEO) return [];
  const vistos = new Set(), lista = [];
  GEO.features.forEach(f => {
    const [x1, y1, x2, y2] = caixaDe(f);
    for (let z = ZOOM_MIN_IMAGEM; z <= ZOOM_MAX_IMAGEM; z++) {
      ladrilhosDaCaixa(x1, y1, x2, y2, z).forEach(t => {
        const k = t.join('/');
        if (!vistos.has(k)) { vistos.add(k); lista.push(t); }
      });
    }
  });
  return lista;
}

/**
 * Guarda as imagens de satélite da área dos talhões. Bounded de propósito:
 * só onde há talhão e até o zoom 16 — não é espelhar o acervo do provedor,
 * é guardar a área de trabalho de quem vai a campo.
 */
async function baixarImagens() {
  const lista = ladrilhosDosTalhoes();
  if (!lista.length) { alert('Carregue o mapa antes de baixar as imagens.'); return; }
  const mb = Math.round(lista.length * 22 / 1024);
  if (!confirm('Baixar as imagens de satélite da área dos talhões?\n\n' +
               lista.length + ' imagens, cerca de ' + mb + ' MB.\n' +
               'Faça isso no Wi-Fi. Depois o mapa aproxima sem sinal.')) return;

  const btn = document.getElementById('btnOffline');
  const rotulo = btn.innerHTML;
  btn.disabled = true;
  let feitos = 0, falhas = 0;
  const url = ([z, x, y]) =>
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x;

  // Seis por vez: rápido sem sufocar a rede do celular.
  const fila = lista.slice();
  async function trabalhar() {
    while (fila.length) {
      const t = fila.shift();
      try { await fetch(url(t), { mode: 'no-cors' }); } catch(e) { falhas++; }
      if (++feitos % 20 === 0) btn.innerHTML = '⬇<span class="rotulo"> ' + Math.round(feitos * 100 / lista.length) + '%</span>';
    }
  }
  try {
    await Promise.all(Array.from({ length: 6 }, trabalhar));
    alert('Imagens guardadas: ' + (lista.length - falhas) + ' de ' + lista.length +
          (falhas ? '\n\n' + falhas + ' falharam — repita no Wi-Fi para completar.' : ''));
  } finally {
    btn.disabled = false; btn.innerHTML = rotulo;
    conferirOffline();
  }
}

async function prepararOffline() {
  const btn = document.getElementById('btnOffline');
  const rotulo = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    if (!navigator.serviceWorker) throw new Error('Este navegador não guarda páginas para uso offline.');
    await navigator.serviceWorker.register('sw-mapa.js');
    await navigator.serviceWorker.ready;
    await baixarAutomatico(SAFRAS);
    await conferirOffline();
    alert('Pronto. O mapa e os dados desta safra abrem sem sinal — não precisa fazer login no campo.\n\n' +
          'No iPhone, use o Safari e toque em Compartilhar → "Adicionar à Tela de Início". ' +
          'Só assim o iOS mantém o que foi guardado; um atalho comum é apagado depois de alguns dias sem uso.\n\n' +
          'Para o satélite aparecer ao aproximar sem sinal, toque também em 🛰 Imagens.');
  } catch(e) {
    alert('Não foi possível preparar o uso offline: ' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = rotulo;
  }
}

// ── Carga ────────────────────────────────────────────────────────────────
function iniciarMapa() {
  MAPA = L.map('mapa', { preferCanvas: true }).setView([-9.47, -35.85], 11);

  // maxNativeZoom: acima de ZOOM_MAX_IMAGEM o Leaflet reaproveita o ladrilho
  // desse nível, ampliado, em vez de pedir um que não existe no cache. É o
  // que faz o mapa continuar aparecendo ao aproximar sem sinal — fica menos
  // nítido, mas o contorno dos talhões é vetor e continua exato.
  const satelite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 20, maxNativeZoom: ZOOM_MAX_IMAGEM,
      attribution: 'Imagens: Esri, Maxar, Earthstar Geographics' });
  const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 20, maxNativeZoom: 18, attribution: '© OpenStreetMap' });

  satelite.addTo(MAPA);
  L.control.layers({ 'Satélite': satelite, 'Mapa de ruas': ruas }, null, { position: 'topright' }).addTo(MAPA);
  L.control.scale({ imperial: false }).addTo(MAPA);
}

async function carregarDados() {
  const safra = document.getElementById('selSafra').value;
  if (!safra) return;
  mostrarCarregando('Consultando talhões da safra…');
  try {
    const r = await fetch('api/mapa-talhoes?safra=' + encodeURIComponent(safra));
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Consulta recusada');
    limparErro();
    DADOS = {};
    (j.data || []).forEach(d => { DADOS[d.chave] = d; });
    if (!j.doCache) guardarLocal('dados.' + safra, j.data || []);
    montarLegenda();
    aplicarFiltros();

    // "De quando são estes dados" é a pergunta de quem está no campo sem
    // sinal: sem isso, dado de uma semana atrás parece dado de agora.
    if (j.doCache) {
      avisarSemConexao(safra);
    } else {
      try { localStorage.setItem('mapaTalhoes.dadosEm.' + safra, new Date().toISOString()); } catch(e) {}
      document.getElementById('tarja').classList.remove('on');
    }
    mostrarIdadeDados(safra, j.doCache);
  } catch(e) {
    // Última rede: a cópia local. Só se ela também faltar é que a tela fica
    // sem dado — e aí o motivo aparece escrito.
    const local = lerLocal('dados.' + safra);
    DADOS = {};
    if (local && local.length) {
      local.forEach(d => { DADOS[d.chave] = d; });
      limparErro();
      avisarSemConexao(safra);
    } else {
      mostrarErro('Não foi possível carregar os talhões da safra ' + safra, e);
    }
    montarLegenda();
    aplicarFiltros();
  } finally {
    esconderCarregando();
  }
}

function mostrarCarregando(txt) {
  document.getElementById('carregandoTxt').textContent = txt;
  document.getElementById('carregando').style.display = 'flex';
}
function esconderCarregando() { document.getElementById('carregando').style.display = 'none'; }

(async function iniciar() {
  iniciarMapa();
  // Registro silencioso: quem já abriu a tela uma vez com sinal passa a ter
  // a casca guardada, mesmo sem clicar em "Offline".
  // "'serviceWorker' in navigator" não basta: no Safari em navegação privada
  // e em contexto não seguro a propriedade existe valendo undefined, e o
  // .register estoura. Como isto roda dentro da função async de início, um
  // throw aqui abortava todo o resto — mapa em "Carregando…" para sempre.
  try {
    if (navigator.serviceWorker) {
      // Já havia um worker no comando? Então uma troca de controlador
      // significa versão nova, e a tela precisa recarregar para usá-la. Sem
      // esse guarda, a primeira instalação (que também troca o controlador)
      // recarregaria à toa.
      const jaControlado = !!navigator.serviceWorker.controller;
      let recarregando = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!jaControlado || recarregando) return;
        recarregando = true;
        location.reload();
      });

      // updateViaCache 'none': o próprio sw-mapa.js não pode vir do cache do
      // navegador, senão uma versão nova pode demorar até 24h para ser vista.
      navigator.serviceWorker.register('sw-mapa.js', { updateViaCache: 'none' })
        .then(reg => {
          reg.update().catch(() => {});
          return navigator.serviceWorker.ready;
        })
        .then(() => conferirOffline())
        .catch(() => conferirOffline());
    } else {
      conferirOffline();
    }
  } catch(e) {
    conferirOffline();
  }

  // 1. Geometria (estática, do shapefile da topografia)
  mostrarCarregando('Carregando o desenho dos talhões…');
  try {
    const r = await fetch('mapas/talhoes.geojson');
    GEO = await r.json();
  } catch(e) {
    esconderCarregando();
    alert('Não foi possível carregar o desenho dos talhões: ' + e.message);
    return;
  }

  CAMADA = L.geoJSON(GEO, {
    style: estilo,
    onEachFeature: (f, camada) => {
      camada.bindPopup(() => conteudoPopup(f.properties), { maxWidth: 320 });
      camada.on('mouseover', e => e.target.setStyle({ weight: 3 }));
      camada.on('mouseout',  e => CAMADA.resetStyle(e.target));
    }
  }).addTo(MAPA);
  enquadrarTudo();

  // 2. Safras + dados do ERP
  let safras = null;
  try {
    const r = await fetch('api/mapa-talhoes/safras');
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Consulta recusada');
    safras = j.data || [];
    if (!j.doCache) guardarLocal('safras', safras);
  } catch(e) {
    // Sem a lista, a tela não sabe o que carregar e nada aparece — por isso
    // ela também tem cópia local. O erro só vai à tela se as duas faltarem.
    safras = lerLocal('safras');
    if (!safras || !safras.length) {
      esconderCarregando();
      montarLegenda();
      document.getElementById('selSafra').innerHTML = '<option>—</option>';
      mostrarErro('Não foi possível listar as safras', e);
      return;
    }
  }

  try {
    SAFRAS = safras;
    const sel = document.getElementById('selSafra');
    sel.innerHTML = safras.map(s =>
      `<option value="${esc(s.cod_safra)}">Safra ${esc(s.cod_safra)}${s.atual === 'S' ? ' (atual)' : ''}</option>`).join('');
    const atual = safras.find(s => s.atual === 'S') || safras[0];
    if (atual) { sel.value = atual.cod_safra; await carregarDados(); }
    else { esconderCarregando(); montarLegenda(); }

    // Sem esperar e sem travar a tela: guarda as duas safras mais recentes.
    baixarAutomatico(safras);
  } catch(e) {
    esconderCarregando();
    montarLegenda();
    mostrarErro('Falha ao montar a lista de safras', e);
  }
})();
</script>
